<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 11 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk11", "name": "Фізична культура · 11 клас", "short": "Фізкультура 11", "themes": [{"name": "І чверть. Футбол та загальна фізична підготовка", "lessons": [{"n": "1", "t": "Правила безпеки на уроках. Фізична підготовка в Україні. ЗФП: бігові та стрибкові вправи", "g": "Учень знатиме правила безпеки на заняттях фізичною культурою, розумітиме, як побудована система фізичної підготовки в Україні, та зможе пояснити роль бігових і стрибкових вправ у ЗФП.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Безпека життєдіяльності (БЖД)", "система знань і правил поведінки, що допомагають уникати травм і небезпечних ситуацій під час занять і в побуті."], ["Загальна фізична підготовка (ЗФП)", "різнобічний розвиток сили, швидкості, витривалості, гнучкості та спритності, який є основою для будь-якого виду спорту."], ["Розминка", "комплекс вправ на початку заняття, що розігріває м'язи, суглоби й готує серце та дихання до навантаження."], ["Фізична підготовленість", "рівень розвитку фізичних якостей людини, який можна оцінити за допомогою тестів."]], "th": [{"h": "Загальна фізична підготовка. Правила безпеки та БЖД", "p": ["Більшість травм на уроках фізкультури трапляється не через складність вправ, а через неуважність, поспіх і погану розминку. Тому кожне заняття починається з перевірки спортивної форми, взуття та місця для вправ, а закінчується відновленням.", "Удома правила ті самі: вільний простір навколо себе, стійка неслизька підлога, провітрене приміщення і жодних вправ через біль."], "ul": ["Займайся у зручному спортивному одязі та взутті з неслизькою підошвою, зніми прикраси й годинник.", "Починай із розминки 8–10 хвилин: ходьба, обертання в суглобах, легкі нахили та присідання.", "Не виконуй вправи на мокрій чи нерівній поверхні, поруч із меблями з гострими кутами.", "Під час гри з м'ячем стеж за партнерами, не штовхайся і не бий по м'ячу в бік людей.", "При болю, запамороченні чи нудоті негайно припини вправу і скажи дорослому або вчителю.", "Пий воду невеликими ковтками до і після заняття."]}, {"h": "Загальна фізична підготовка. Фізична підготовка в Україні", "p": ["В Україні фізичне виховання є обов'язковою частиною освіти: від шкільних уроків до спортивних секцій, клубів і масових змагань. Мета — не лише виховати спортсменів, а й зберегти здоров'я кожного громадянина та підготувати молодь до активного життя, праці й захисту Батьківщини.", "Для старшокласника важливо розуміти, що фізична форма — це результат регулярних занять, а не одного тренування. ЗФП дає фундамент, на якому будуються спеціальні навички футболіста, баскетболіста чи волейболіста."], "ul": ["Шкільна фізкультура — базовий рівень, доступний для всіх.", "Позашкільні секції та клуби — поглиблені заняття обраним видом спорту.", "Масовий спорт — забіги, турніри, руханки для людей будь-якого віку.", "Державні тести допомагають оцінити фізичну підготовленість і помітити прогрес.", "Регулярність важливіша за інтенсивність: 3–4 заняття на тиждень дають стійкий результат."]}, {"h": "Футбол. Бігові та стрибкові вправи як основа гри", "p": ["Футболіст за матч безліч разів прискорюється, змінює напрямок і вистрибує за м'ячем. Тому бігові (біг з високим підніманням стегна, захльостом гомілки, приставними кроками) і стрибкові вправи (стрибки на двох і одній нозі, багатоскоки) — обов'язкова частина підготовки.", "Головне правило — якість, а не кількість: м'яке приземлення на передню частину стопи з перекатом, коліна злегка зігнуті й не «завалюються» всередину."], "ul": ["Біг з високим підніманням стегна розвиває силу м'язів-згиначів стегна і частоту кроків.", "Біг із захльостом гомілки тренує задню поверхню стегна та розслаблення.", "Приставні кроки боком готують до швидких зміщень у захисті.", "Стрибки виконуй після розминки, приземляйся м'яко й тихо.", "Типова помилка — приземлення на прямі ноги, що перевантажує колінні суглоби."]}], "f": "Розминка підвищує температуру м'язів, і вони стають еластичнішими — саме тому ризик розтягнення після якісної розминки значно менший.", "pr": ["Запиши у зошит 6 найважливіших, на твою думку, правил безпеки на уроках фізкультури та вдома під час тренувань.", "Склади і виконай власну розминку на 8–10 хвилин (ходьба на місці, обертання в суглобах, нахили, присідання) та запиши її послідовність."], "q": ["Чому розминка є обов'язковою частиною заняття?", "Що означає скорочення ЗФП і які фізичні якості вона розвиває?", "Які бігові вправи корисні футболісту і для чого?", "Як правильно приземлятися після стрибка?"]}, {"n": "2", "t": "ЗФП: бігові, загальнорозвивальні та стрибкові вправи. План харчування футболіста", "g": "Учень зможе пояснити призначення ЗРВ, бігових і стрибкових вправ, а також скласти індивідуальний план харчування футболіста на тиждень.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Загальнорозвивальні вправи (ЗРВ)", "прості вправи для різних груп м'язів і суглобів, що всебічно готують організм до навантаження."], ["Раціон", "набір продуктів і страв, які людина вживає протягом доби чи тижня."], ["Вуглеводи", "основне «паливо» для м'язів під час бігу та ігрових навантажень."], ["Білки", "поживні речовини, необхідні для відновлення та зростання м'язів."], ["Гідратація", "підтримання достатнього рівня рідини в організмі."]], "th": [{"h": "Загальна фізична підготовка. ЗРВ, бігові та стрибкові вправи", "p": ["ЗРВ виконують «зверху вниз»: шия, плечі, руки, тулуб, таз, ноги. Так жоден суглоб не залишиться неготовим. Після ЗРВ переходять до бігових вправ, а вже потім — до стрибків, які дають найбільше навантаження на суглоби.", "Кількість повторень у ЗРВ невелика — 8–10 разів, темп помірний, дихання рівне."], "ul": ["Обертання головою — повільно, без різких рухів назад.", "Колові рухи руками вперед і назад, ривки руками.", "Нахили та повороти тулуба.", "Випади і присідання — коліно над стопою, спина рівна.", "Стрибки на місці на двох ногах — м'яко, на передню частину стопи."]}, {"h": "Футбол. Харчування футболіста: план на тиждень", "p": ["Футболіст витрачає багато енергії, тому харчування має бути регулярним (4–5 прийомів їжі) і різноманітним. Основа — крупи, хліб із борошна грубого помелу, макарони (вуглеводи), м'ясо, риба, яйця, молочні продукти, бобові (білки), овочі й фрукти (вітаміни, мінерали), трохи корисних жирів.", "Перед тренуванням краще поїсти за 2–3 години, щоб не відчувати важкості. Після тренування важливо відновити запаси енергії та випити води. Солодкі газовані напої й фастфуд — не для щоденного раціону."], "ul": ["Сніданок: каша, яйця або сир, фрукт.", "Обід: суп, гарнір із круп, м'ясо чи риба, салат.", "Перекус: йогурт, банан, горіхи.", "Вечеря: легка білкова страва з овочами.", "Вода протягом дня — невеликими порціями, особливо до й після навантаження.", "У день гри — знайома їжа, без експериментів."]}, {"h": "Футбол. Вправи з м'ячем", "p": ["Відчуття м'яча — головна навичка футболіста. Прості вправи на кшталт перекочування м'яча підошвою, легких торкань внутрішньою стороною стопи по черзі та ведення по прямій розвивають контроль.", "Під час вправ дивись не лише на м'яч, а й уперед — так ти вчишся бачити поле."], "ul": ["Перекочування м'яча підошвою вперед-назад і в сторони.", "Торкання м'яча внутрішньою стороною стопи по черзі («перекидання» між ногами).", "Ведення м'яча по прямій короткими дотиками.", "Зупинка м'яча підошвою.", "Удари виконуй тільки в напрямку, де немає людей."]}], "f": "Навіть невелике зневоднення, коли людина втрачає з потом лише кілька відсотків рідини, помітно знижує витривалість і концентрацію.", "pr": ["Склади індивідуальний план харчування футболіста на тиждень (7 днів, 4–5 прийомів їжі) у вигляді таблиці; познач, де основні джерела білків і вуглеводів.", "Виконай комплекс ЗРВ «зверху вниз» із 8 вправ по 8–10 повторень і запиши його у зошит."], "q": ["У якій послідовності виконують ЗРВ і чому?", "Які поживні речовини найважливіші для футболіста і для чого вони потрібні?", "За скільки часу до тренування краще поїсти?", "Які вправи з м'ячем розвивають його «відчуття»?"]}, {"n": "3", "t": "ЗФП. Планування та методика розвитку фізичних якостей. Вправи з м'ячем", "g": "Учень знатиме основні фізичні якості та принципи їх розвитку і зможе спланувати тиждень самостійних тренувань.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Фізичні якості", "властивості людини, що визначають її рухові можливості: сила, швидкість, витривалість, гнучкість, спритність."], ["Принцип поступовості", "поступове збільшення навантаження, щоб організм встигав пристосовуватися."], ["Тренувальне навантаження", "обсяг і інтенсивність вправ, які виконують за заняття."], ["Суперкомпенсація", "фаза відновлення, коли працездатність після відпочинку стає трохи вищою, ніж до тренування."]], "th": [{"h": "Загальна фізична підготовка. Методика розвитку фізичних якостей", "p": ["Кожна якість розвивається своїми методами. Силу — вправами з власною вагою або обтяженням у невеликій кількості повторень; швидкість — короткими прискореннями з повним відпочинком; витривалість — тривалою роботою помірної інтенсивності; гнучкість — розтяжкою після розігріву; спритність — вправами на координацію та зміну напрямку.", "Важливо дотримуватися принципів: поступовість, регулярність, індивідуальний підхід і чергування навантаження з відпочинком."], "ul": ["Сила: присідання, віджимання, планка, 3 підходи по 8–15 повторень.", "Швидкість: прискорення 10–30 м, відпочинок до повного відновлення дихання.", "Витривалість: рівномірний біг або ходьба 20–40 хвилин.", "Гнучкість: статичні розтяжки по 20–30 секунд після розминки.", "Спритність: човниковий біг, вправи з м'ячем, зміна напрямку."]}, {"h": "Загальна фізична підготовка. Планування самостійних тренувань", "p": ["План тренувань на тиждень повинен включати різні види навантаження і дні відпочинку. Не варто тренувати ту саму групу м'язів важко два дні поспіль — м'язам потрібно 24–48 годин на відновлення.", "Записуй тренування у щоденник: що робив, скільки, як почувався. Так легко побачити прогрес і вчасно помітити перевтому."], "ul": ["Визнач мету: що саме хочеш покращити.", "Розподіли якості по днях: наприклад, сила — пн і чт, витривалість — вт і сб, гнучкість — щодня після занять.", "Заплануй щонайменше 1–2 дні активного відпочинку.", "Кожне заняття: розминка — основна частина — заминка.", "Збільшуй навантаження не більше ніж на 10% на тиждень."]}, {"h": "Футбол. Вправи з м'ячем і гра", "p": ["У футболі всі фізичні якості працюють разом: швидкість потрібна для ривка, сила — для боротьби за м'яч, витривалість — щоб не «здуватися» до кінця гри, спритність — для обведення. Тому ігрові вправи з м'ячем — чудовий спосіб розвивати кілька якостей одночасно.", "У навчальній грі пам'ятай про чесну гру: без грубощів, з повагою до суперника."], "ul": ["Ведення м'яча зі зміною напрямку розвиває спритність.", "Короткі ривки за м'ячем — швидкість.", "Гра на малому майданчику — витривалість і швидкість ухвалення рішень.", "Передачі в парах — точність і координацію.", "Після гри — заминка й розтяжка."]}], "f": "Сон є частиною тренувального процесу: саме під час сну організм найактивніше відновлює м'язи після навантаження.", "pr": ["Склади план самостійних тренувань на тиждень, розподіливши розвиток сили, витривалості, гнучкості та спритності; познач дні відпочинку.", "Виконай простий силовий комплекс: присідання 3×12, віджимання від опори 3×8–10, планка 3×20–30 с; запиши самопочуття."], "q": ["Назви п'ять основних фізичних якостей.", "Що таке принцип поступовості?", "Чому не варто тренувати одну групу м'язів важко два дні поспіль?", "Які якості розвиваються під час гри у футбол?"]}, {"n": "4", "t": "ЗФП: біг на витривалість 1000–1500 м. Вправи на розвиток сили. Вправи з м'ячем", "g": "Учень знатиме техніку тривалого бігу, правила розподілу сил і дихання та зможе пояснити, як розвивати силу вправами з власною вагою.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Витривалість", "здатність тривало виконувати роботу без зниження її ефективності."], ["Аеробне навантаження", "робота помірної інтенсивності, під час якої м'язи отримують достатньо кисню."], ["Темп бігу", "швидкість, з якою бігун долає дистанцію, наприклад хвилин на кілометр."], ["Ритм дихання", "узгодження вдихів і видихів із кроками під час бігу."]], "th": [{"h": "Загальна фізична підготовка. Біг на витривалість 1000–1500 м", "p": ["Біг на 1000–1500 м без урахування часу вчить рівномірно розподіляти сили. Найчастіша помилка — занадто швидкий старт, після якого бігун «згасає» на середині дистанції. Краще бігти в темпі, за якого можна вимовити кілька слів.", "Техніка: тулуб трохи нахилений уперед, руки зігнуті приблизно під прямим кутом і рухаються вздовж тулуба, плечі розслаблені, стопа ставиться м'яко під себе."], "ul": ["Почни спокійно, перші 200 м — розігрівальний темп.", "Дихай ритмічно: наприклад, вдих на 2–3 кроки, видих на 2–3 кроки.", "Дихай носом і ротом одночасно, коли навантаження зростає.", "Не зупиняйся різко після фінішу — пройдися 2–3 хвилини.", "При болю в грудях або запамороченні — негайно зупинись."]}, {"h": "Загальна фізична підготовка. Вправи на розвиток сили", "p": ["Для старшокласника найбезпечніший спосіб розвивати силу — вправи з власною вагою: віджимання, присідання, випади, підтягування, планка. Вони зміцнюють м'язи і зв'язки, покращують поставу.", "Якість техніки важливіша за кількість: краще 8 правильних повторень, ніж 20 з прогнутою спиною."], "ul": ["Віджимання: тіло пряме від п'ят до голови, лікті під кутом до тулуба.", "Присідання: п'ятки на підлозі, коліна в напрямку носків.", "Планка: живіт підтягнутий, поперек не провисає.", "Між підходами відпочинок 1–2 хвилини.", "Видих — на зусиллі, вдих — на розслабленні."]}, {"h": "Футбол. Вправи з м'ячем і гра", "p": ["Витривалість для футболіста — це здатність до кінця матчу зберігати швидкість і точність. Вправи з м'ячем після бігу вчать грати технічно навіть при втомі.", "Під час гри стеж за власним самопочуттям і не забувай про відновлення дихання в паузах."], "ul": ["Ведення м'яча по колу в помірному темпі.", "Передачі в парах внутрішньою стороною стопи.", "Зупинка м'яча підошвою та внутрішньою стороною стопи.", "Гра з обмеженням дотиків розвиває швидке мислення.", "Пий воду після навантаження."]}], "f": "Під час тривалого бігу серце тренованої людини перекачує більше крові за одне скорочення, тому в стані спокою її пульс зазвичай нижчий, ніж у нетренованої.", "pr": ["Опиши в зошиті техніку бігу на витривалість і 3 типові помилки, які заважають добре пробігти 1000–1500 м.", "Виконай силовий комплекс: присідання 3×15, віджимання 3×8–12, планка 3×30 с, випади на місці 2×10 на кожну ногу."], "q": ["Чому не варто стартувати надто швидко на довгій дистанції?", "Як правильно дихати під час тривалого бігу?", "Які вправи з власною вагою розвивають силу?", "Що робити одразу після фінішу?"]}, {"n": "5", "t": "ЗФП: 12-хвилинний біг на витривалість. Сила. Вправи з м'ячем і гра", "g": "Учень знатиме, як виконувати 12-хвилинний біг, контролювати пульс і самопочуття та оцінювати свою витривалість.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Тест Купера", "тест на витривалість, під час якого потрібно пробігти або пройти якомога більшу відстань за 12 хвилин."], ["Частота серцевих скорочень (ЧСС)", "кількість ударів серця за хвилину, що показує інтенсивність навантаження."], ["Самоконтроль", "регулярне спостереження за своїм самопочуттям, пульсом і результатами під час занять."], ["Відновлення", "процес повернення організму до спокійного стану після навантаження."]], "th": [{"h": "Загальна фізична підготовка. Біг до 12 хвилин", "p": ["12-хвилинний біг — це класичний спосіб перевірити витривалість. Завдання — рівномірно бігти весь час, а якщо сил не вистачає — перейти на швидку ходьбу, а не зупинятися. Результат — пройдена відстань.", "Найкраща тактика — рівний темп від першої до останньої хвилини, а прискорення — лише наприкінці."], "ul": ["Перед тестом — розминка 10 хвилин.", "Перші 2 хвилини біжи трохи повільніше, ніж хочеться.", "Рахуй кола або орієнтири, щоб знати пройдену відстань.", "Якщо важко — перейди на ходьбу, але не зупиняйся.", "Після тесту — заминка й розтяжка."]}, {"h": "Загальна фізична підготовка. Самоконтроль пульсу", "p": ["Пульс вимірюють на зап'ясті або на шиї: рахують удари за 10 секунд і множать на 6. Вимірювання до, одразу після і через 2–3 хвилини після навантаження показує, наскільки швидко організм відновлюється.", "Якщо пульс довго не знижується, а самопочуття погане — навантаження було надмірним, і наступного разу його треба зменшити."], "ul": ["Пульс у спокої вимірюй зранку після пробудження.", "Порівнюй показники з тижня на тиждень.", "Швидке відновлення пульсу — ознака хорошої витривалості.", "Записуй результати в щоденник самоконтролю.", "Задишка, блідість, біль — сигнали зупинитися."]}, {"h": "Футбол. Вправи з м'ячем і гра", "p": ["Футбольний матч — це чергування бігу підтюпцем, ходьби та ривків. Тому вправи на витривалість поєднують з ігровими: ведення м'яча на швидкості, передачі в русі, гра на малих полях.", "Після важкого бігу тримай техніку простою: точні короткі передачі."], "ul": ["Ведення м'яча з прискоренням на коротких відрізках.", "Передачі в русі в парах.", "Гра 3×3 або 4×4 на маленькому полі.", "Перерви для відновлення дихання.", "Повага до партнерів і суперників."]}], "f": "Тест на 12-хвилинний біг запропонував американський лікар Кеннет Купер, тому його й називають тестом Купера.", "pr": ["Виміряй свій пульс у спокої (за 10 с × 6) три дні поспіль зранку і запиши результати в таблицю самоконтролю.", "Виконай вдома 20 присідань, потім виміряй пульс одразу і через 2 хвилини; запиши, наскільки він відновився."], "q": ["Як виконується тест Купера і що є його результатом?", "Як правильно виміряти пульс?", "Про що свідчить швидке відновлення пульсу після навантаження?", "Яка тактика бігу найкраща для 12-хвилинного тесту?"]}, {"n": "6", "t": "ЗФП: тривалий біг без урахування часу. Швидкісно-силові вправи. Вправи з м'ячем", "g": "Учень розумітиме, що таке швидкісно-силові якості, як їх розвивати безпечно та як вони допомагають футболісту.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Швидкісно-силові якості", "здатність проявляти велику силу за якнайкоротший час, наприклад у стрибку чи ривку."], ["Вибухова сила", "максимально швидке зусилля м'язів на початку руху."], ["Багатоскоки", "серія стрибків з ноги на ногу або на двох ногах поспіль."], ["Рівномірний біг", "біг з однаковою швидкістю на всьому відрізку дистанції."]], "th": [{"h": "Загальна фізична підготовка. Тривалий біг без урахування часу", "p": ["Біг без урахування часу знімає «тиск» результату й дозволяє зосередитися на техніці та диханні. Це основний засіб розвитку загальної витривалості.", "Рівномірний темп, розслаблені плечі й м'яка постановка стопи — головні ознаки правильного тривалого бігу."], "ul": ["Біжи в розмовному темпі.", "Руки працюють уздовж тулуба, кулаки не стиснуті.", "Дивись уперед, а не під ноги.", "Після бігу — ходьба й розтяжка.", "Взуття з амортизацією зменшує навантаження на суглоби."]}, {"h": "Загальна фізична підготовка. Швидкісно-силові вправи", "p": ["До швидкісно-силових вправ належать стрибки (у довжину з місця, вгору, багатоскоки), короткі прискорення, кидки набивного м'яча. Їх виконують у свіжому стані, невеликими серіями, з повним відпочинком.", "Тренувати вибухову силу без якісної розминки небезпечно — м'язи й сухожилля мають бути розігріті."], "ul": ["Стрибки вгору з присіду — 2–3 серії по 6–8 разів.", "Багатоскоки — на м'якому покритті, на 15–20 м.", "Прискорення 10–20 м з місця.", "Відпочинок між серіями 1,5–2 хвилини.", "Якщо техніка погіршилась — зупинись."]}, {"h": "Футбол. Вправи з м'ячем і гра", "p": ["У футболі швидкісно-силові якості проявляються в ривку до м'яча, стрибку для удару головою, сильному ударі по воротах. Розвиваючи їх, футболіст виграє єдиноборства й встигає першим до м'яча.", "У грі поєднуй ривки з технікою: прискорення з веденням, зупинка, передача."], "ul": ["Ривок до м'яча з подальшою передачею.", "Ведення з різкою зміною швидкості.", "Удари по воротах після короткого розбігу.", "Боротьба за м'яч — корпусом, без штовхання руками.", "Дотримуйся правил гри й безпеки."]}], "f": "Стрибок у довжину з місця вважають одним із найпростіших і найнадійніших тестів на швидкісно-силову підготовленість ніг.", "pr": ["Випиши 5 швидкісно-силових вправ і поясни, як кожна з них допомагає футболісту.", "Виконай вдома 3 серії по 6 повільних, контрольованих присідань із виходом на носки (без стрибків) та 3 підходи планки по 30 с."], "q": ["Що таке швидкісно-силові якості?", "Чому вибухові вправи виконують на початку основної частини заняття?", "Які прояви вибухової сили є у футболі?", "Як має виглядати правильний тривалий біг?"]}, {"n": "7", "t": "Спринт: біг на 60 м. Бігові та стрибкові вправи. Підтягування. Гра", "g": "Учень знатиме техніку спринтерського бігу на 60 м (старт, розгін, біг по дистанції, фініш) і правильну техніку підтягування.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Спринт", "біг на короткі дистанції з максимальною швидкістю."], ["Низький старт", "стартове положення з опорою на руки, що дозволяє швидко розігнатися."], ["Стартовий розгін", "частина дистанції після старту, на якій бігун поступово випрямляється і набирає швидкість."], ["Фінішний кидок", "нахил тулуба вперед на останньому кроці для швидшого перетину лінії фінішу."]], "th": [{"h": "Загальна фізична підготовка. Техніка бігу на 60 м", "p": ["Біг на 60 м складається з чотирьох фаз: старт, стартовий розгін, біг по дистанції та фініш. За командою «На старт!» бігун займає положення, «Увага!» — піднімає таз, «Марш!» — потужно відштовхується. Під час розгону тулуб поступово випрямляється, кроки стають довшими.", "На дистанції важливі швидкі активні рухи рук і високе піднімання стегна. Фінішувати потрібно на повній швидкості, не гальмуючи перед лінією."], "ul": ["Старт — вибуховий, перші кроки короткі й часті.", "Розгін — плавне випрямлення тулуба, без різкого «вставання».", "Дистанція — біг на передній частині стопи, руки зігнуті.", "Фініш — нахил грудьми вперед, гальмування лише після лінії.", "Типова помилка — озиратися на суперників."]}, {"h": "Загальна фізична підготовка. Підтягування", "p": ["Підтягування на перекладині — показник сили м'язів рук, плечового поясу і спини. Хват зверху на ширині плечей, вис на прямих руках, підтягування до положення, коли підборіддя вище перекладини, потім контрольоване опускання.", "Розгойдування й ривки ногами роблять вправу менш ефективною і можуть призвести до травми."], "ul": ["Перед підтягуванням розімни плечі й кисті.", "Тіло пряме, ноги разом, без розгойдування.", "Підборіддя вище перекладини — повтор зараховано.", "Опускайся повільно до повного випрямлення рук.", "Дівчата виконують підтягування з вису лежачи на низькій перекладині."]}, {"h": "Футбол. Спринт у грі", "p": ["Ривки на 5–30 м — найважливіші моменти матчу: вихід на ударну позицію, повернення в захист, боротьба за м'яч. Техніка спринту допомагає футболісту швидше стартувати з будь-якого положення.", "У навчальній грі пробуй застосовувати швидкі старти після зупинки, але без ризикованих зіткнень."], "ul": ["Ривок після передачі на вільне місце.", "Старт з положення боком або спиною до напрямку.", "Повернення в захист після втрати м'яча.", "Гальмування перед зміною напрямку — на зігнутих ногах.", "Чесна боротьба без підніжок."]}], "f": "У спринті більшість бігунів досягає максимальної швидкості не одразу, а приблизно на середині короткої дистанції, тому важливо вміти зберегти її до фінішу.", "pr": ["Намалюй схему бігу на 60 м і підпиши всі фази з коротким описом техніки кожної.", "Виконай вправи для м'язів спини й рук: «човник» лежачи на животі 3×10, віджимання 3×8–10, утримання вису на перекладині (якщо є безпечна) або планка 3×30 с."], "q": ["Які фази має біг на 60 м?", "Що робить бігун за командами «На старт!», «Увага!», «Марш!»?", "Як правильно виконувати підтягування?", "Де у футболі знадобиться техніка спринту?"]}, {"n": "8", "t": "Спринт: біг на 100 м. Бігові та стрибкові вправи. Підтягування. Гра", "g": "Учень знатиме особливості бігу на 100 м, уміння зберігати швидкість на дистанції та способи розвитку сили для підтягування.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Стартові колодки", "спеціальні упори, що допомагають спринтерові потужно відштовхнутися на старті."], ["Частота кроків", "кількість кроків за одиницю часу під час бігу."], ["Довжина кроку", "відстань між місцями приземлення лівої і правої ноги під час бігу."], ["Фальстарт", "початок руху до стартового сигналу, що є порушенням правил."]], "th": [{"h": "Загальна фізична підготовка. Біг на 100 м", "p": ["Біг на 100 м — найпрестижніша спринтерська дистанція. Порівняно з 60 м тут важливіше не лише швидко розігнатися, а й утримати швидкість на другій половині, коли накопичується втома.", "Швидкість бігу залежить від частоти й довжини кроків. Щоб їх збільшити, виконують бігові вправи: біг з високим підніманням стегна, біг стрибками, прискорення."], "ul": ["Старт за командами, без фальстарту.", "Після розгону — вільний розслаблений біг на максимальній швидкості.", "Не напружуй обличчя й плечі — це гальмує рух.", "Тримай напрям по своїй доріжці.", "Після фінішу — плавне гальмування."]}, {"h": "Загальна фізична підготовка. Розвиток сили для підтягування", "p": ["Якщо підтягнутися поки важко, допомагають підвідні вправи: вис на перекладині, повільне опускання з верхнього положення, підтягування з вису лежачи, віджимання та вправи для м'язів спини.", "Тренуй ці вправи 2–3 рази на тиждень і щотижня трохи збільшуй кількість повторень."], "ul": ["Вис на прямих руках 15–30 с.", "Негативні повтори: повільне опускання 3–5 с.", "Підтягування з вису лежачи на низькій перекладині.", "Віджимання і «човник» на животі для м'язів спини.", "Відпочинок між підходами 1,5–2 хвилини."]}, {"h": "Футбол. Гра з використанням швидкості", "p": ["Швидкі гравці особливо корисні в контратаках, коли команда швидко переходить від захисту до нападу. Але швидкість без контролю м'яча мало що дає — тому поєднуй ривки з веденням і передачами.", "У грі вчися обирати момент для прискорення, а не бігати на максимумі весь час."], "ul": ["Контратака — швидкий перехід від захисту до нападу.", "Ведення на швидкості — м'яч відкидається трохи вперед.", "Передача на хід партнеру.", "Відпочинок у паузах гри.", "Безпечна боротьба за м'яч."]}], "f": "На змаганнях з легкої атлетики фальстарт фіксують спеціальні датчики у стартових колодках, які реагують на занадто ранній рух спортсмена.", "pr": ["Порівняй у таблиці біг на 60 м і 100 м: що спільного і чим відрізняється тактика та техніка.", "Виконай комплекс для м'язів спини і рук: віджимання 3×10, «човник» 3×12, планка на ліктях 3×30–40 с."], "q": ["Від чого залежить швидкість бігу?", "Що таке фальстарт?", "Які підвідні вправи допомагають навчитися підтягуватися?", "Коли футболісту вигідно використовувати швидкість?"]}, {"n": "9", "t": "Біг на 400–500 м. Вправи на формування постави. Бігові та стрибкові вправи", "g": "Учень знатиме особливості бігу на середні відрізки 400–500 м та вправи для формування правильної постави.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Постава", "звичне положення тіла людини, коли вона стоїть, сидить і рухається."], ["Сколіоз", "бічне викривлення хребта, яке може розвиватися через неправильну поставу."], ["М'язовий корсет", "м'язи спини, живота й боків, що утримують хребет у правильному положенні."], ["Біг на повороті", "біг по виражу доріжки з легким нахилом тулуба всередину кола."]], "th": [{"h": "Загальна фізична підготовка. Біг на 400–500 м", "p": ["Дистанція 400–500 м поєднує швидкість і витривалість: її біжать швидко, але не на максимумі з першого метра. Найкраща тактика — швидкий, але контрольований початок, рівний біг у середині та фінішне прискорення.", "На повороті тулуб трохи нахиляють усередину, а праву руку відводять ширше, щоб зберегти рівновагу."], "ul": ["Не витрачай усі сили на перших 100 м.", "На повороті — легкий нахил ліворуч.", "Дихай глибоко й ритмічно.", "На останніх 100 м зберігай роботу рук — це підтримує швидкість.", "Після фінішу пройдися, не сідай одразу."]}, {"h": "Загальна фізична підготовка. Вправи на формування постави", "p": ["Правильна постава — це рівна голова, розправлені плечі, підтягнутий живіт і природні вигини хребта. Багато годин за комп'ютером і телефоном послаблюють м'язи спини, тому старшокласникам особливо важливо регулярно зміцнювати м'язовий корсет.", "Перевірити поставу просто: стань спиною до стіни так, щоб її торкалися п'яти, сідниці, лопатки й потилиця."], "ul": ["«Човник» лежачи на животі.", "Планка на ліктях і бокова планка.", "«Кішка-корова» стоячи на четвереньках.", "Ходьба з книжкою на голові.", "Кожні 40–45 хвилин сидіння — коротка руханка."]}, {"h": "Футбол. Постава і техніка гравця", "p": ["Сильний м'язовий корсет допомагає футболісту втримувати рівновагу в боротьбі, точніше бити по м'ячу і менше травмуватися. Слабкі м'язи кору — одна з причин болю в попереку у спортсменів.", "Під час ведення м'яча тримай голову піднятою: це і правильна постава, і огляд поля."], "ul": ["Під час ведення голова піднята, погляд уперед.", "Корпус над м'ячем при ударі допомагає м'ячу не злітати.", "Стійкість у боротьбі залежить від м'язів кору.", "Вправи на поставу — частина розминки футболіста.", "Після гри — розтяжка спини."]}], "f": "Тривале нахилення голови до смартфона збільшує навантаження на шийний відділ хребта в кілька разів, тому лікарі радять тримати екран на рівні очей.", "pr": ["Перевір свою поставу біля стіни і запиши результат; склади список із 5 вправ для покращення постави.", "Виконай комплекс для постави: «човник» 3×10, планка 3×30 с, бокова планка 2×20 с на кожен бік, «кішка-корова» 10 разів."], "q": ["Яка тактика бігу на 400–500 м найефективніша?", "Як перевірити правильність постави?", "Які вправи зміцнюють м'язовий корсет?", "Чому постава важлива для футболіста?"]}, {"n": "10", "t": "Стрибок у довжину з місця. Вправи на розвиток сили. Рухлива та спортивна гра", "g": "Учень знатиме техніку стрибка у довжину з місця, правила вимірювання результату та вправи для розвитку сили ніг.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Відштовхування", "потужне розгинання ніг у суглобах, що надає тілу швидкості для польоту."], ["Мах руками", "швидкий рух руками вперед-вгору, що допомагає збільшити дальність стрибка."], ["Приземлення", "завершальна фаза стрибка, коли спортсмен м'яко опускається на обидві ноги."], ["Рухлива гра", "гра з простими правилами, що розвиває швидкість, спритність і командну взаємодію."]], "th": [{"h": "Загальна фізична підготовка. Стрибок у довжину з місця", "p": ["Вихідне положення: ноги на ширині стоп, носки біля лінії. Руки відводяться назад, ноги згинаються, тулуб нахиляється вперед — це «замах». Далі одночасно потужне відштовхування двома ногами і мах руками вперед-вгору. У польоті ноги підтягуються вперед, приземлення — м'яко, на обидві ноги з перекатом з п'ят на носки й присіданням.", "Результат вимірюють від лінії до найближчого сліду (зазвичай від п'ят). Тому падати назад на руки не можна — результат зменшиться."], "ul": ["Не заступай за лінію перед стрибком.", "Відштовхуйся двома ногами одночасно.", "Мах руками синхронний з відштовхуванням.", "Приземлення — вперед, не назад.", "Виконуй стрибок лише на неслизькій поверхні."]}, {"h": "Загальна фізична підготовка. Розвиток сили ніг", "p": ["Сильні ноги — запорука далекого стрибка, швидкого бігу й потужного удару. Для їх розвитку використовують присідання, випади, підйоми на носки, вправу «стільчик» біля стіни.", "Сила м'язів ніг зростає поступово — тренуйся 2–3 рази на тиждень."], "ul": ["Присідання 3×15.", "Випади вперед 2×10 на кожну ногу.", "Підйоми на носки 3×20.", "«Стільчик» біля стіни 3×30 с.", "Розтяжка м'язів стегна після тренування."]}, {"h": "Футбол. Рухлива та спортивна гра", "p": ["Рухливі ігри (естафети, «квач», ігри з м'ячем) — чудовий засіб розвитку швидкості й реакції. Спортивна гра (футбол) має чіткі правила, суддю, тактику.", "У будь-якій грі головне — безпечна поведінка і чесність."], "ul": ["Слухай сигнали вчителя чи судді.", "Не штовхай і не тримай суперника.", "Під час естафет — передача естафети рукою, без кидків.", "Поважай рішення судді.", "Підтримуй партнерів по команді."]}], "f": "Стрибок у довжину з місця колись був олімпійським видом легкої атлетики, але згодом його виключили з програми Ігор.", "pr": ["Опиши та намалюй фази стрибка у довжину з місця: підготовка, відштовхування, політ, приземлення.", "Виконай комплекс для ніг: присідання 3×15, випади 2×10 на кожну ногу, «стільчик» біля стіни 3×30 с."], "q": ["З яких фаз складається стрибок у довжину з місця?", "Як вимірюють результат стрибка?", "Чому важливо не падати назад під час приземлення?", "Чим рухлива гра відрізняється від спортивної?"]}, {"n": "11", "t": "Удари та зупинка м'яча. Фізична культура в сім'ї. Здоров'я майбутньої матері", "g": "Учень знатиме техніку удару та зупинки м'яча, розумітиме роль фізичної культури в сімейному житті та її вплив на здоров'я.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Удар внутрішньою стороною стопи", "найточніший удар у футболі, яким виконують короткі й середні передачі."], ["Зупинка м'яча", "прийом, коли гравець гасить швидкість м'яча й залишає його під контролем."], ["Здоровий спосіб життя", "поведінка, що зберігає й зміцнює здоров'я: рух, раціональне харчування, сон, відмова від шкідливих звичок."], ["Гармонійний розвиток", "рівномірний розвиток фізичних, психічних і соціальних якостей людини."]], "th": [{"h": "Футбол. Удари та зупинка м'яча", "p": ["Удар внутрішньою стороною стопи: опорна нога ставиться поряд з м'ячем, носок спрямований на ціль; ударна нога розвертається назовні, стопа фіксована, удар — серединою м'яча. Зупинка внутрішньою стороною стопи: ногу виносять назустріч м'ячу і в момент контакту трохи відводять назад, «гасячи» його швидкість.", "Швидкісно-силові вправи (стрибки, прискорення) роблять удар сильнішим, а ривок до м'яча — швидшим."], "ul": ["Опорна нога — поруч з м'ячем, коліно трохи зігнуте.", "Стопа ударної ноги напружена.", "Погляд — на м'яч у момент удару.", "Під час зупинки нога «піддається» м'ячу.", "Типова помилка — удар носком: неточно й травмонебезпечно."]}, {"h": "Загальна фізична підготовка. Фізична культура в сім'ї (для юнаків)", "p": ["Родина, у якій рух — частина звичного життя, має міцніше здоров'я. Спільні прогулянки, велосипедні поїздки, ігри з м'ячем із дітьми, ранкова зарядка формують у дітей звичку до руху на все життя.", "Батько, який сам займається спортом, є прикладом для дітей. Фізична підготовленість також допомагає чоловікові бути витривалим у праці та готовим захищати родину й країну."], "ul": ["Спільна активність: походи, велопрогулянки, ігри на природі.", "Ранкова зарядка всією сім'єю.", "Особистий приклад важливіший за поради.", "Обмеження «екранного» часу на користь руху.", "Повага до різних уподобань членів сім'ї."]}, {"h": "Загальна фізична підготовка. Фізичні вправи і здоров'я майбутньої матері (для дівчат)", "p": ["Регулярні помірні фізичні вправи в юності зміцнюють м'язи спини, живота і тазового дна, покращують роботу серця, судин і дихання. Це створює добрий запас здоров'я на майбутнє, зокрема для материнства.", "Корисні плавання, ходьба, гімнастика, танці, вправи на поставу і гнучкість. Важливо уникати перевтоми та прислухатися до свого організму, а з питань здоров'я радитися з лікарем."], "ul": ["Вправи для м'язів спини та живота формують правильну поставу.", "Кардіонавантаження зміцнює серцево-судинну систему.", "Розтяжка підтримує рухливість суглобів.", "Раціональне харчування і повноцінний сон — частина здоров'я.", "Регулярність важливіша за інтенсивність."]}], "f": "Діти частіше обирають активний спосіб життя, якщо бачать, що їхні батьки регулярно займаються фізичною активністю.", "pr": ["Склади план «активних вихідних» для своєї родини: 3–4 спільні рухові заняття, безпечні для всіх її членів.", "Опиши у зошиті техніку удару внутрішньою стороною стопи і зупинки м'яча; виконай без м'яча імітацію удару по 10 разів кожною ногою, тримаючи рівновагу."], "q": ["Як виконується удар внутрішньою стороною стопи?", "У чому секрет м'якої зупинки м'яча?", "Як фізична культура в сім'ї впливає на здоров'я дітей?", "Чому фізичні вправи в юності важливі для майбутнього здоров'я?"]}, {"n": "12", "t": "Метання м'яча на дальність. Швидкісно-силові вправи. Біг на 500–600 м. Гра", "g": "Учень знатиме техніку метання малого м'яча на дальність з розбігу та правила безпеки під час метань.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Метання", "кидок снаряда (м'яча, гранати, списа) рукою на дальність або в ціль."], ["Схрещений крок", "крок у розбігу метальника, під час якого права нога заходить перед лівою, а тулуб розвертається боком."], ["Фінальне зусилля", "завершальна фаза метання, коли снаряд отримує найбільшу швидкість."], ["Кут вильоту", "кут, під яким снаряд залишає руку; від нього залежить дальність польоту."]], "th": [{"h": "Загальна фізична підготовка. Метання м'яча на дальність", "p": ["Метання складається з розбігу, відведення м'яча, схрещеного кроку, фінального зусилля та гальмування. Сила кидка йде «знизу вгору»: від ніг через таз і тулуб до плеча й кисті. Тому кидати лише рукою — неефективно і травмонебезпечно для ліктя та плеча.", "Правила безпеки: метати лише за командою, в один бік, ніхто не стоїть у секторі; підбирати м'ячі тільки за сигналом."], "ul": ["Розбіг — поступове прискорення.", "Відведення м'яча назад на пряму руку.", "Схрещений крок — поворот боком до напрямку кидка.", "Кидок через плече, лікоть вище плеча.", "Не перетинай лінію метання після кидка."]}, {"h": "Загальна фізична підготовка. Біг на 500–600 м та швидкісно-силові вправи", "p": ["Дистанція 500–600 м вимагає вміння терпіти втому. Біжи рівномірно, на повороті нахиляйся всередину, на фініші підключай роботу рук.", "Швидкісно-силові вправи (стрибки, кидки набивного м'яча двома руками) розвивають потужність, потрібну і в метанні, і в футболі."], "ul": ["Рівномірний темп на перших двох третинах дистанції.", "Фінішне прискорення на останніх 100 м.", "Кидки набивного м'яча від грудей і з-за голови.", "Стрибки вгору на місці.", "Заминка після бігу."]}, {"h": "Футбол. Гра", "p": ["Навчальна гра закріплює прийоми, вивчені на попередніх уроках: ведення, передачі, удари і зупинки. Головне — грати командно й не «тягнути» м'яч на себе.", "Після інтенсивного бігу й метань гра має бути помірною, з паузами для відновлення."], "ul": ["Відкривайся для передачі.", "Грай в один-два дотики, коли це можливо.", "Повертайся в захист після втрати м'яча.", "Дотримуйся правил чесної гри.", "Пий воду в перервах."]}], "f": "У метанні дальність польоту залежить передусім від швидкості вильоту снаряда, тому навіть невелике покращення техніки розбігу помітно збільшує результат.", "pr": ["Намалюй схему метання м'яча з розбігу і підпиши фази та правила безпеки під час метань.", "Виконай імітацію метання без м'яча перед дзеркалом (повільно, 10 разів кожною рукою) та вправи на рухливість плечей: колові рухи руками 2×15."], "q": ["З яких фаз складається метання м'яча на дальність?", "Чому кидати лише рукою неправильно?", "Які правила безпеки потрібно виконувати під час метань?", "Як правильно пробігти 500–600 м?"]}, {"n": "13", "t": "Метання м'яча на дальність: удосконалення. Швидкісно-силові вправи. Вправи з м'ячем", "g": "Учень знатиме типові помилки під час метання та способи їх виправлення, а також вправи для розвитку сили плечового поясу.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Плечовий пояс", "кістки й м'язи, що з'єднують руки з тулубом і забезпечують рухи рук."], ["Обгін снаряда", "положення, коли ноги й таз випереджають руку з м'ячем, створюючи «натяг» для сильного кидка."], ["Гальмування після кидка", "зупинка спортсмена після метання, щоб не заступити за лінію."], ["Набивний м'яч", "важкий м'яч для силових і швидкісно-силових вправ."]], "th": [{"h": "Загальна фізична підготовка. Удосконалення метання", "p": ["Найчастіші помилки: кидок «від плеча» без участі ніг, низький лікоть, зупинка перед кидком, кидок занадто високо або занадто низько. Виправити їх допомагають імітаційні вправи і кидки з місця з акцентом на «натяг» тіла.", "Оптимальний кут вильоту малого м'яча — дещо менший за 45°. Не потрібно кидати «в небо» — м'яч має летіти вперед-вгору."], "ul": ["Лікоть вище плеча в момент кидка.", "Розбіг без зупинки перед фінальним зусиллям.", "Ліва нога ставиться твердо — це «упор» для кидка.", "Кисть завершує рух, «підхльостуючи» м'яч.", "Кидок лише після розминки плеча й ліктя."]}, {"h": "Загальна фізична підготовка. Швидкісно-силові вправи для рук і тулуба", "p": ["Для сильного кидка потрібні сильні м'язи тулуба й плечового поясу. Кидки набивного м'яча, віджимання, вправи на повороти тулуба розвивають потрібні якості.", "Кидки набивного м'яча виконують у парі або в стіну, на відстані від інших учнів."], "ul": ["Кидок набивного м'яча двома руками з-за голови.", "Кидок від грудей партнеру.", "Віджимання з вибуховим відштовхуванням (для підготовлених).", "Повороти тулуба з м'ячем у руках.", "Розтяжка плечей після вправ."]}, {"h": "Футбол. Вправи з м'ячем", "p": ["Закріплюємо удари і зупинки м'яча в русі. Передачі виконуємо на різну відстань, змінюючи силу удару.", "Добрий футболіст однаково впевнено працює обома ногами — тренуй і «слабку» ногу."], "ul": ["Передачі в парах на 5, 10 і 15 м.", "Зупинка внутрішньою стороною стопи і підошвою.", "Удари по нерухомому м'ячу в ціль.", "Вправи «слабкою» ногою.", "Контроль м'яча в русі."]}], "f": "Принцип «від ніг до кисті», за яким сила передається в метанні, працює також у ударі по м'ячу в теніс, подачі у волейболі та кидку в гандболі.", "pr": ["Випиши 4 типові помилки під час метання м'яча та поясни, як кожну виправити.", "Виконай вправи для плечового поясу: віджимання 3×10, колові рухи руками 2×15, утримання рук у сторони 3×30 с."], "q": ["Які помилки найчастіше трапляються під час метання?", "Яку роль відіграє ліва нога в кидку правою рукою?", "Які вправи розвивають силу плечового поясу?", "Чому важливо тренувати обидві ноги у футболі?"]}, {"n": "14", "t": "Фізичні вправи як засіб підвищення працездатності. ЗФП. Рухлива гра. Вправи з м'ячем", "g": "Учень розумітиме, як фізичні вправи підвищують розумову і фізичну працездатність, та зможе скласти фізкультпаузу для навчання.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Працездатність", "здатність людини виконувати роботу протягом певного часу з високою ефективністю."], ["Втома", "тимчасове зниження працездатності внаслідок тривалої або інтенсивної роботи."], ["Активний відпочинок", "зміна виду діяльності, наприклад рух після розумової роботи, що прискорює відновлення."], ["Фізкультпауза", "коротка серія вправ під час навчання чи роботи для зняття напруження."]], "th": [{"h": "Загальна фізична підготовка. Фізичні вправи і працездатність", "p": ["Під час руху поліпшується кровообіг, і мозок отримує більше кисню. Тому після короткої руханки легше зосередитися на навчанні. Регулярні тренування також підвищують загальну витривалість, і людина менше втомлюється протягом дня.", "Особливо це важливо для старшокласників, які готуються до іспитів: чергування розумової роботи з рухом допомагає довше працювати продуктивно."], "ul": ["Кожні 40–45 хвилин навчання — 3–5 хвилин руху.", "Ранкова зарядка допомагає швидше «прокинутися».", "Прогулянка на свіжому повітрі після уроків.", "Достатній сон — 8–9 годин.", "Надмірне навантаження, навпаки, знижує працездатність."]}, {"h": "Загальна фізична підготовка. Фізкультпауза для навчання", "p": ["Фізкультпауза складається з 4–6 вправ: потягування, повороти голови, обертання плечима, нахили, присідання, вправи для очей. Її можна виконати навіть біля робочого столу.", "Вправи для очей корисні при тривалій роботі за екраном: погляд удалину, кругові рухи очима, кліпання."], "ul": ["Потягування вгору з глибоким вдихом.", "Повільні повороти голови.", "Колові рухи плечима.", "10 присідань.", "Погляд у вікно вдалину 20–30 с."]}, {"h": "Футбол. Рухлива гра і вправи з м'ячем", "p": ["Рухлива гра з м'ячем — це і активний відпочинок, і тренування. Вона розвиває реакцію та вміння швидко ухвалювати рішення.", "Наприклад, гра «квадрат»: кілька гравців передають м'яч один одному, а один-двоє у центрі намагаються його перехопити."], "ul": ["Короткі точні передачі.", "Відкривання для отримання м'яча.", "Швидка зміна ролей.", "Повага до суперника.", "Безпечні дії без підкатів."]}], "f": "Активний відпочинок, коли після роботи одних м'язів працюють інші, часто відновлює сили швидше, ніж повний спокій.", "pr": ["Склади фізкультпаузу з 5–6 вправ для навчання вдома і виконуй її щодня під час підготовки домашніх завдань.", "Запиши у щоденник самоконтролю, як змінилися твоя увага та самопочуття після фізкультпауз протягом 3 днів."], "q": ["Що таке працездатність і від чого вона залежить?", "Чому рух допомагає краще навчатися?", "З яких вправ може складатися фізкультпауза?", "Що таке активний відпочинок?"]}, {"n": "15", "t": "Комплекс ЗРВ у русі з м'ячами. Вплив фізичних вправ на гармонійний розвиток", "g": "Учень зможе скласти й виконати комплекс ЗРВ у русі з м'ячем та пояснити, як фізичні вправи впливають на гармонійний розвиток особистості.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["ЗРВ у русі", "загальнорозвивальні вправи, які виконують під час ходьби або легкого бігу."], ["Координація", "здатність узгоджувати рухи різних частин тіла."], ["Особистісний розвиток", "формування характеру, вольових якостей і соціальних навичок людини."], ["Вольові якості", "риси характеру, як-от наполегливість, витримка і рішучість, що допомагають досягати мети."]], "th": [{"h": "Загальна фізична підготовка. Комплекс ЗРВ у русі з м'ячем", "p": ["ЗРВ у русі виконують під час ходьби: це економить час і одночасно розігріває весь організм. З м'ячем вправи стають цікавішими й розвивають координацію.", "Кожну вправу виконують на 10–15 кроків, дотримуючись дистанції між учнями."], "ul": ["Ходьба з м'ячем у витягнутих руках угорі.", "Перекладання м'яча з руки в руку навколо тулуба.", "Випади вперед з поворотом тулуба і м'ячем у руках.", "Підкидання й ловіння м'яча під час ходьби.", "Ходьба з веденням м'яча ногою."]}, {"h": "Загальна фізична підготовка. Фізичні вправи і гармонійний розвиток", "p": ["Гармонійний розвиток — це не лише сильне тіло, а й здорова психіка та вміння жити серед людей. Фізичні вправи зміцнюють серце, м'язи й кістки, знімають стрес, покращують настрій, сон і пам'ять.", "Спорт виховує характер: вчить долати труднощі, гідно програвати і перемагати, працювати в команді та поважати правила."], "ul": ["Фізичний розвиток: сила, витривалість, постава.", "Психічне здоров'я: зниження тривожності, кращий настрій.", "Соціальні навички: співпраця, лідерство, повага.", "Вольові якості: наполегливість, самодисципліна.", "Корисні звички на все життя."]}, {"h": "Футбол. Командна гра як школа характеру", "p": ["Футбол — командна гра, де успіх залежить від кожного. Тут вчаться довіряти партнерам, брати відповідальність і підтримувати одне одного навіть після помилки.", "Фейр-плей (чесна гра) — головний принцип спорту: перемога не варта порушення правил чи образ."], "ul": ["Підтримуй партнера після помилки.", "Потисни руку суперникові після гри.", "Не сперечайся з суддею.", "Допомагай тому, хто впав.", "Святкуй перемогу без зневаги до інших."]}], "f": "Під час фізичних вправ організм виробляє речовини, що покращують настрій, тому після тренування людина часто почувається бадьорішою й спокійнішою.", "pr": ["Склади комплекс із 6 ЗРВ з м'ячем (або з подушкою чи м'якою іграшкою замість м'яча), які можна безпечно виконати вдома в повільному темпі, і виконай його.", "Напиши міні-есе (8–10 речень): як заняття спортом вплинули або можуть вплинути на твій характер."], "q": ["Чим ЗРВ у русі відрізняються від ЗРВ на місці?", "Що таке гармонійний розвиток людини?", "Які вольові якості виховує спорт?", "Що означає фейр-плей у футболі?"]}, {"n": "16", "t": "Футбол: зупинка м'яча різними способами. Ривки до м'яча з ударом по воротах. ЗРВ у русі", "g": "Учень знатиме різні способи зупинки м'яча та техніку удару по воротах після ривка.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Зупинка підошвою", "спосіб, коли гравець притискає м'яч підошвою до землі."], ["Зупинка стегном", "прийом для м'яча, що летить на рівні пояса: стегно «підставляється» й гасить швидкість."], ["Зупинка грудьми", "прийом для високого м'яча, коли гравець прогинається назад і амортизує удар грудьми."], ["Удар підйомом", "сильний удар верхньою частиною стопи (шнурівкою), часто використовуваний для ударів по воротах."]], "th": [{"h": "Футбол. Способи зупинки м'яча", "p": ["Спосіб зупинки залежить від висоти та швидкості м'яча. Низький м'яч зупиняють підошвою або внутрішньою стороною стопи, м'яч на рівні колін і пояса — стегном, високий — грудьми. Секрет усіх зупинок однаковий: у момент контакту частина тіла «піддається» назад, гасячи швидкість.", "Добре зупинений м'яч опиняється на зручній для наступної дії відстані — не під ногами і не надто далеко."], "ul": ["Підошва — для низьких і повільних м'ячів.", "Внутрішня сторона стопи — найнадійніша зупинка.", "Стегно — для м'ячів на середній висоті.", "Груди — для високих м'ячів, руки відведені в сторони.", "Перед зупинкою подивись, куди будеш грати далі."]}, {"h": "Футбол. Ривок до м'яча й удар по воротах", "p": ["Після ривка важливо встигнути «налаштуватися»: скоротити останній крок, поставити опорну ногу поруч із м'ячем і нанести удар. Для сильного удару використовують удар підйомом, для точного — внутрішньою стороною стопи.", "Удар виконується з корпусом над м'ячем — так він не полетить вище воріт."], "ul": ["Ривок — коротким частим кроком.", "Перед ударом — погляд на ворота і на м'яч.", "Опорна нога — поруч із м'ячем.", "Носок ударної ноги відтягнутий донизу при ударі підйомом.", "Бий у кути воріт, подалі від воротаря."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ у русі", "p": ["Розминка перед ударами повинна обов'язково включати вправи для м'язів стегна, паху й гомілки — саме вони найбільше навантажуються під час ударів.", "Махи ногами в русі та випади добре готують ці м'язи."], "ul": ["Махи прямою ногою вперед під час ходьби.", "Відкривання й закривання «воріт» у тазостегновому суглобі.", "Випади з поворотом.", "Біг з високим підніманням стегна.", "Прискорення на 10–15 м."]}], "f": "Більшість голів у футболі забивають ударами зсередини штрафного майданчика, тому вміння точно бити після ривка особливо цінується у нападників.", "pr": ["Склади таблицю «Способи зупинки м'яча»: висота м'яча — частина тіла — ключові моменти техніки.", "Виконай махи ногами і вправи на розтяжку м'язів стегна та паху (по 10 махів і 20–30 с на кожну розтяжку), тримаючись рукою за опору."], "q": ["Від чого залежить вибір способу зупинки м'яча?", "Що спільного у всіх способах зупинки?", "Як не «запустити» м'яч вище воріт під час удару?", "Які м'язи потрібно найкраще розім'яти перед ударами?"]}, {"n": "17", "t": "Футбол: ривки з м'ячем, удари головою, групові дії в атаці. Тест на гнучкість", "g": "Учень знатиме техніку удару головою, основи групових дій в атаці та правила виконання тесту на гнучкість.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Удар головою", "прийом, коли гравець б'є по м'ячу лобовою частиною голови, щоб передати його чи забити гол."], ["Групові дії в атаці", "узгоджені дії двох-трьох гравців для просування м'яча до воріт суперника."], ["Стінка", "комбінація, коли гравець віддає передачу партнеру і відразу отримує м'яч назад, оббігаючи суперника."], ["Гнучкість", "здатність виконувати рухи з великою амплітудою."]], "th": [{"h": "Футбол. Ривки з м'ячем і удари головою", "p": ["Удар головою виконують лобом — найміцнішою частиною голови. Шия напружена, очі відкриті, тулуб відхиляється назад і різко рухається вперед назустріч м'ячу. Бити «маківкою» чи скронею неправильно і небезпечно.", "Ривки з м'ячем — це прискорення з веденням, коли м'яч відкидається трохи далі вперед, щоб не гальмувати біг."], "ul": ["Удар лобом, шия напружена.", "Очі відкриті до моменту удару.", "Рух тулубом, а не лише головою.", "Починай із легких м'ячів, без силових ударів.", "Під час ривка з м'ячем — короткі, але сильніші торкання."]}, {"h": "Футбол. Групові дії в атаці", "p": ["Атака стає ефективною, коли гравці діють разом: відкриваються для передачі, створюють перевагу в числі, використовують комбінації «стінка» та «схрещування». Головне — рух без м'яча: гравець, що не володіє м'ячем, має допомагати партнерові.", "Чим швидше команда передає м'яч, тим важче супернику його відібрати."], "ul": ["Стінка — передача і отримання м'яча назад на хід.", "Схрещування — гравці змінюються місцями, щоб заплутати захист.", "Відкривання — вихід у вільну зону.", "Підтримка — партнер поруч з гравцем з м'ячем.", "Ширина атаки — використання флангів."]}, {"h": "Загальна фізична підготовка. Контрольне тестування: тест на гнучкість", "p": ["Тест «нахил уперед із положення сидячи»: сісти на підлогу, ноги прямі, стопи впираються в опору, руки витягнуті. Повільно нахилитися вперед, ковзаючи пальцями по лінійці, і втримати положення 2 секунди. Результат — відстань у сантиметрах.", "Перед тестом обов'язкова розминка. Ривки й пружинисті рухи заборонені — нахил плавний, коліна не згинаються."], "ul": ["Розминка 8–10 хвилин перед тестом.", "Коліна прямі, нахил повільний.", "Дві-три спроби, зараховується найкраща.", "Порівнюй результат зі своїм попереднім — так видно прогрес.", "Щоденна розтяжка поступово покращує гнучкість."]}], "f": "Гнучкість легше розвивати в юному віці, тому регулярна розтяжка в шкільні роки допомагає зберегти рухливість суглобів і в дорослому житті.", "pr": ["Виконай вдома тест на гнучкість (нахил уперед сидячи) після розминки, запиши результат і склади комплекс із 5 вправ на розтяжку.", "Намалюй схему комбінації «стінка» з поясненням ролей двох гравців."], "q": ["Якою частиною голови правильно бити по м'ячу і чому?", "Що таке комбінація «стінка»?", "Як виконується тест на гнучкість?", "Чому під час тесту не можна робити ривків?"]}, {"n": "18", "t": "Особливості підготовки дівчат у футболі. Жонглювання м'ячем. Ведення м'яча різними способами", "g": "Учень знатиме особливості тренування дівчат у футболі, техніку жонглювання та різні способи ведення м'яча.", "k": "Модулі: Футбол", "terms": [["Жонглювання", "багаторазове підбивання м'яча різними частинами тіла без падіння на землю."], ["Ведення м'яча", "переміщення гравця з м'ячем, коли він контролює його короткими поштовхами."], ["Ведення зовнішньою стороною стопи", "спосіб ведення, що дозволяє бігти швидко і легко змінювати напрям."], ["Жіночий футбол", "самостійний напрям футболу з власними змаганнями та командами, що грають за тими самими правилами."]], "th": [{"h": "Футбол. Особливості підготовки дівчат", "p": ["Жіночий футбол стрімко розвивається в Україні та світі. Правила такі самі, як у чоловіків, але в тренуванні дівчат враховують особливості організму: більше уваги приділяють зміцненню м'язів навколо колінного суглоба, корпусу і правильному приземленню після стрибків.", "Важливими є техніка й тактика, а не лише сила. Регулярність, поступовість і достатнє відновлення — ключ до безпечного прогресу."], "ul": ["Зміцнення м'язів стегна та сідниць захищає коліна.", "Вправи на рівновагу і стабільність корпусу.", "Навчання м'якого приземлення.", "Достатній відпочинок між тренуваннями.", "Індивідуальний підхід до навантаження."]}, {"h": "Футбол. Жонглювання м'ячем", "p": ["Жонглювання розвиває «відчуття» м'яча, координацію і концентрацію. Починати варто з підйому стопи: м'яч підбивається невисоко, на рівень пояса, нога майже пряма, носок трохи відтягнутий.", "Спочатку можна дозволяти м'ячу один раз відскочити від землі між торканнями. Поступово додають стегно, обидві ноги, голову."], "ul": ["Підбивай м'яч невисоко.", "Стопа фіксована, носок відтягнутий.", "Чергуй праву і ліву ногу.", "Стеж за м'ячем, але тримай рівновагу.", "Рахуй рекорд і намагайся його покращити."]}, {"h": "Футбол. Ведення м'яча різними способами", "p": ["М'яч ведуть внутрішньою, зовнішньою стороною стопи, підйомом або підошвою. Внутрішня сторона — для контролю, зовнішня — для швидкого руху і зміни напряму, підйом — для ведення по прямій на швидкості, підошва — для розворотів і утримання м'яча.", "Під час ведення м'яч не повинен відкочуватися далеко: між торканнями — 1–2 кроки."], "ul": ["Голова піднята, огляд поля.", "Тіло між суперником і м'ячем, коли тебе атакують.", "Змінюй темп ведення.", "Тренуй обидві ноги.", "Типова помилка — ведення носком."]}], "f": "Міжнародна федерація футболу (ФІФА) проводить окремий чемпіонат світу серед жіночих команд, і він збирає мільйони глядачів.", "pr": ["Порівняй у таблиці чотири способи ведення м'яча: якою частиною стопи, коли використовують, переваги.", "Виконай вправи для стабільності колін і рівноваги: стояння на одній нозі 3×30 с на кожну, присідання 3×12, підйоми на носки 3×15."], "q": ["Які особливості враховують у підготовці дівчат-футболісток?", "Як правильно починати навчатися жонглюванню?", "Якими способами можна вести м'яч?", "Чому під час ведення важливо піднімати голову?"]}, {"n": "19", "t": "Біг боком і спиною вперед. Біг з максимальною швидкістю. Удари головою. Комплекс ЗРВ", "g": "Учень знатиме спеціальні бігові вправи футболіста і вдосконалить розуміння техніки удару головою з різних положень.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Біг спиною вперед", "спеціальна вправа, що імітує відхід захисника назад зі збереженням огляду поля."], ["Біг приставними кроками", "переміщення боком без схрещування ніг, що забезпечує стійкість."], ["Максимальна швидкість", "найвища швидкість, яку спортсмен може розвинути на короткому відрізку."], ["Удар головою в стрибку", "удар головою, коли гравець відштовхується від землі, щоб першим дістати високий м'яч."]], "th": [{"h": "Футбол. Спеціальні бігові вправи", "p": ["Футболіст рідко бігає лише вперед. Захисник відходить назад, обличчям до м'яча; півзахисник переміщується боком; нападник раптово розвертається. Тому бігові вправи футболіста включають біг боком, спиною вперед, з поворотами.", "Біг навипередки з партнером додає змагальності, але треба стежити за безпекою: достатня відстань між парами, рівна поверхня."], "ul": ["Біг спиною: невеликі кроки, корпус трохи нахилений уперед.", "Біг боком: ноги не схрещуються.", "Різкі повороти — на зігнутих ногах.", "Озирайся під час бігу спиною вперед.", "Прискорення на максимальній швидкості — 10–20 м."]}, {"h": "Футбол. Удари головою з різних положень", "p": ["Після ривка чи стрибка удар головою вимагає точного розрахунку: потрібно вчасно опинитися під м'ячем і «піти» йому назустріч. У стрибку відштовхуються однією ногою з розбігу або двома з місця.", "Безпека: не стрибай грудьми на суперника, не використовуй лікті."], "ul": ["Оціни траєкторію м'яча заздалегідь.", "Стрибок трохи раніше, щоб бути вище суперника.", "Удар лобом у верхній точці стрибка.", "Руки для рівноваги, не для відштовхування суперника.", "Приземлення на зігнуті ноги."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ", "p": ["Перед роботою з високими м'ячами потрібно добре розім'яти шию, плечі та ноги. Повільні нахили голови, обертання плечима, стрибки на місці готують до навантаження.", "Комплекс виконують у помірному темпі, без різких рухів шиєю."], "ul": ["Нахили голови вперед і в сторони.", "Обертання плечима.", "Нахили тулуба.", "Присідання.", "Легкі стрибки на місці."]}], "f": "Футболісти за матч долають значну частину дистанції не лицем уперед, а боком чи спиною, тому ці види бігу обов'язково входять у тренування.", "pr": ["Опиши, у яких ігрових ситуаціях футболісту потрібен біг спиною вперед і боком; наведи 3 приклади.", "Виконай вправи для зміцнення м'язів шиї та спини: повільні нахили голови в сторони з легким опором долоні 2×8, «човник» 3×10."], "q": ["Навіщо футболісту біг спиною вперед і боком?", "Як безпечно виконувати удар головою в стрибку?", "Як правильно рухатися приставними кроками?", "Які частини тіла потрібно розім'яти перед ударами головою?"]}, {"n": "20", "t": "Контрольне тестування: зупинка м'яча, що опускається. Відбирання м'яча. Групові дії в захисті", "g": "Учень знатиме вимоги контрольного тесту на зупинку м'яча, способи відбирання м'яча та принципи групових дій у захисті.", "k": "Модулі: Футбол", "terms": [["М'яч, що опускається", "м'яч, який падає зверху після високої передачі чи відскоку."], ["Відбір м'яча", "дії захисника, спрямовані на те, щоб заволодіти м'ячем суперника за правилами."], ["Підстраховка", "положення партнера позаду захисника, готового допомогти, якщо суперник його обіграє."], ["Персональна опіка", "спосіб захисту, коли кожен захисник стежить за конкретним суперником."]], "th": [{"h": "Футбол. Контрольне тестування: 5 зупинок м'яча, що опускається", "p": ["Тест перевіряє вміння прийняти високий м'яч і залишити його поруч із собою. Вчитель або партнер набрасує м'яч, учень зупиняє його стопою, стегном чи грудьми. Зараховуються спроби, після яких м'яч залишається в межах невеликої зони біля гравця.", "Щоб підготуватися, тренуй зупинки з підкидання м'яча собі руками, а потім — з передач партнера."], "ul": ["Визнач місце падіння м'яча і вийди туди заздалегідь.", "Обери частину тіла залежно від висоти.", "У момент контакту «піддайся» назад.", "Після зупинки м'яч має бути під контролем.", "Оцінюй себе: скільки з 5 спроб вдалося."]}, {"h": "Футбол. Відбирання м'яча", "p": ["Відбирати м'яч можна випадом, у підкаті, поштовхом плечем у плече (коли м'яч поруч). Найбезпечніший і найнадійніший спосіб для навчання — випад: захисник у низькій стійці чекає моменту, коли суперник відпустить м'яч, і вибиває його ногою.", "Заборонено штовхати руками, тримати, бити по ногах, атакувати ззаду. Підкати на уроці не виконуються."], "ul": ["Низька стійка, вага на передній частині стоп.", "Дивись на м'яч, а не на фінти.", "Не «падай» на перший рух суперника.", "Поштовх лише плечем у плече і лише коли м'яч у зоні гри.", "Порушення правил — штрафний удар."]}, {"h": "Футбол. Групові дії в захисті", "p": ["Захист — справа всієї команди. Гравець, найближчий до суперника з м'ячем, атакує його, а партнер займає позицію підстраховки трохи позаду. Інші закривають напрямки передач.", "Захисники спілкуються між собою: підказують, кого опікати, коли виходити вперед."], "ul": ["Один атакує — другий підстраховує.", "Не дозволяй супернику легко пройти до воріт центром.", "Відтісняй суперника до бокової лінії.", "Компактність — малі відстані між захисниками.", "Голосові підказки партнерам."]}], "f": "За правилами футболу будь-який відбір, при якому гравець ризикує здоров'ям суперника, може бути покараний не лише штрафним ударом, а й попередженням чи вилученням.", "pr": ["Опиши в зошиті, як правильно готуватися до тесту на зупинку м'яча, що опускається, і як оцінити свій результат.", "Намалюй схему групових дій двох захисників (атака на гравця з м'ячем і підстраховка) з поясненням."], "q": ["Як виконується тест на зупинку м'яча, що опускається?", "Які способи відбору м'яча дозволені правилами?", "Що таке підстраховка?", "Чому захисникам важливо спілкуватися?"]}, {"n": "21", "t": "Футбол: діставання високого м'яча головою та ногою в стрибку з розбігу. ЗРВ у русі", "g": "Учень знатиме техніку виконання прийомів з високим м'ячем у стрибку та правила безпечної боротьби за верхові м'ячі.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Верховий м'яч", "м'яч, що летить вище рівня голови гравців."], ["Вибір позиції", "вміння вчасно опинитися в місці, куди падатиме м'яч."], ["Небезпечна гра", "дія, що загрожує травмою суперникові, наприклад високо піднята нога біля його голови."], ["Стрибок з розбігу", "стрибок, при якому відштовхування виконують однією ногою після кількох кроків розбігу."]], "th": [{"h": "Футбол. Високий м'яч головою в стрибку з розбігу", "p": ["Щоб виграти верхову боротьбу, важливо правильно вибрати момент: стрибнути трохи раніше суперника і зустріти м'яч у найвищій точці. Розбіг 2–4 кроки, відштовхування однією ногою, мах протилежною ногою і руками вгору.", "Удар лобом спрямовують униз-у бік воріт (при ударі по воротах) або на партнера."], "ul": ["Оцінюй траєкторію заздалегідь.", "Відштовхування однією ногою, мах руками.", "Удар у верхній точці стрибка.", "Не використовуй лікті в боротьбі.", "Приземлення на обидві ноги."]}, {"h": "Футбол. Діставання м'яча ногою в стрибку", "p": ["Інколи м'яч зручніше прийняти ногою — підйомом або внутрішньою стороною стопи, коли він летить на рівні пояса. Важливо не піднімати ногу високо біля суперника: це небезпечна гра, за яку призначається штрафний удар.", "Безпечніше дочекатися, поки м'яч опуститься, і прийняти його стегном або стопою."], "ul": ["Нога не вище рівня пояса суперника.", "Контролюй рівновагу корпусом і руками.", "Не стрибай на суперника.", "За небезпечну гру — штрафний удар.", "Пріоритет — безпека, а не ефектність."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ у русі", "p": ["Стрибкові дії вимагають добре розігрітих гомілковостопних і колінних суглобів. Тому комплекс ЗРВ у русі включає підскоки, махи ногами, біг з високим підніманням стегна.", "Завершується розминка кількома імітаційними стрибками без м'яча."], "ul": ["Підскоки з махом рук.", "Махи ногами вперед і в сторони.", "Біг з високим підніманням стегна.", "Обертання в гомілковостопних суглобах.", "Імітація стрибка з розбігу."]}], "f": "За правилами футболу небезпечною вважається гра навіть без контакту, якщо дія гравця загрожує травмою іншому учаснику.", "pr": ["Опиши в зошиті техніку стрибка з розбігу для удару головою та правила безпечної боротьби за верховий м'яч.", "Виконай вправи для гомілковостопних суглобів і рівноваги: обертання стопами 2×10, підйоми на носки 3×15, стояння на одній нозі 3×30 с."], "q": ["Як виграти боротьбу за верховий м'яч?", "Що таке небезпечна гра?", "Як виконується стрибок з розбігу
