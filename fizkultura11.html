актеру?", "Чим відрізняється техніка верхньої передачі від нижньої?", "Які типові помилки під час пересування вздовж сітки?"]}, {"n": "50", "t": "Націлена подача. Прийом у зонах 5, 6, 1 і передача в зони 4, 3, 2. Система «кутом вперед»", "g": "Учень знатиме, як виконувати націлену подачу, приймати м'яч знизу в задній лінії та передавати його в передню, а також розумітиме суть системи гри «кутом вперед».", "k": "Модулі: Волейбол", "terms": [["Націлена подача", "подача, спрямована в конкретну зону або на конкретного гравця суперника, щоб ускладнити йому прийом."], ["Зона майданчика", "одна з шести умовних ділянок половини поля (1–6), за якими розставляють гравців і будують тактику."], ["Система «кутом вперед»", "тактична схема, за якої гравець зони 6 виходить ближче до лінії нападу і страхує нападників та блок, утворюючи «кут», спрямований уперед."], ["Прийом подачі", "перша дія команди після подачі суперника, мета якої — точно передати м'яч зв'язковому гравцеві."]], "th": [{"h": "Волейбол. Націлена подача", "p": ["Сучасна подача — це не просто введення м'яча в гру, а перша атака. Націлена подача спрямовується в слабкі місця суперника: на гравця, який гірше приймає, у стики між гравцями, у зону 1 чи 5 біля лінії.", "Точність важливіша за силу: краще стабільно потрапляти у вибрану зону, ніж часто помилятися."], "ul": ["Обирайте ціль до подачі й не змінюйте рішення під час підкидання.", "Стабільне підкидання — основа точності: м'яч підкидайте на однакову висоту.", "Напрямок удару задається положенням тулуба і кисті.", "Найнезручніші зони для прийому — стики між гравцями і задні кути.", "Типова помилка: подача «на силу» без контролю напрямку."]}, {"h": "Волейбол. Прийом знизу в зонах 5, 6, 1 і передача в зони 4, 3, 2", "p": ["Гравці задньої лінії (зони 5, 6, 1) приймають більшість подач. Їхнє завдання — передати м'яч у передню лінію, найчастіше в зону 3 або 2, де знаходиться зв'язковий гравець. Від якості прийому залежить, чи вдасться команді атакувати."], "ul": ["До подачі займіть низьку стійку, зважайте на позицію гравця, що подає.", "Виходьте під м'яч так, щоб він був перед вами, а не збоку.", "Площину передпліч розвертайте в бік зони, куди передаєте.", "Передача має бути високою й «м'якою», щоб зв'язковий встиг підготуватися.", "Типова помилка: різкий змах руками вгору — м'яч летить далеко за сітку."]}, {"h": "Волейбол. Навчальна гра в системі «кутом вперед»", "p": ["У системі «кутом вперед» гравець зони 6 займає місце посередині майданчика ближче до сітки й підбирає м'ячі, що відскочили від блоку, або обманні скидки. Гравці зон 1 і 5 відповідають за глибокі удари. Схема проста й добре підходить для навчальної гри."], "ul": ["Гравець зони 6 стоїть приблизно в центрі за лінією нападу.", "Зони 1 і 5 страхують задні кути.", "Гравці передньої лінії блокують і атакують.", "Важливо голосом розподіляти м'ячі, що летять між гравцями.", "Слабке місце системи — глибокі удари в центр задньої лінії."]}], "f": "", "pr": ["Намалюйте схему майданчика з шістьма зонами й покажіть стрілками розташування гравців у системі «кутом вперед».", "Виконайте 3 підходи по 10 повільних присідань у стійці волейболіста з імітацією прийому м'яча знизу."], "q": ["Що таке націлена подача і куди її найкраще спрямовувати?", "Які гравці приймають подачу і куди передають м'яч?", "У чому суть системи «кутом вперед»?", "Які слабкі місця має ця система?"]}, {"n": "51", "t": "ЗРВ у русі. Закріплення націленої подачі та прийому знизу. Гра «кутом вперед»", "g": "Учень закріпить знання про прийом подачі й передачу в передню лінію, навчиться правильно виконувати ЗРВ у русі та розуміти розстановку й переходи в навчальній грі.", "k": "Модулі: Волейбол", "terms": [["ЗРВ у русі", "загальнорозвивальні вправи, які виконують під час ходьби або повільного бігу, щоб розігріти м'язи й суглоби."], ["Розстановка", "розміщення гравців команди по зонах майданчика на момент подачі."], ["Перехід", "зміна позицій гравців за годинниковою стрілкою після того, як команда виграла право подачі."], ["Стійка волейболіста", "готове положення з напівзігнутими ногами, нахиленим уперед тулубом і руками перед собою."]], "th": [{"h": "Волейбол. ЗРВ у русі як підготовка до гри", "p": ["ЗРВ у русі поступово розігрівають організм: підвищується частота серцевих скорочень, кровообіг у м'язах, рухливість суглобів. Для волейболіста особливо важливі плечові суглоби, кисті, коліна та гомілкостопи."], "ul": ["Ходьба з колами руками вперед і назад.", "Ходьба з випадами й поворотами тулуба.", "Біг з високим підніманням стегна та закиданням гомілки.", "Обертання кистями й розминка пальців.", "Порядок: від верхніх частин тіла до нижніх, від повільного до швидкого."]}, {"h": "Волейбол. Закріплення прийому та націленої подачі", "p": ["Під час закріплення важливо автоматизувати рухи, щоб у грі не думати про техніку, а стежити за м'ячем і партнерами. Подачу й прийом відпрацьовують у парі: один подає в певну зону, інший приймає й передає в зону 3."], "ul": ["Подача: однакова висота підкидання, рука зустрічає м'яч у найвищій точці.", "Прийом: зупинка перед контактом, ноги працюють, руки нерухомі.", "Розворот площини рук у бік цілі.", "Після кожної спроби — коротко проаналізуйте, що вдалося.", "Мета прийому — висока передача приблизно на 1 м від сітки."]}, {"h": "Волейбол. Розстановка й переходи в навчальній грі", "p": ["На момент подачі кожен гравець має стояти у своїй зоні відповідно до розстановки. Після виграшу подачі команда робить перехід: гравці зміщуються на одну зону за годинниковою стрілкою, і подає гравець, що перейшов у зону 1."], "ul": ["Розстановку порушують, якщо гравці стоять не у своєму порядку в момент подачі.", "Після подачі гравці можуть переміщуватися будь-куди на своїй половині.", "Гравці задньої лінії не можуть атакувати з-за лінії нападу над верхнім краєм сітки, перебуваючи в зоні нападу.", "Перехід виконується лише тоді, коли команда виграла подачу в суперника.", "У системі «кутом вперед» після подачі гравці займають свої тактичні позиції."]}], "f": "У волейболі команда, яка виграла розіграш на подачі суперника, отримує не лише очко, а й право подачі — тому й відбувається перехід.", "pr": ["Складіть і виконайте комплекс із 6 ЗРВ на місці (кола руками, нахили, повороти тулуба, розминка кистей і гомілкостопів), записавши його в зошит.", "Намалюйте, як змінюються позиції гравців під час переходу, з номерами зон до й після."], "q": ["Навіщо виконувати ЗРВ у русі перед грою?", "Що таке розстановка і коли її можна порушити?", "Як відбувається перехід?", "Куди повинен передати м'яч гравець, що приймає подачу?"]}, {"n": "52", "t": "Фізична підготовленість волейболіста. Силова подача. Передача зв'язковому гравцеві", "g": "Учень дізнається, які фізичні якості потрібні волейболістові, як виконувати силову подачу, передавати м'яч зв'язковому та правильно віджиматися в упорі лежачи.", "k": "Модулі: Волейбол", "terms": [["Силова подача", "верхня подача з потужним ударом по м'ячу, після якої він летить швидко й з обертанням уперед."], ["Стрибучість", "здатність високо вистрибувати завдяки силі й швидкості скорочення м'язів ніг."], ["Зв'язковий гравець", "гравець, який виконує другу передачу й організовує напад команди."], ["Згинання і розгинання рук в упорі лежачи", "силова вправа для м'язів грудей, плечей і рук (віджимання), під час якої тіло залишається прямим."]], "th": [{"h": "Волейбол. Фізична підготовленість волейболіста", "p": ["Волейбол вимагає поєднання багатьох якостей: швидкості реакції, стрибучості, сили рук і плечового пояса, спритності та витривалості. Матч може тривати понад годину, а гравець за цей час робить десятки стрибків і ривків.", "Тому тренування волейболіста включає загальну фізичну підготовку (сила, витривалість) і спеціальну (стрибки, переміщення, сила удару)."], "ul": ["Швидкість — реакція на м'яч і миттєві переміщення.", "Стрибучість — для блоку та нападаючого удару.", "Сила рук і плечового пояса — для подачі та удару.", "Спритність і координація — для прийому складних м'ячів.", "Витривалість — щоб зберігати якість дій до кінця матчу.", "Гнучкість — для профілактики травм."]}, {"h": "Волейбол. Силова подача", "p": ["Силова подача виконується так само, як верхня пряма, але з потужнішим ударом. М'яч підкидають трохи вище й попереду, удар наносять долонею по верхній задній частині м'яча з активним рухом кисті вперед-вниз, через що м'яч обертається."], "ul": ["Вихідне положення: ліва нога попереду (для правші), м'яч на рівні голови.", "Підкидання — на висоту 0,5–1 м перед ударним плечем.", "Замах: рука відводиться назад-вгору, лікоть високо.", "Удар — прямою рукою у найвищій точці, кисть «накриває» м'яч.", "Типова помилка: м'яч підкинуто позаду голови — він летить у сітку або вгору."]}, {"h": "Волейбол. Передача зв'язковому гравцеві й віджимання", "p": ["Перша передача (прийом) має полегшити роботу зв'язкового: м'яч має прилітати в зону 3 чи між зонами 2 і 3 на висоту, зручну для верхньої передачі. Віджимання в упорі лежачи розвивають м'язи, потрібні для подачі й блоку."], "ul": ["Передавайте м'яч високо, не ближче ніж 0,5–1 м від сітки.", "Віджимання: тіло пряме від голови до п'ят, таз не прогинається.", "Лікті під час згинання — під кутом приблизно 45° до тулуба.", "Опускайтеся, доки груди майже торкнуться підлоги.", "Дихання: вдих — униз, видих — угору."]}], "f": "Силова подача в стрибку з'явилася у великому волейболі пізніше за звичайну верхню і стала однією з найсильніших атакувальних зброй сучасних команд.", "pr": ["Виконайте 3 підходи віджимань в упорі лежачи (дівчата можуть з колін) з правильною технікою; запишіть кількість у кожному підході.", "Складіть таблицю «Фізичні якості волейболіста» і до кожної якості впишіть одну вправу для її розвитку, яку можна безпечно виконати вдома."], "q": ["Які фізичні якості найважливіші для волейболіста й чому?", "Чим силова подача відрізняється від звичайної верхньої прямої?", "Куди і як треба передавати м'яч зв'язковому гравцеві?", "Які помилки найчастіше трапляються під час віджимань?"]}, {"n": "53", "t": "Передача м'яча зв'язковому. Сила рук і плечового пояса. Навчальна гра «кутом вперед»", "g": "Учень удосконалить уміння передавати м'яч зв'язковому, зрозуміє роль другої передачі й навчиться дозувати силові вправи для рук.", "k": "Модулі: Волейбол", "terms": [["Друга передача", "передача зв'язкового гравця, яка виводить нападника на удар."], ["Упор лежачи", "положення тіла з опорою на прямі руки та носки ніг, тулуб утворює пряму лінію."], ["Плечовий пояс", "кістки й м'язи, що з'єднують руки з тулубом і забезпечують рухи плечей."], ["Взаємодія", "узгоджені дії двох або більше гравців для виконання спільного ігрового завдання."]], "th": [{"h": "Волейбол. Взаємодія з зв'язковим гравцем", "p": ["Класична атака у волейболі складається з трьох дотиків: прийом — передача — удар. Зв'язковий отримує м'яч після прийому і вибирає, кому з нападників дати пас. Чим точніша перша передача, тим більше варіантів у зв'язкового."], "ul": ["Прийом спрямовуйте в зону 3 або між 2 і 3.", "Зв'язковий має повертатися обличчям до зони 4, щоб маскувати передачу.", "Нападники заздалегідь займають місце для розбігу.", "Друга передача виконується переважно верхнім способом.", "Голосом або умовним знаком нападник просить передачу."]}, {"h": "Волейбол. Розвиток сили рук і плечового пояса", "p": ["Сильний плечовий пояс потрібен для подачі, удару й блоку, а також захищає плечовий суглоб від травм. Віджимання — доступна вправа, яку можна виконувати вдома, змінюючи складність положенням рук і ніг."], "ul": ["Полегшений варіант — віджимання від стіни або від колін.", "Звичайний варіант — упор лежачи на прямих руках.", "Виконуйте 3–4 підходи з відпочинком 1–1,5 хв.", "Якість важливіша за кількість: зупиняйтеся, коли ламається техніка.", "Після вправи розтягніть грудні м'язи й плечі."]}, {"h": "Волейбол. Навчальна гра в системі «кутом вперед»", "p": ["У навчальній грі закріплюють прийом, передачу зв'язковому та розташування гравців у системі «кутом вперед». Після кожного розіграшу корисно коротко обговорити, що вдалося, а що ні."], "ul": ["Гравець зони 6 підстраховує нападника й блок.", "Зв'язковий виходить до сітки одразу після подачі суперника.", "Нападники не заходять за центральну лінію.", "Підтримка партнерів словом підвищує результативність.", "Тренер може зараховувати очко лише за атаку через три дотики."]}], "f": "", "pr": ["Виконайте вдома 3 підходи віджимань (від стіни, колін або підлоги — за рівнем підготовки) і 2 підходи розтягування грудних м'язів біля одвірка по 20 секунд.", "Опишіть письмово, з яких трьох дотиків складається класична атака у волейболі, і роль кожного з них."], "q": ["Яке завдання зв'язкового гравця?", "Чому точна перша передача так важлива?", "Як можна змінювати складність віджимань?", "Які обов'язки гравця зони 6 у системі «кутом вперед»?"]}, {"n": "54", "t": "Силова подача. Передача в стрибку. Удар з коротких і середніх передач. Залік: віджимання", "g": "Учень розумітиме техніку передачі в стрибку та нападаючого удару з коротких і середніх передач і знатиме, як правильно скласти залікову вправу з віджимань.", "k": "Модулі: Волейбол", "terms": [["Передача в стрибку", "верхня передача, яку виконують у фазі зльоту стрибка, щоб пришвидшити атаку й ускладнити блок суперника."], ["Коротка передача", "невисока передача, після якої нападник б'є одразу біля зв'язкового, з мінімальним часом польоту м'яча."], ["Середня передача", "передача середньої висоти й дальності, яка дає нападникові більше часу на розбіг."], ["Залікова вправа", "контрольне виконання вправи за встановленими правилами для оцінювання рівня підготовленості."]], "th": [{"h": "Волейбол. Передача в стрибку та силова подача", "p": ["Передачу в стрибку застосовують, коли м'яч прилітає високо біля сітки або щоб пришвидшити атаку. Зв'язковий вистрибує вертикально й торкається м'яча в найвищій точці. Головне — не зміщуватися вперед до сітки."], "ul": ["Стрибок — угору, а не вперед, щоб не торкнутися сітки.", "Руки виносяться над головою заздалегідь.", "Передачу виконують кистями й пальцями, без «ловіння» м'яча.", "Приземлення — на обидві ноги з амортизацією.", "Силова подача: зберігайте той самий ритм підкидання, що й на попередньому уроці."]}, {"h": "Волейбол. Нападаючий удар із коротких і середніх передач", "p": ["Нападаючий удар складається з розбігу, стрибка, удару та приземлення. Після короткої передачі нападник стрибає майже одночасно з передачею, тому потрібна гарна узгодженість із зв'язковим. Середня передача дає більше часу, і її легше освоїти."], "ul": ["Розбіг — 2–3 кроки, останній крок широкий, з постановкою ніг на п'ятки.", "Відштовхування — двома ногами з махом обох рук угору.", "Удар — прямою рукою у найвищій точці перед собою.", "Кисть активно «накриває» м'яч, спрямовуючи його вниз.", "Приземлення — на обидві ноги, на своїй половині."]}, {"h": "Волейбол. Залікова вправа: віджимання від підлоги", "p": ["Під час заліку зараховують лише ті повторення, які виконані з правильною технікою. Важливо заздалегідь розім'яти плечі й кисті та розподілити сили, не роблячи перші повторення надто швидко."], "ul": ["Тіло пряме, голова — продовження тулуба.", "Опускання — до кута в ліктях близько 90° або нижче, за вимогою вчителя.", "Розгинання — до повністю прямих рук.", "Повторення з прогином у попереку чи піднятим тазом не зараховують.", "Перед заліком — легка розминка, після — розтягування."]}], "f": "", "pr": ["Виконайте пробну залікову вправу вдома: максимальну кількість правильних віджимань за один підхід; запишіть результат для порівняння в наступних уроках.", "Опишіть чотири фази нападаючого удару і для кожної вкажіть одну типову помилку."], "q": ["Коли застосовують передачу в стрибку?", "Чим відрізняються короткі й середні передачі для нападу?", "З яких фаз складається нападаючий удар?", "Які вимоги до техніки під час залікових віджимань?"]}, {"n": "55", "t": "Прямий нападаючий удар. Силова подача. Тренування нормативу. Самоконтроль за навантаженням", "g": "Учень удосконалить уявлення про прямий нападаючий удар і навчиться контролювати фізичне навантаження за пульсом і самопочуттям.", "k": "Модулі: Волейбол", "terms": [["Прямий нападаючий удар", "удар, під час якого напрямок польоту м'яча збігається з напрямком розбігу нападника."], ["Самоконтроль", "регулярне спостереження за станом свого організму під час і після фізичних навантажень."], ["ЧСС", "частота серцевих скорочень за хвилину, основний показник інтенсивності навантаження."], ["Пульсове відновлення", "повернення пульсу до вихідних значень після навантаження; швидке відновлення свідчить про добру тренованість."]], "th": [{"h": "Волейбол. Прямий нападаючий удар і силова подача", "p": ["Прямий нападаючий удар — найпростіший і найпоширеніший вид атаки. Нападник розбігається під кутом до сітки і б'є в напрямку розбігу. Це дає змогу вкласти в удар швидкість усього тіла."], "ul": ["Розбіг починайте приблизно з лінії нападу.", "Замах: рука відводиться за голову, лікоть високо, тулуб прогинається.", "Удар — по верхній задній частині м'яча, кисть розслаблена.", "Не торкайтеся сітки та не переходьте центральну лінію.", "Силова подача й удар мають схожу роботу руки — тренуйте їх разом."]}, {"h": "Волейбол. Тренування контрольного нормативу", "p": ["Перед заліком корисно кілька разів виконати вправу в умовах, наближених до контрольних: з тими самими вимогами до техніки й кількості спроб. Це допомагає оцінити свій рівень і зменшити хвилювання."], "ul": ["Дізнайтеся точні вимоги нормативу від учителя.", "Виконуйте вправу серіями, як на заліку.", "Ведіть записи результатів, щоб бачити прогрес.", "Аналізуйте невдалі спроби: причина в техніці чи в концентрації?", "Відпочивайте між серіями, щоб не тренуватися втомленим."]}, {"h": "Волейбол. Прийоми самоконтролю за фізичним навантаженням", "p": ["Самоконтроль допомагає тренуватися ефективно й безпечно. Найпростіший показник — пульс: його рахують на зап'ясті або на шиї протягом 10 або 15 секунд і множать на 6 або на 4. Також важливо оцінювати самопочуття, сон, апетит і бажання тренуватися.", "Приблизну максимальну ЧСС часто оцінюють за формулою «220 мінус вік», але це лише орієнтир."], "ul": ["Вимірюйте пульс у спокої зранку, одразу після вправи та через 2–3 хв.", "Швидке зниження пульсу після навантаження — ознака доброї підготовленості.", "Запаморочення, біль у грудях, нудота — сигнал негайно припинити вправу.", "Ведіть щоденник самоконтролю: пульс, самопочуття, сон, навантаження.", "Помірне навантаження — коли ви можете говорити, але не співати."]}], "f": "Пульс у спокої в тренованих людей зазвичай нижчий, ніж у нетренованих, бо серце за одне скорочення перекачує більше крові.", "pr": ["Поміряйте пульс у спокої, після 20 присідань і через 2 хвилини відпочинку; запишіть результати в таблицю й зробіть висновок про відновлення.", "Створіть шаблон щоденника самоконтролю на тиждень (дата, пульс зранку, самопочуття, сон, навантаження) і заповніть перший день."], "q": ["Чим прямий нападаючий удар відрізняється від інших видів удару?", "Як правильно виміряти пульс?", "Які ознаки свідчать про надмірне навантаження?", "Навіщо вести щоденник самоконтролю?"]}, {"n": "56", "t": "Суддівство змагань з волейболу. Удар з переводом. Прийом м'яча, що летить збоку", "g": "Учень знатиме обов'язки суддів у волейболі, основні жести й порушення, а також техніку нападаючого удару з переводом і прийому м'яча збоку.", "k": "Модулі: Волейбол", "terms": [["Перший суддя", "головний суддя матчу, який стоїть на вишці біля сітки, керує грою і приймає остаточні рішення."], ["Другий суддя", "суддя, який стоїть з протилежного від першого судді боку сітки, стежить за торканням сітки, розстановкою і замінами."], ["Удар з переводом", "нападаючий удар, під час якого гравець змінює напрямок польоту м'яча відносно напрямку розбігу поворотом тулуба або кисті."], ["Торкання сітки", "порушення, коли гравець під час дії з м'ячем торкається сітки між антенами."]], "th": [{"h": "Волейбол. Суддівство змагань", "p": ["Суддівська бригада складається з першого й другого суддів, секретаря та лінійних суддів. Перший суддя дає свисток на подачу і фіксує порушення, другий — допомагає з боку сітки. Кожне рішення супроводжується умовним жестом, щоб гравці й глядачі розуміли, що сталося.", "Знання правил і жестів допомагає не лише суддям, а й гравцям: менше суперечок і порушень."], "ul": ["Партія триває до 25 очок, вирішальна — до 15; потрібна перевага у 2 очки.", "Команда має право на три дотики, торкання блоку не рахується.", "Гравець не може торкнутися м'яча двічі поспіль (крім блоку).", "Порушення: торкання сітки, заступ за лінію подачі, неправильна розстановка, затримка м'яча.", "Жест «м'яч в ауті» — руки підняті вгору долонями до себе."]}, {"h": "Волейбол. Нападаючий удар з переводом", "p": ["Переведення м'яча дає змогу оминути блок суперника. Розбіг і стрибок такі самі, як у прямому ударі, але перед ударом нападник повертає тулуб або кисть у потрібний бік."], "ul": ["Переведення тулубом — поворот плечей перед ударом.", "Переведення кистю — розворот кисті в момент контакту з м'ячем.", "Не показуйте напрямок удару заздалегідь.", "Удар по діагоналі зазвичай легше, ніж по лінії.", "Попередня перевірка нормативу: 10 прямих верхніх передач на точність у зазначену зону."]}, {"h": "Волейбол. Прийом м'яча, що летить збоку", "p": ["Коли м'яч летить збоку, гравець не завжди встигає повернутися обличчям. Тоді він переміщується так, щоб м'яч опинився перед тулубом, або нахиляє площину рук у бік цілі."], "ul": ["Перший крок — у бік м'яча, ноги згинаються.", "Плече, ближче до м'яча, трохи опускається, щоб площина рук дивилася в ціль.", "Руки з'єднані, лікті прямі.", "Не відмахуйтеся руками — м'яч відскочить у непередбачуваному напрямку.", "Після прийому одразу повертайтеся в стійку."]}], "f": "Ліберо — гравця захисту — легко впізнати на майданчику: він грає у формі іншого кольору, ніж його партнери.", "pr": ["Намалюйте або опишіть 4 суддівські жести у волейболі (аут, м'яч у полі, торкання сітки, перехід) і поясніть, що кожен означає.", "Виконайте імітацію прийому м'яча збоку: 3 підходи по 8 кроків у кожен бік з нахилом площини рук у бік уявної цілі."], "q": ["Хто входить до суддівської бригади у волейболі та які обов'язки першого судді?", "Скільки очок потрібно для перемоги в партії?", "Як виконати нападаючий удар з переводом?", "Як правильно прийняти м'яч, що летить збоку?"]}, {"n": "57", "t": "Контрольний норматив: 10 прямих верхніх подач на точність. Гра з діями в нападі та захисті", "g": "Учень знатиме, як підготуватися до контрольного нормативу з подачі, як правильно його виконати й оцінити свій результат, а також застосовувати дії нападу й захисту в грі.", "k": "Модулі: Волейбол", "terms": [["Пряма верхня подача", "подача, під час якої гравець стоїть обличчям до сітки й б'є по м'ячу прямою рукою над головою."], ["Контрольний норматив", "встановлене завдання, за виконанням якого вчитель оцінює рівень технічної чи фізичної підготовленості."], ["Точність", "здатність спрямувати м'яч саме в задану зону або ціль."], ["Дії в захисті", "прийом подачі й ударів, блокування та страхування, спрямовані на те, щоб м'яч не впав на свою половину."]], "th": [{"h": "Волейбол. Як скласти норматив із прямої верхньої подачі", "p": ["За КТП хлопці виконують 10 прямих верхніх подач на точність у зазначену зону, а дівчата — подачі на ігровий майданчик. Зараховуються лише подачі, виконані за правилами: з-за лицьової лінії, без заступу, через сітку і в межі визначеної ділянки.", "Оцінку ставить учитель за кількістю влучань відповідно до шкали оцінювання."], "ul": ["Перед тестом — розминка плечей, кисті та кілька пробних подач.", "Обирайте той самий ритм для кожної подачі: вдих, підкидання, удар.", "Дивіться на ціль перед підкиданням, а в момент удару — на м'яч.", "Не поспішайте після невдалої спроби, зробіть паузу.", "Підрахуйте свої влучання й порівняйте з минулими тренуваннями."]}, {"h": "Волейбол. Аналіз результату", "p": ["Самостійна оцінка допомагає зрозуміти, над чим працювати. Якщо м'ячі часто потрапляють у сітку — найімовірніше, підкидання задалеко позаду або удар низько. Якщо в аут — удар надто сильний або кисть не «накриває» м'яч."], "ul": ["М'яч у сітці — підкидайте перед собою та бийте у найвищій точці.", "М'яч в ауті — зменште силу, активніше працюйте кистю.", "М'яч летить убік — перевірте положення ніг і плечей.", "Нестабільні результати — тренуйте однакове підкидання.", "Запишіть 2 висновки для подальших тренувань."]}, {"h": "Волейбол. Навчальна гра з діями в нападі та захисті", "p": ["У грі поєднують усі вивчені елементи: подачу, прийом, передачу, удар, блок і страхування. Команда, яка швидко переходить від захисту до нападу, отримує перевагу."], "ul": ["Після своєї подачі одразу займайте позиції в захисті.", "Гравці передньої лінії готуються до блоку.", "Після прийому — швидка організація атаки через зв'язкового.", "Страхуйте нападника на випадок відскоку від блоку.", "Говоріть на майданчику — це економить час і запобігає помилкам."]}], "f": "", "pr": ["Виконайте 20 імітацій верхньої прямої подачі без м'яча перед дзеркалом, контролюючи положення ніг, підкидаючої руки й ударної руки.", "Напишіть короткий аналіз свого результату нормативу: що вдалося, які помилки були і як ви їх виправлятимете."], "q": ["Які вимоги до виконання контрольної подачі?", "Які причини потрапляння м'яча в сітку?", "Як оцінити свій результат і визначити напрям тренувань?", "Як відбувається перехід від захисту до нападу?"]}, {"n": "58", "t": "Одиночне блокування. Удар з переводом. Прийом м'яча збоку. Піднімання тулуба за 30 с", "g": "Учень знатиме техніку одиночного блокування, закріпить удар з переводом і прийом збоку та навчиться правильно виконувати піднімання тулуба за 30 секунд.", "k": "Модулі: Волейбол", "terms": [["Одиночне блокування", "захисна дія одного гравця передньої лінії, який стрибає біля сітки й руками перекриває шлях м'ячу після удару суперника."], ["Винесення рук", "перенесення кистей через верхній край сітки на бік суперника під час блоку, що дозволено правилами, якщо не заважає його грі до удару."], ["Піднімання тулуба", "силова вправа для м'язів живота: з положення лежачи на спині із зігнутими ногами піднятися до сидячого положення."], ["М'язи преса", "м'язи передньої стінки живота, які стабілізують тулуб і передають зусилля від ніг до рук."]], "th": [{"h": "Волейбол. Одиночне блокування", "p": ["Блок — перша лінія захисту. Блокуючий стежить за зв'язковим і нападником, вибирає момент стрибка і ставить руки так, щоб м'яч відскочив на бік суперника або втратив швидкість.", "Стрибати на блок треба трохи пізніше за нападника, бо йому ще потрібно зробити замах."], "ul": ["Вихідне положення: обличчям до сітки на відстані 30–50 см, руки на рівні плечей.", "Стрибок — вертикально з двох ніг, без розбігу.", "Руки випрямлені, пальці розставлені й напружені.", "Кисті трохи нахилені вперед-униз, щоб м'яч падав на бік суперника.", "Не торкайтеся сітки й не заступайте центральну лінію під час приземлення."]}, {"h": "Волейбол. Удар з переводом і прийом збоку", "p": ["Закріплюючи удар з переводом, учні вчаться оминати блок. Захисники, у свою чергу, тренують прийом м'ячів, що летять збоку після переведення, — так тренування нападу і захисту доповнюють одне одного."], "ul": ["Нападник: поворот тулуба в останній момент.", "Захисник: передбачайте напрямок удару за положенням плечей нападника.", "Прийом збоку — нахил площини рук у бік цілі.", "Працюйте в парах по черзі в ролях нападника й захисника.", "Обговорюйте, які дії нападника видавали напрямок удару."]}, {"h": "Волейбол. Піднімання тулуба за 30 секунд", "p": ["Ця вправа перевіряє силу і силову витривалість м'язів преса. Сильний прес потрібен для стабільних стрибків, ударів і подач, а також для захисту хребта."], "ul": ["Вихідне положення: лежачи на спині, ноги зігнуті, стопи на підлозі.", "Руки — за головою або схрещені на грудях (за вимогою вчителя).", "Піднімання — до торкання ліктями колін, опускання — до торкання лопатками підлоги.", "Не тягніть голову руками й не відривайте стопи від підлоги (можна з утримуванням партнером).", "Дихання рівне: видих під час піднімання."]}], "f": "", "pr": ["Виконайте вдома піднімання тулуба за 30 секунд (на килимку), запишіть результат і повторіть через 3 дні для порівняння.", "Намалюйте схему одиночного блокування: положення гравця, рук і напрямок відскоку м'яча."], "q": ["Коли блокуючий має стрибати відносно нападника?", "Яке положення кистей під час блоку?", "Як правильно виконувати піднімання тулуба?", "Як тренування нападу й захисту доповнюють одне одного?"]}, {"n": "59", "t": "Удар з переводом. Прийом м'яча збоку. Перевірка нормативу. Втома та перевтома", "g": "Учень зрозуміє різницю між втомою і перевтомою, знатиме їх ознаки та способи відновлення, а також удосконалить удар з переводом і прийом збоку.", "k": "Модулі: Волейбол", "terms": [["Втома", "тимчасове зниження працездатності після навантаження, яке минає після відпочинку."], ["Перевтома", "стан накопиченої втоми, коли організм не встигає відновлюватися між навантаженнями."], ["Відновлення", "процес повернення організму до робочого стану після фізичної чи розумової роботи."], ["Активний відпочинок", "відновлення через легку рухову діяльність, наприклад прогулянку чи розтягування."]], "th": [{"h": "Волейбол. Удар з переводом і прийом збоку", "p": ["Повторюючи удар з переводом, звертайте увагу на маскування: розбіг і замах мають бути такими самими, як при прямому ударі. У прийомі збоку головне — встигнути переміститися й поставити руки під правильним кутом."], "ul": ["Нападник не повинен розвертати плечі до моменту удару.", "Захисник займає позицію, враховуючи блок свого партнера.", "Прийом збоку — короткий крок і опускання плеча.", "Зберігайте стійку до кінця розіграшу.", "Попередня перевірка нормативу — у тих самих умовах, що й залік."]}, {"h": "Волейбол. Поняття про втому та перевтому", "p": ["Втома — природна реакція на навантаження і навіть потрібна для розвитку тренованості. Але якщо навантаження надто часті й великі, а відпочинку мало, накопичується перевтома. Вона знижує результати, послаблює імунітет і підвищує ризик травм."], "ul": ["Ознаки втоми: важкість у м'язах, зниження точності рухів, бажання відпочити.", "Ознаки перевтоми: погіршення сну, дратівливість, постійна слабкість, нехіть до тренувань.", "Підвищений пульс у спокої зранку може свідчити про недостатнє відновлення.", "Перевтома виникає також через поєднання навчання, недосипу й тренувань.", "При ознаках перевтоми — зменшіть навантаження й порадьтеся з лікарем."]}, {"h": "Волейбол. Засоби відновлення", "p": ["Відновлення — така ж частина тренування, як і вправи. Найважливіші засоби доступні кожному: сон, харчування, вода і правильне чергування навантаження та відпочинку."], "ul": ["Сон 8–9 годин для підлітків.", "Збалансоване харчування з достатньою кількістю білків і вуглеводів.", "Пиття води під час і після занять.", "Розтягування і заминка після тренування.", "Активний відпочинок у дні без тренувань."]}], "f": "Під час сну організм виділяє гормон росту, який допомагає м'язам відновлюватися після навантажень.", "pr": ["Складіть пам'ятку «Як не допустити перевтоми» з 5–6 порад для старшокласника, який поєднує навчання і спорт.", "Виконайте 10-хвилинний комплекс розтягування (м'язи стегон, литок, спини, плечей), кожну вправу утримуйте 20–30 секунд."], "q": ["Чим втома відрізняється від перевтоми?", "Які ознаки перевтоми?", "Які засоби відновлення найдоступніші?", "Як маскувати удар з переводом?"]}, {"n": "60", "t": "Суддівство змагань з волейболу. Попередня перевірка нормативу. Навчальна гра", "g": "Учень поглибить знання правил і суддівства волейболу, зможе виконувати обов'язки помічника судді в навчальній грі та підготується до нормативу.", "k": "Модулі: Волейбол", "terms": [["Лінійний суддя", "помічник судді, який прапорцем показує, чи впав м'яч у полі чи в ауті."], ["Секретар", "член суддівської бригади, який веде протокол матчу: рахунок, заміни, тайм-аути, розстановку."], ["Тайм-аут", "перерва в грі тривалістю 30 секунд, яку може взяти команда для настанов тренера."], ["Партія", "частина волейбольного матчу, яка триває до 25 очок (вирішальна — до 15) з перевагою у 2 очки."]], "th": [{"h": "Волейбол. Обов'язки суддівської бригади", "p": ["Кожен член бригади відповідає за свою ділянку. Перший суддя керує матчем, другий стежить за сіткою й замінами, лінійні — за лініями, секретар фіксує все в протоколі. Узгоджена робота бригади робить гру справедливою."], "ul": ["Матч грається до перемоги в трьох партіях.", "Кожна команда має право на 2 тайм-аути в партії.", "Заміни дозволені за правилами, їх фіксує секретар.", "Лінійні судді показують аут, м'яч у полі, торкання гравця.", "Остаточне рішення завжди за першим суддею."]}, {"h": "Волейбол. Суддівство в навчальній грі", "p": ["Учні по черзі виконують ролі суддів. Це допомагає краще зрозуміти правила, навчитися бути неупередженим і впевнено приймати рішення. Суддя має чітко свистіти й показувати жест."], "ul": ["Свисток — коротко й чітко, жест — одразу після свистка.", "Стійте на місці, звідки добре видно сітку та лінії.", "Не змінюйте рішення під тиском гравців.", "Будьте однаково уважні до обох команд.", "Після гри обговоріть спірні моменти з учителем."]}, {"h": "Волейбол. Попередня перевірка нормативу", "p": ["Попередня перевірка показує, наскільки ви готові до заліку. Після неї варто проаналізувати помилки й за кілька уроків виправити найважливішу."], "ul": ["Виконуйте вправу в умовах заліку.", "Підрахуйте вдалі спроби.", "Визначте головну технічну помилку.", "Обговоріть із учителем шляхи виправлення.", "Порівняйте результат із попередніми спробами."]}], "f": "Сучасна система підрахунку очок у волейболі, коли очко дістається за кожен виграний розіграш незалежно від того, хто подавав, зробила матчі коротшими й динамічнішими.", "pr": ["Складіть таблицю «Суддівська бригада у волейболі»: посада, де стоїть, головні обов'язки.", "Напишіть 5 питань-тестів на знання правил волейболу для однокласників з правильними відповідями."], "q": ["Хто входить до суддівської бригади й чим займається кожен?", "Скільки тайм-аутів має команда в партії і скільки триває кожен?", "Яких принципів має дотримуватися суддя навчальної гри?", "Як вести протокол матчу?"]}, {"n": "61", "t": "Одиночне блокування, удар з переводом і прийом збоку: удосконалення в грі", "g": "Учень навчиться правильно вибирати момент і місце блокування та поєднувати блок, удар з переводом і прийом збоку в навчальній грі.", "k": "Модулі: Волейбол", "terms": [["Блокуючий гравець", "гравець передньої лінії, який виконує блок проти нападника суперника."], ["Момент стрибка", "час відштовхування на блок, який залежить від висоти передачі та розбігу нападника."], ["Діагональний удар", "удар по діагоналі майданчика, наприклад із зони 4 у зону 5 суперника."], ["Удар по лінії", "удар уздовж бічної лінії майданчика, наприклад із зони 4 в зону 1 суперника."]], "th": [{"h": "Волейбол. Вибір місця й моменту для блоку", "p": ["Блокуючий має стати навпроти ударної руки нападника і закрити найімовірніший напрямок удару. Якщо стрибнути зарано, нападник проб'є над блоком або повз, якщо запізно — м'яч уже пролетить."], "ul": ["Слідкуйте за м'ячем після передачі, а потім за нападником.", "Ставайте навпроти плеча ударної руки.", "Стрибайте після того, як нападник почав стрибок.", "Закривайте діагональ, якщо в задній лінії є гравець на лінії.", "Після приземлення одразу повертайтеся у стійку."]}, {"h": "Волейбол. Удар з переводом проти блоку", "p": ["Нападник, який бачить блок, може перевести м'яч по лінії або по діагоналі. Добрий нападник у повітрі оцінює, де блок, і вибирає вільний напрямок."], "ul": ["Діагональний удар має довший шлях — більше шансів не потрапити в аут.", "Удар по лінії ризикованіший, але часто несподіваний.", "Не дивіться на місце удару під час розбігу — це підказує суперникові.", "Удар у руки блоку з виходом в аут теж приносить очко.", "Тренуйте обидва напрямки з однаковим розбігом."]}, {"h": "Волейбол. Прийом збоку в навчальній грі", "p": ["Захисники задньої лінії розподіляють зони відповідальності з урахуванням блоку: хтось страхує лінію, хтось — діагональ. Прийом збоку часто трапляється саме тоді, коли м'яч переведено повз блок."], "ul": ["Займайте позицію, з якої видно м'яч поза блоком.", "Перший рух — у бік м'яча, а не назад.", "Прийом спрямовуйте вгору в центр майданчика.", "Не бійтеся пробувати складні м'ячі — спроба краща за бездіяльність.", "Підтримуйте партнерів після помилок."]}], "f": "", "pr": ["Намалюйте половину майданчика і стрілками покажіть діагональний удар і удар по лінії із зони 4; позначте, хто з захисників страхує кожен напрямок.", "Виконайте 3 підходи по 10 імітацій блоку без стрибка: напівприсід у вихідному положенні, потім підйом на носки з випрямленням рук угору й напруженими пальцями."], "q": ["Як вибрати місце для блокування?", "Чим ризикований зарано виконаний стрибок на блок?", "Чим відрізняється удар по лінії від діагонального?", "Як захисники розподіляють зони з урахуванням блоку?"]}, {"n": "62", "t": "Удар з переводом і прийом м'яча збоку: техніка руки й платформа прийому", "g": "Учень удосконалить роботу руки під час удару з переводом і техніку постановки рук для прийому м'яча, що летить збоку.", "k": "Модулі: Волейбол", "terms": [["Замах", "рух ударної руки назад-угору перед ударом, який накопичує енергію для удару."], ["Кистьовий хльост", "швидкий рух кисті в момент удару, який надає м'ячу обертання й спрямовує його вниз."], ["Платформа прийому", "площина, утворена з'єднаними випрямленими передпліччями, від якої відскакує м'яч під час прийому знизу."], ["Крок назустріч м'ячу", "короткий крок у напрямку польоту м'яча, щоб прийняти його перед тулубом."]], "th": [{"h": "Волейбол. Робота руки під час удару з переводом", "p": ["Сила удару народжується в ногах і тулубі, а напрямок — у плечі та кисті. Під час переводу важливо не втратити швидкість удару, тому працює ланцюг: прогин тулуба — замах — випрямлення руки — хльост кистю."], "ul": ["Лікоть під час замаху вище за плече.", "Удар — прямою рукою, без згинання ліктя в момент контакту.", "Кисть розслаблена до контакту, різко напружується в момент удару.", "Перевод кистю — легкий розворот долоні в потрібний бік.", "Помилка: удар зігнутою рукою — м'яч летить слабко й неточно."]}, {"h": "Волейбол. Платформа прийому м'яча збоку", "p": ["Коли м'яч летить збоку, платформу треба розвернути так, щоб м'яч відскочив у бік зв'язкового. Для цього опускають ближче до м'яча плече й злегка повертають тулуб."], "ul": ["Кисті з'єднані: одна лежить у другій, великі пальці поруч.", "Передпліччя рівні, лікті випрямлені.", "Платформа спрямована на ціль, а не на м'яч.", "Ноги зігнуті, вага тіла переноситься в бік цілі.", "Помилка: роз'єднані руки — м'яч летить неконтрольовано."]}, {"h": "Волейбол. Навчальна гра", "p": ["У навчальній грі вчитель може додати умову: очко за атаку з переводом або за якісний прийом. Це допомагає застосовувати нові навички під тиском гри."], "ul": ["Зосереджуйтеся на одному елементі, який сьогодні вдосконалюєте.", "Помилки в грі — нормальна частина навчання.", "Після розіграшу коротко підбадьорюйте партнерів.", "Слідкуйте за чесністю у визнанні власних порушень.", "Наприкінці гри — заминка й розтягування."]}], "f": "", "pr": ["Виконайте 3 підходи по 10 повільних імітацій замаху й удару перед дзеркалом, стежачи, щоб лікоть був високо, а рука розпрямлялася повністю.", "Опишіть письмово, як має виглядати правильна платформа прийому, і назвіть три помилки, які роблять її неточною."], "q": ["Як утворюється сила нападаючого удару?", "Яку роль виконує кисть під час удару з переводом?", "Як розвернути платформу під час прийому м'яча збоку?", "Чому важливо, щоб лікті були прямими під час прийому?"]}, {"n": "63", "t": "Волейбол в олімпійському русі. Передачі у стіну. Націлена подача. Взаємодія із зв'язковим", "g": "Учень дізнається про місце волейболу в олімпійському русі, удосконалить верхні передачі у стіну, націлену подачу та взаємодію з гравцем, що виконує другу передачу.", "k": "Модулі: Волейбол", "terms": [["Олімпійська програма", "перелік видів спорту й дисциплін, змагання з яких проводять на Олімпійських іграх."], ["Пляжний волейбол", "різновид волейболу на піску, де в кожній команді по два гравці."], ["FIVB", "Міжнародна федерація волейболу, яка встановлює правила гри та проводить міжнародні змагання."], ["Багаторазові передачі", "серія передач без зупинки, яка розвиває точність, ритм і відчуття м'яча."]], "th": [{"h": "Волейбол. Волейбол у сучасному олімпійському русі", "p": ["Волейбол входить до програми Олімпійських ігор з 1964 року, коли змагання відбулися в Токіо серед чоловічих і жіночих команд. З 1996 року до олімпійської програми увійшов і пляжний волейбол.", "Олімпійський рух пропагує цінності чесної гри, поваги, дружби й досконалості — і волейбол як командна гра без контакту добре їх втілює."], "ul": ["Класичний волейбол: 6 гравців на майданчику, зал.", "Пляжний волейбол: 2 гравці, пісок, менший майданчик.", "Міжнародні правила встановлює FIVB.", "Олімпійські цінності: досконалість, дружба, повага.", "Сидячий волейбол входить до програми Паралімпійських ігор."]}, {"h": "Волейбол. Багаторазові передачі у стіну", "p": ["Передачі у стіну — класична вправа для розвитку техніки верхньої передачі. Поступово збільшуючи відстань до стіни, учень вчиться регулювати силу передачі, не порушуючи техніки."], "ul": ["Починайте з відстані 1–1,5 м.", "Збільшуйте відстань на крок лише тоді, коли робите 10 передач поспіль без помилок.", "Передавайте м'яч на висоту 1–1,5 м вище голови.", "Працюють ноги — не лише руки.", "Слідкуйте, щоб м'яч не «лежав» у руках."]}, {"h": "Волейбол. Націлена подача та взаємодія з гравцем другої передачі", "p": ["Подача у визначену зону змушує суперника приймати незручно. А у своїй атаці команда має точно взаємодіяти зі зв'язковим: нападники заздалегідь показують, яку передачу хочуть отримати."], "ul": ["Подача в зону, де стоїть гравець, що гірше приймає.", "Подача в зону, куди має вийти зв'язковий суперника, ускладнює його вихід.", "Нападники домовляються зі зв'язковим про сигнали.", "Після прийому нападники відходять для розбігу.", "Взаємодія вдосконалюється лише в спільних тренуваннях."]}], "f": "У 1964 році в Токіо волейбол уперше з'явився в програмі Олімпійських ігор.", "pr": ["Підготуйте коротке повідомлення (8–10 речень) про волейбол в олімпійському русі: з якого року він у програмі, які різновиди гри є олімпійськими.", "Якщо вдома є безпечна вільна стіна й м'який м'яч — виконайте 3 серії по 10 верхніх передач у стіну з близької відстані; якщо ні — 3 серії по 15 імітацій верхньої передачі."], "q": ["З якого року волейбол входить до олімпійської програми?", "Чим пляжний волейбол відрізняється від класичного?", "Як правильно виконувати передачі у стіну?", "Як нападники взаємодіють зі зв'язковим?"]}, {"n": "64", "t": "Пересування вздовж сітки й вихід у положення для блоку. Подачі в праву та ліву половини", "g": "Учень навчиться переміщуватися вздовж сітки й швидко займати вихідне положення для блокування, а також спрямовувати подачу в праву або ліву половину майданчика.", "k": "Модулі: Волейбол", "terms": [["Вихідне положення для блокування", "стійка біля сітки, з якої зручно стрибнути на блок: ноги на ширині плечей, коліна зігнуті, руки перед грудьми."], ["Зупинка після пересування", "різке гальмування на обидві ноги з невеликим присіданням для подальшого стрибка."], ["Тактична подача", "подача, напрямок і силу якої вибирають з урахуванням розстановки й слабких місць суперника."], ["Подача по половинах", "спрямування подачі в праву або ліву частину майданчика суперника залежно від тактичного завдання."]], "th": [{"h": "Волейбол. Пересування вздовж сітки приставним кроком і боком", "p": ["Блокуючий повинен устигнути переміститися туди, де атакує нападник. На короткі відстані використовують приставний крок, на довші — схресний або біг боком. Пересування закінчується зупинкою у вихідному положенні для стрибка."], "ul": ["Тримайте плечі паралельно сітці.", "Руки тримайте перед собою, долонями до сітки.", "Останній крок — гальмівний, коліна згинаються.", "Не підстрибуйте під час пересування.", "Після зупинки — одразу стрибок або готовність до нього."]}, {"h": "Волейбол. Вихідне положення для блокування", "p": ["Правильне вихідне положення забезпечує швидкий і високий стрибок. Якщо гравець стоїть надто близько до сітки, ризикує її торкнутися; надто далеко — м'яч пролетить між руками й сіткою."], "ul": ["Відстань до сітки — приблизно на довжину передпліччя.", "Вага рівномірно на обох ногах.", "Коліна зігнуті, тулуб прямий.", "Погляд — на зв'язкового й нападника суперника.", "Руки підняті до рівня плечей або голови."]}, {"h": "Волейбол. Подачі в праву та ліву половини", "p": ["Уміння подавати в обидві половини робить подачу непередбачуваною. Напрямок задається положенням ніг і плечей та напрямком руху руки."], "ul": ["Для подачі в праву половину розверніть плечі трохи праворуч.", "Для подачі в ліву половину — ліворуч.", "Не змінюйте підкидання — змінюється лише напрямок удару.", "Чергуйте напрямки, щоб суперник не звик.", "Подавайте в половину, де розміщено слабший прийом."]}], "f": "", "pr": ["Виконайте вдома (у вільному місці) 3 серії пересувань приставним кроком по 4 кроки вправо й вліво із зупинкою у вихідному положенні для блокування й підняттям рук угору без стрибка.", "Намалюйте схему майданчика суперника, позначте праву й ліву половини та стрілками покажіть 3 варіанти тактичної подачі."], "q": ["Які способи пересування вздовж сітки існують і коли їх застосовують?", "Яке вихідне положення для блокування?", "Як змінити напрямок подачі в праву або ліву половину?", "Навіщо чергувати напрямки подачі?"]}, {"n": "65", "t": "Організаційні вправи. Різновиди ходьби та бігу. Взаємодії гравців зон 4, 3, 2", "g": "Учень пригадає значення організаційних вправ і різновидів ходьби та бігу в розминці та зрозуміє, як взаємодіють гравці передньої лінії.", "k": "Модулі: Волейбол", "terms": [["Організаційні вправи", "шикування, перешикування, повороти й команди, які допомагають швидко й безпечно організувати клас на уроці."], ["Передня лінія", "три гравці в зонах 4, 3 і 2, які атакують і блокують біля сітки."], ["Центральний гравець", "гравець зони 3, який часто виконує швидкі атаки й допомагає блоку на обох флангах."], ["Крайній нападник", "гравець зони 4 або 2, який атакує з флангу, переважно з високих і середніх передач."]], "th": [{"h": "Волейбол. Організаційні вправи, ходьба і біг у розминці", "p": ["Організаційні вправи привчають до дисципліни й швидкої реакції на команди. Різновиди ходьби та бігу (на носках, п'ятах, приставним кроком, спиною вперед, з високим підніманням стегна) поступово готують м'язи й суглоби до навантаження."], "ul": ["Шикування в шеренгу й колону, повороти на місці.", "Ходьба на носках, на п'ятах, у напівприсіді.", "Біг приставним кроком, схресним кроком, спиною вперед.", "Прискорення на короткі відрізки.", "Відновлення дихання під час ходьби наприкінці розминки."]}, {"h": "Волейбол. Ролі гравців передньої лінії", "p": ["Гравці зон 4, 3 і 2 виконують головні атакувальні дії й блокують. У навчальній грі зв'язковий часто стоїть у зоні 3 або 2, а нападники — по краях. Кожен повинен знати свою роль на прийомі та в атаці."], "ul": ["Зона 4 — найчастіше основний атакувальний гравець.", "Зона 3 — центральна, швидкі атаки й допомога блоку.", "Зона 2 — нападник або зв'язковий залежно від системи.", "Усі троє беруть участь у блоці.", "Після переходу ролі змінюються згідно з розстановкою."]}, {"h": "Волейбол. Взаємодії гравців зон 4, 3, 2", "p": ["Взаємодія — це не лише передача від одного гравця іншому, а й переміщення без м'яча: відхід для розбігу, страхування, перехресні рухи. Найпростіша комбінація: прийом у зону 3 — передача в зону 4 або 2 — удар."], "ul": ["Гравець зони 3 приймає першу передачу й передає на край.", "Нападник, який не отримує передачу, страхує партнера.", "Голосові сигнали допомагають розподіляти дії.", "Тренуйте комбінації в повільному темпі, потім пришвидшуйте.", "Помилка: два гравці одночасно йдуть на м'яч."]}], "f": "", "pr": ["Виконайте вдома 5-хвилинну розминку з різновидами ходьби на місці й у кімнаті (на носках, на п'ятах, з високим підніманням стегна) та запишіть, які м'язи працювали в кожному різновиді.", "Намалюйте схему комбінації «прийом — передача з зони 3 у зону 4 — удар» з позначенням руху гравців."], "q": ["Навіщо потрібні організаційні вправи на уроці?", "Які різновиди ходьби й бігу використовують у розминці?", "Яка роль гравців зон 4, 3 і 2?", "Що робить гравець, який не отримав передачу?"]}, {"n": "66", "t": "Олімпійський волейбол: ролі гравців. Націлена подача. Взаємодія з гравцем другої передачі", "g": "Учень дізнається про сучасні ігрові амплуа у волейболі та вдосконалить націлену подачу й взаємодію з гравцем, що виконує другу передачу.", "k": "Модулі: Волейбол", "terms": [["Ліберо", "спеціалізований гравець захисту, який грає лише в задній лінії, не подає (за базовими правилами) і не атакує вище верхнього краю сітки, носить форму іншого кольору."], ["Розігрувач", "зв'язковий гравець, що організовує атаку командою передач нападникам."], ["Олімпійський турнір", "змагання з виду спорту в межах Олімпійських ігор, де визначають чемпіонів і призерів."], ["Фейр-плей", "принцип чесної гри: дотримання правил і повага до суперника, суддів і партнерів."]], "th": [{"h": "Волейбол. Олімпійський волейбол і амплуа гравців", "p": ["На олімпійських турнірах грають найсильніші збірні світу. Сучасний волейбол — гра спеціалістів: розігрувач, нападники, центральні блокуючі, діагональний, ліберо. Кожен має свої завдання, а перемога залежить від їх злагодженості.", "Олімпійські турніри вчать нас і цінностей: повага до суперника та фейр-плей — обов'язкова частина гри."], "ul": ["Розігрувач — мозок команди.", "Діагональний — головний нападник, часто грає навпроти розігрувача.", "Центральний блокуючий — блок і швидкі атаки.", "Догравальники — прийом і атака з флангів.", "Ліберо — прийом і захист у задній лінії."]}, {"h": "Волейбол. Націлена подача", "p": ["Подача в певну зону — тактичне завдання. Подаючи на гравця, який мусить потім атакувати, команда ускладнює суперникові організацію нападу."], "ul": ["Перед подачею оцініть розстановку суперника.", "Обирайте ціль: стик, кут, конкретний гравець.", "Стабільна техніка — основа точності.", "Не ризикуйте надмірно, якщо команда веде в рахунку.", "Ведіть підрахунок вдалих подач на тренуванні."]}, {"h": "Волейбол. Взаємодія з гравцем, що виконує другу передачу", "p": ["Розігрувач вирішує, кому дати м'яч, а нападники мають бути готові атакувати будь-якої миті. Важливо, щоб перша передача давала йому час і вибір."], "ul": ["Прийом — високий і в зону розігрувача.", "Нападники заздалегідь займають місце для розбігу.", "Розігрувач зважає на блок суперника.", "Невдалу першу передачу краще віддати високо в центр.", "Спільні сигнали обговорюють заздалегідь."]}], "f": "Пляжний волейбол став олімпійським видом спорту на Іграх 1996 року.", "pr": ["Складіть таблицю «Амплуа у волейболі»: назва, зона гри, головні завдання.", "Напишіть 4–5 речень про те, як ви розумієте принцип фейр-плей у волейболі, з прикладом ситуації."], "q": ["Які амплуа є в сучасному волейболі?", "Хто такий ліберо і які обмеження для нього є?", "Як обирати ціль для націленої подачі?", "Що допомагає розігрувачу ефективно організувати атаку?"]}, {"n": "67", "t": "Пересування приставним кроком із поворотом на 180° і прискоренням", "g": "Учень зрозуміє, як виконувати пересування приставним кроком з поворотом на 180° і подальшим прискоренням та навіщо ця навичка потрібна у волейболі.", "k": "Модулі: Волейбол", "terms": [["Поворот на 180°", "зміна напрямку руху на протилежний обертом тіла на передній частині стопи."], ["Прискорення", "швидке нарощування швидкості руху з місця або після зміни напрямку."], ["Координаційні здібності", "здатність точно, швидко й економно виконувати складні рухи та змінювати їх відповідно до ситуації."], ["Стартова швидкість", "швидкість перших кроків руху, яка залежить від реакції й сили ніг."]], "th": [{"h": "Волейбол. Значення переміщень з поворотом", "p": ["У грі гравцеві часто доводиться різко змінювати напрямок: побігти за м'ячем, що відскочив від блоку, повернутися назад після страхування. Пересування з поворотом і прискоренням тренує саме цю навичку — швидко переключатися з одного руху на інший."], "ul": ["Тренує реакцію та координацію.", "Розвиває стартову швидкість.", "Зміцнює м'язи гомілкостопа й колін.", "Наближає тренування до реальних ігрових ситуацій.", "Вимагає доброї розминки перед виконанням."]}, {"h": "Волейбол. Техніка пересування з поворотом на 180° і прискоренням", "p": ["Вправа складається з трьох частин: кілька приставних кроків, поворот і прискорення. Головне — зберігати низьке положення тіла, щоб поворот був швидким і стійким."], "ul": ["Приставні кроки в низькій стійці, без схрещування ніг.", "Поворот — на передній частині стопи опорної ноги, тулуб повертається разом із ногами.", "Під час повороту центр ваги не піднімається.", "Перші кроки прискорення — короткі й часті, з активною роботою рук.", "Помилка: поворот на п'ятах — втрачається швидкість і зростає ризик підвернути ногу."]}, {"h": "Волейбол. Безпека та дозування", "p": ["Різкі зміни напрямку навантажують суглоби, тому вправу виконують після розминки, на неслизькій поверхні, з поступовим збільшенням швидкості."], "ul": ["Спершу виконуйте вправу повільно, потім пришвидшуйтеся.", "Відрізки прискорення — 3–5 м.", "Відпочинок між повтореннями — до відновлення дихання.", "Дотримуйтеся дистанції з іншими учнями.", "Припиняйте при болю в суглобах."]}], "f": "", "pr": ["Виконайте вдома 3 серії вправи «повороти на 180°» на місці в низькій стійці (по 10 поворотів, повільно, на неслизькій підлозі), стежачи, щоб поворот був на передній частині стопи.", "Опишіть 3 ігрові ситуації у волейболі, коли гравцеві потрібно різко змінити напрямок руху."], "q": ["Навіщо волейболістові вміти швидко повертатися й прискорюватися?", "Як правильно виконати поворот на 180°?", "Чому не можна повертатися на п'ятах?", "Як дозувати цю вправу?"]}, {"n": "68", "t": "Пересування вздовж сітки з поворотом на 180° та імітацією блоку", "g": "Учень навчиться поєднувати пересування вздовж сітки, поворот і імітацію блокування, що наближує тренування до ігрових умов.", "k": "Модулі: Волейбол", "terms": [["Імітаційна вправа", "виконання руху без м'яча або без суперника для засвоєння правильної техніки."], ["Блок", "захисна дія біля сітки, коли гравці стрибають і руками перекривають шлях м'ячу після удару."], ["Синхронність", "одночасне й узгоджене виконання руху кількома гравцями."], ["Приземлення з амортизацією", "м'яке приземлення на обидві ноги зі згинанням колін, щоб зменшити удар на суглоби."]], "th": [{"h": "Волейбол. Поєднання пересування і блоку", "p": ["Блокуючому рідко вдається стояти на місці: зв'язковий суперника постійно змінює напрямок атаки. Тому вправи поєднують переміщення вздовж сітки, поворот і стрибок або імітацію блоку."], "ul": ["Пересування приставним кроком — 2–3 кроки.", "Зупинка у вихідному положенні.", "Імітація блоку: руки вгору, пальці розставлені.", "Поворот на 180° і повернення в іншому напрямку.", "Повторення в обидва боки однаково."]}, {"h": "Волейбол. Техніка імітації блоку", "p": ["Імітація допомагає закріпити положення рук і тіла. Навіть без стрибка можна відпрацювати винесення рук уперед-угору, напруження пальців і нахил кистей."], "ul": ["Руки піднімаються одночасно, прямо вгору від грудей.", "Відстань між кистями менша за розмір м'яча.", "Кисті нахилені вперед-униз.", "Погляд спрямований на уявного нападника.", "Після імітації — повернення в стійку."]}, {"h": "Волейбол. Груповий блок і безпека біля сітки", "p": ["У грі часто блокують двоє чи троє гравців разом. Для цього потрібна синхронність: один гравець ставить блок навпроти нападника, другий підходить і стрибає поруч одночасно з ним."], "ul": ["Головний блокуючий визначає місце блоку.", "Партнер підходить і стрибає разом із ним.", "Не зіштовхуйтеся плечима — тримайте дистанцію.", "Приземляйтеся на своїй половині, не заступаючи лінію.", "Приземлення з амортизацією захищає коліна."]}], "f": "Торкання м'яча блоком у волейболі не рахується як один із трьох дотиків команди.", "pr": ["Виконайте 3 серії по 6 повторень: 2 приставні кроки — зупинка — імітація блоку без стрибка (підйом на носки, руки вгору) — поворот на 180° — повтор в інший бік.", "Опишіть письмово, як двоє гравців виконують груповий блок, і назвіть 2 правила безпеки під час нього."], "q": ["Навіщо поєднувати пересування і блокування у вправах?", "Яке положення рук під час блоку?", "Що таке синхронність у груповому блоці?", "Чому важливе приземлення з амортизацією?"]}, {"n": "69", "t": "Взаємодії гравців прийому зі зв'язковим гравцем у зонах 3, 2, 4", "g": "Учень зрозуміє, як організувати взаємодію гравців прийому зі зв'язковим, який перебуває в зоні 3, 2 або 4, і як змінюється атака залежно від його місця.", "k": "Модулі: Волейбол", "terms": [["Перша передача", "передача після прийому подачі або удару суперника, адресована зв'язковому."], ["Прийом-передача", "зв'язка двох дій, коли якість прийому визначає можливості другої передачі."], ["Комбінація", "заздалегідь узгоджена послідовність дій кількох гравців для атаки."], ["Умовний сигнал", "жест чи слово, яким гравці домовляються про дії, не розкриваючи їх суперникові."]], "th": [{"h": "Волейбол. Зв'язковий у зоні 3", "p": ["Коли зв'язковий у центрі, він може передати м'яч і в зону 4, і в зону 2 — це найзручніша схема для навчальної гри. Прийом спрямовують у центр, на 1 м від сітки."], "ul": ["Прийом — у зону 3, високо.", "Зв'язковий стоїть обличчям до зони 4.", "Нападники в зонах 4 і 2 готові до удару.", "Передача назад (у зону 2) робиться прогином тулуба.", "Перевага: суперник не знає, куди піде атака."]}, {"h": "Волейбол. Зв'язковий у зонах 2 та 4", "p": ["Якщо зв'язковий у зоні 2, нападники атакують із зон 3 і 4 — це класична схема сучасного волейболу. Зв'язковий у зоні 4 трапляється рідше, тоді атака будується через зони 3 і 2."], "ul": ["Зв'язковий у зоні 2 — прийом спрямовують між зонами 2 і 3.", "Атака з зони 4 вимагає довгої передачі через увесь майданчик.", "Зв'язковий у зоні 4 — прийом ближче до лівого краю.", "Гравці прийому мають знати, де зв'язковий у кожній розстановці.", "Неточний прийом змушує зв'язкового бігти — атака втрачає швидкість."]}, {"h": "Волейбол. Організація взаємодії", "p": ["Взаємодію тренують з поступовим ускладненням: спочатку прийом з накидання, потім із подачі, потім із атакою. Важливі спільні сигнали й обговорення."], "ul": ["Домовтеся, хто приймає м'ячі між гравцями.", "Використовуйте умовні сигнали для комбінацій.", "Нападники відкриваються для передачі.", "Зв'язковий повідомляє, кому дасть м'яч, лише сигналом.", "Після вправи аналізуйте якість прийому за шкалою «добре — задовільно — погано»."]}], "f": "", "pr": ["Намалюйте три схеми атаки: зі зв'язковим у зоні 3, у зоні 2 і в зоні 4 — зі стрілками прийому, передачі та удару.", "Придумайте 3 умовні сигнали для комбінацій у вашій команді й опишіть, що кожен означає."], "q": ["Чим відрізняються схеми атаки зі зв'язковим у зонах 3, 2 і 4?", "Куди треба спрямовувати прийом, якщо зв'язковий у зоні 2?", "Навіщо використовують умовні сигнали?", "Як неточний прийом впливає на атаку?"]}, {"n": "70", "t": "Організаційні вправи. Різновиди ходьби та бігу. Верхня бокова подача. Передачі в падінні", "g": "Учень ознайомиться з технікою верхньої бокової подачі та передач м'яча в падінні й дізнається, як безпечно падати на майданчику.", "k": "Модулі: Волейбол", "terms": [["Верхня бокова подача", "подача, під час якої гравець стоїть боком до сітки, а ударна рука рухається по дузі збоку вгору."], ["Передача в падінні", "передача м'яча, яку виконують у момент втрати рівноваги, коли інакше дістати м'яч неможливо."], ["Самостраховка", "прийоми безпечного падіння, які захищають від травм."], ["Перекат", "спосіб падіння, коли тіло послідовно торкається підлоги різними частинами, розподіляючи удар."]], "th": [{"h": "Волейбол. Розминка та організаційні вправи", "p": ["Перед подачами й падіннями особливо важливо розігріти плечі, спину та коліна. Різновиди ходьби й бігу підвищують температуру м'язів, а організаційні вправи налаштовують на зосередженість."], "ul": ["Шикування, повороти, перешикування.", "Ходьба з колами руками, біг з поворотами.", "Нахили й повороти тулуба.", "Присідання й випади.", "Розминка кистей і плечей."]}, {"h": "Волейбол. Верхня бокова подача", "p": ["Гравець стоїть лівим боком до сітки (для правші). М'яч підкидають над головою, рука рухається по дузі знизу-збоку вгору, і удар наносять прямою рукою над головою. Подача потужна, але складніша для точності."], "ul": ["Ноги на ширині плечей, лівий бік до сітки.", "Підкидання — над правим плечем на 1–1,5 м.", "Рука рухається по дузі, тулуб повертається до сітки.", "Удар — долонею у найвищій точці.", "Помилка: підкидання далеко вбік — удар виходить неточним."]}, {"h": "Волейбол. Передачі в падінні та самостраховка", "p": ["Коли м'яч летить далеко, гравець робить випад і передає м'яч, втрачаючи рівновагу, а потім безпечно падає. Головне правило — спершу передача, потім падіння з перекатом, а не навпаки."], "ul": ["Широкий випад до м'яча, низька позиція.", "Передача — знизу або зверху залежно від висоти.", "Падіння — на стегно й бік, з перекатом на спину.", "Не виставляйте прямі руки — ризик травми зап'ясть.", "Підборіддя притиснуте до грудей, щоб захистити голову.", "Вивчають падіння лише під контролем учителя на матах."]}], "f": "", "pr": ["Опишіть послідовність виконання верхньої бокової подачі по фазах (вихідне положення, підкидання, замах, удар, завершення).", "Виконайте 3 підходи по 8 широких випадів у різні боки з імітацією прийому м'яча знизу (без падіння), утримуючи рівновагу."], "q": ["Чим верхня бокова подача відрізняється від верхньої прямої?", "Коли виконують передачу в падінні?", "Які правила самостраховки треба знати?", "Чому не можна виставляти прямі руки під час падіння?"]}, {"n": "71", "t": "Прямий нападаючий удар за ходом сильною рукою. Верхня бокова подача. Передачі в падінні", "g": "Учень зрозуміє техніку прямого нападаючого удару за ходом із високих і середніх передач сильною рукою та закріпить верхню бокову подачу й передачі в падінні.", "k": "Модулі: Волейбол", "terms": [["Удар за ходом", "нападаючий удар, під час якого напрямок польоту м'яча збігається з напрямком руху нападника після розбігу."], ["Висока передача", "передача з великою висотою польоту м'яча, яка дає нападникові час на розбіг і вибір моменту стрибка."], ["Сильна рука", "рука, якою людина краще володіє і яку частіше використовує (у правші — права)."], ["Стрибок з двох ніг", "відштовхування обома ногами одночасно, яке дає найвищий і найстійкіший стрибок для удару."]], "th": [{"h": "Волейбол. Прямий нападаючий удар за ходом", "p": ["Удар за ходом — природне продовження розбігу: нападник біжить до сітки під кутом і б'є в тому ж напрямку. З високої передачі є більше часу, тому її використовують на етапі навчання і тоді, коли прийом неточний."], "ul": ["Чекайте, поки м'яч почне опускатися, і лише тоді починайте розбіг.", "Останній крок широкий — гальмування й перехід у стрибок.", "Мах руками назад-угору допомагає вистрибнути вище.", "Удар — сильною рукою перед собою у найвищій точці.", "З середньої передачі розбіг починається раніше."]}, {"h": "Волейбол. Верхня бокова подача", "p": ["Закріплюючи бокову подачу, звертайте увагу на стабільність підкидання й повну амплітуду руху руки. Подача стає потужнішою, коли в удар включається поворот тулуба."], "ul": ["Однакове підкидання — основа стабільності.", "Поворот тулуба синхронний з рухом руки.", "Удар прямою рукою.", "Контролюйте, щоб не заступати лицьову лінію.", "Подавайте спершу з середини майданчика, потім з-за лінії."]}, {"h": "Волейбол. Передачі в падінні", "p": ["Цю навичку закріплюють поступово: від випадів до падінь на м'яку поверхню. На уроці вправи виконують лише за командою вчителя."], "ul": ["Падіння лише після передачі.", "Перекат — через стегно на спину.", "Голова захищена, підборіддя до грудей.", "Швидке вставання і повернення в гру.", "Відпрацьовуйте в обидва боки."]}], "f": "", "pr": ["Виконайте 3 підходи по 8 повільних імітацій розбігу (2 кроки на місці) з махом рук і замахом ударної руки без стрибка, контролюючи роботу рук.", "Поясніть письмово, чому для навчання нападаючого удару краще використовувати високі передачі, а не короткі."], "q": ["Що означає удар за ходом?", "Коли нападник має починати розбіг під високу передачу?", "Яку роль відіграє мах руками під час стрибка?", "Як поворот тулуба впливає на силу бокової подачі?"]}, {"n": "72", "t": "Контрольне тестування: 6 передач через сітку на точність. Передачі в парах у русі", "g": "Учень знатиме, як підготуватися й виконати контрольне тестування з передач на точність через сітку та як оцінити свій результат.", "k": "Модулі: Волейбол", "terms": [["Передача через сітку", "верхня або нижня передача, яка спрямовує м'яч на бік суперника як атакувальну чи вимушену дію."], ["Контрольне тестування", "перевірка рівня засвоєння навички за встановленими вимогами й кількістю спроб."], ["Траєкторія", "лінія, по якій летить м'яч від моменту контакту до падіння."], ["Передачі в парах з пересуванням", "вправа, під час якої партнери передають м'яч один одному, переміщуючись уздовж майданчика."]], "th": [{"h": "Волейбол. Вимоги до тестування", "p": ["Учень виконує 6 передач через сітку із зон 2, 3 і 4 у зазначену вчителем зону. Зараховуються передачі, виконані технічно правильно, без затримки м'яча, що потрапили в задану зону. Оцінку виставляє вчитель за кількістю влучань."], "ul": ["Уважно вислухайте, в яку зону треба передавати.", "Займіть місце під м'ячем заздалегідь.", "Контакт — над лобом, пальцями.", "Траєкторія — висока, над сіткою з запасом.", "Порахуйте свої влучання та запишіть результат."]}, {"h": "Волейбол. Як підготуватися до тесту", "p": ["Точність залежить від стабільної техніки та контролю сили. Перед тестом корисно зробити кілька серій передач у парі на різну відстань, а також кілька пробних передач через сітку."], "ul": ["Розім'яти пальці й кисті.", "Кілька серій передач у парі на 3, 4, 6 м.", "Пробні передачі через сітку в задану зону.", "Дихайте рівно й не поспішайте.", "Аналізуйте: недоліт — більше працюйте ногами, переліт — зменшіть силу."]}, {"h": "Волейбол. Передачі в парах з пересуванням", "p": ["Партнери рухаються приставним кроком уздовж сітки чи майданчика й передають м'яч один одному. Вправа вчить передавати м'яч у русі, що часто трапляється в грі."], "ul": ["Перед контактом зупиняйтеся, щоб передача була точною.", "Передавайте трохи попереду партнера в напрямку руху.", "Висота передачі — 1,5–2 м над головою.", "Тримайте однакову швидкість пересування з партнером.", "Міняйтеся напрямком руху."]}], "f": "", "pr": ["Запишіть свій результат тестування, назвіть дві причини невдалих спроб і заплануйте 2 вправи для їх виправлення.", "Виконайте 3 підходи по 15 імітацій верхньої передачі з присіданням і випрямленням ніг, стежачи за роботою всього тіла."], "q": ["Які вимоги до контрольних передач через сітку?", "Як виправити недоліт і переліт м'яча?", "Чим корисні передачі в парах із пересуванням?", "Як правильно оцінити свій результат?"]}, {"n": "73", "t": "Прямий нападаючий удар за ходом із зон 2 і 4 слабкою рукою", "g": "Учень зрозуміє, навіщо тренувати нападаючий удар слабкою рукою, і знатиме особливості атаки із зон 2 і 4.", "k": "Модулі: Волейбол", "terms": [["Слабка рука", "рука, якою людина володіє гірше (у правші — ліва)."], ["Атака з зони 4", "нападаючий удар з лівого флангу передньої лінії, найзручніший для правші."], ["Атака з зони 2", "нападаючий удар з правого флангу передньої лінії, зручніший для лівші."], ["Симетричний розвиток", "рівномірний розвиток обох боків тіла, що знижує ризик травм і порушень постави."]], "th": [{"h": "Волейбол. Атака із зон 2 і 4", "p": ["Для правші зона 4 зручніша: м'яч підходить до ударної руки з боку тулуба. У зоні 2 правші доводиться розвертатися, і м'яч перетинає лінію тіла. Тому у зоні 2 зручніше атакувати лівші або гравці, які володіють обома руками."], "ul": ["Зона 4: розбіг з-за меж майданчика під кутом.", "Зона 2: розбіг ближче до центру, поворот до м'яча.", "Гравець має знати, з якого боку прилітає передача.", "Удар із незручної зони — вибір напряму важливіший за силу.", "Блок суперника по-різному стоїть проти лівої й правої руки."]}, {"h": "Волейбол. Удар слабкою рукою", "p": ["Удар слабкою рукою спершу виходить незграбним — це нормально. Він рідше використовується в грі, але тренування обох рук покращує координацію та робить нападника непередбачуваним."], "ul": ["Спочатку — імітація без м'яча.", "Потім — удари по м'ячу в стіну або в підлогу.", "Розбіг дзеркальний відносно сильної руки.", "Удар із середньої або високої передачі.", "Не прагніть сили — спершу точність."]}, {"h": "Волейбол. Симетричний розвиток і профілактика травм", "p": ["Якщо постійно працювати однією рукою, м'язи з одного боку стають сильнішими, що може вплинути на поставу. Вправи для слабкої руки та загальне зміцнення обох боків допомагають уникнути цього."], "ul": ["Виконуйте силові вправи для обох рук однаково.", "Розтягуйте обидва плечі після тренування.", "Стежте за положенням плечей перед дзеркалом.", "Не перевантажуйте ударну руку.", "При болю в плечі — зверніться до лікаря."]}], "f": "", "pr": ["Виконайте 3 підходи по 10 імітацій замаху й удару слабкою рукою перед дзеркалом, порівнюючи рух із сильною рукою.", "Виконайте вправи для симетричного розвитку плечового пояса: по 2 підходи кругів руками, розведень рук у сторони і вправи «замок за спиною» по 10–15 разів."], "q": ["Чому зона 4 зручніша для атаки правші?", "Навіщо тренувати удар слабкою рукою?", "Як побудувати навчання удару слабкою рукою?", "Чому важливий симетричний розвиток тіла?"]}, {"n": "74", "t": "Організаційні вправи. Різновиди ходьби та бігу. Навчальна гра у волейбол", "g": "Учень застосовуватиме вивчені технічні й тактичні елементи в навчальній грі та розумітиме, як правильно підготуватися до неї.", "k": "Модулі: Волейбол", "terms": [["Розіграш", "відрізок гри від подачі до моменту, коли м'яч виходить з гри після свистка судді."], ["Навчальна гра", "гра за спрощеними або основними правилами, мета якої — закріпити вивчені навички."], ["Командна взаємодія", "узгоджені дії всіх гравців команди, спрямовані на спільний результат."], ["Розминка", "підготовча частина заняття, яка готує м'язи, суглоби й серцево-судинну систему до навантаження."]], "th": [{"h": "Волейбол. Розминка перед грою", "p": ["Розминка складається з організаційних вправ, різновидів ходьби та бігу, ЗРВ і спеціальних вправ з м'ячем. Вона зменшує ризик травм і допомагає швидше ввійти в гру."], "ul": ["Організаційні вправи — шикування й повороти.", "Ходьба та біг з різними завданнями.", "ЗРВ для рук, тулуба й ніг.", "Передачі в парах.", "Кілька пробних подач і ударів."]}, {"h": "Волейбол. Навчальна гра: техніка і тактика", "p": ["У грі учні застосовують подачу, прийом, передачу, удар і блок, а також тактичні системи. Учитель може ставити завдання: наприклад, атакувати лише через три дотики або подавати в певну зону."], "ul": ["Тримайте свою зону відповідальності.", "Атакуйте через три дотики.", "Подавайте стабільно, без зайвого ризику.", "Після кожного розіграшу — коротке спілкування.", "Стежте за розстановкою під час переходу."]}, {"h": "Волейбол. Психологія та культура гри", "p": ["Командна гра — це також уміння підтримати партнера і поважати суперника. Позитивне спілкування підвищує результативність, а звинувачення лише заважають."], "ul": ["Підбадьорюйте партнера після помилки.", "Вітайте суперника до й після гри.", "Визнавайте власні порушення.", "Не сперечайтеся із суддею.", "Після гри — заминка й обговорення."]}], "f": "", "pr": ["Напишіть аналіз однієї навчальної гри: які елементи вам вдалися, які ні, і що ви зробите, щоб їх покращити.", "Складіть і виконайте 10-хвилинну розминку, яку можна зробити вдома перед заняттями спортом, записавши вправи й кількість повторень."], "q": ["З яких частин складається розминка перед грою?", "Які завдання може ставити вчитель у навчальній грі?", "Як поведінка гравців впливає на результат команди?", "Що таке розіграш?"]}, {"n": "75", "t": "Функціональні можливості організму. Організаційні вправи. Різновиди ходьби та бігу", "g": "Учень зрозуміє, що таке функціональні можливості організму, якими показниками їх оцінюють і як волейбол та інші заняття впливають на них.", "k": "Модулі: Волейбол", "terms": [["Функціональні можливості", "здатність систем організму (серцево-судинної, дихальної, м'язової) виконувати роботу та пристосовуватися до навантажень."], ["ЖЄЛ", "життєва ємність легень — найбільший об'єм повітря, який людина може видихнути після максимального вдиху."], ["Аеробне енергозабезпечення", "отримання енергії за участі кисню під час тривалої роботи помірної інтенсивності."], ["Анаеробне енергозабезпечення", "отримання енергії без достатньої участі кисню під час коротких інтенсивних зусиль, наприклад стрибків і ривків."]], "th": [{"h": "Волейбол. Що таке функціональні можливості організму", "p": ["Функціональні можливості показують, наскільки добре організм справляється з навантаженням: як швидко серце й легені постачають кисень, як м'язи використовують енергію і як швидко відновлюються. Їх можна покращити регулярними тренуваннями.", "Волейбол поєднує короткі вибухові дії (стрибки, ривки) з паузами, тому розвиває і анаеробні, і аеробні можливості."], "ul": ["Серцево-судинна система — пульс, артеріальний тиск.", "Дихальна система — ЖЄЛ, частота дихання.", "М'язова система — сила, витривалість.", "Нервова система — швидкість реакції й координація.", "Показник тренованості — швидкість відновлення після навантаження."]}, {"h": "Волейбол. Як оцінити свої функціональні можливості", "p": ["Найпростіші способи доступні вдома: підрахунок пульсу в спокої й після навантаження, проба з присіданнями, затримка дихання. Головне — порівнювати свої результати з власними попередніми, а не з чужими."], "ul": ["Пульс у спокої вимірюйте вранці лежачи.", "Проба з 20 присіданнями: пульс до, одразу після та через 2–3 хв.", "Затримка дихання на вдиху — лише сидячи і без надмірного зусилля.", "Записуйте результати раз на місяць.", "Погане самопочуття під час проб — сигнал зупинитися."]}, {"h": "Волейбол. Організаційні вправи, ходьба і біг", "p": ["Різновиди ходьби та бігу поступово підвищують навантаження на серце й дихання і є природною підготовкою до гри. Під час ходьби наприкінці уроку пульс знижується, а дихання відновлюється."], "ul": ["Ходьба звичайна, на носках, на п'ятах.", "Біг з високим підніманням стегна, із закиданням гомілки.", "Біг приставним кроком і спиною вперед.", "Ходьба з глибоким диханням для відновлення.", "Організаційні вправи вчать дисципліни та уваги."]}], "f": "Під час фізичних навантажень серце здатне перекачувати в кілька разів більше крові за хвилину, ніж у стані спокою.", "pr": ["Виконайте пробу з 20 присіданнями за 30 секунд: виміряйте пульс до, одразу після і через 2 хвилини; запишіть і зробіть висновок про своє відновлення.", "Поясніть письмово (5–6 речень), чому у волейболі важливі і аеробні, і анаеробні можливості організму."], "q": ["Що таке функціональні можливості організму?", "Якими показниками їх можна оцінити?", "Чим аеробне енергозабезпечення відрізняється від анаеробного?", "Як волейбол впливає на функціональні можливості?"]}, {"n": "76", "t": "Імітація нападаючого удару з обманними діями. Різновиди ходьби та бігу", "g": "Учень дізнається, що таке обманні дії в нападі у волейболі, коли їх застосовують і як виконувати імітацію нападаючого удару з обманом.", "k": "Модулі: Волейбол", "terms": [["Обманні дії", "дії нападника, які вводять суперника в оману щодо напрямку чи сили атаки."], ["Скидка", "обманний удар, коли нападник замість сильного удару легенько перекидає м'яч пальцями за блок або в порожню зону."], ["Накат", "атакувальний удар зі зменшеною силою і обертанням м'яча вгору-вперед, щоб перекинути його через блок у глибину майданчика."], ["Імітація нападаючого удару", "виконання всіх фаз удару без м'яча або з м'ячем на місці для закріплення техніки."]], "th": [{"h": "Волейбол. Обманні дії в нападі", "p": ["Не кожну атаку треба завершувати сильним ударом. Якщо блок високий або захисники стоять глибоко, ефективнішою може бути скидка чи накат у вільну зону. Головне — замах і розбіг мають бути такими, як для сильного удару, щоб суперник не розгадав задуму."], "ul": ["Скидка — у зону за блоком, ближче до сітки.", "Накат — у глибину майданчика над блоком.", "Обман застосовують зрідка, щоб він залишався несподіваним.", "Розбіг і замах однакові з силовим ударом.", "Правило: м'яч не можна ловити чи затримувати — лише короткий дотик."]}, {"h": "Волейбол. Техніка імітації удару з обманом", "p": ["Імітація допомагає відпрацювати маскування. Спочатку виконують повний замах, а в останній момент замість удару роблять м'який рух кистю."], "ul": ["Розбіг — 2–3 кроки, стрибок з двох ніг.", "Замах такий самий, як для сильного удару.", "У момент контакту рука сповільнюється, працюють пальці.", "Погляд — на зону, куди спрямовується м'яч, лише в останній момент.", "Приземлення з амортизацією."]}, {"h": "Волейбол. Ходьба та біг як частина підготовки", "p": ["Перед стрибковою роботою важливо добре розігрітися. Різновиди ходьби та бігу з поступовим прискоренням готують ноги до вистрибування й приземлень."], "ul": ["Біг з підніманням стегна.", "Біг із закиданням гомілки.", "Стрибкові вправи в русі низької інтенсивності.", "Ходьба з махами ногами.", "Перехід до спеціальних вправ."]}], "f": "", "pr": ["Опишіть дві ігрові ситуації, коли скидка буде ефективнішою за сильний удар, і поясніть чому.", "Виконайте 3 підходи по 8 імітацій замаху з переходом у м'який рух кистю (без стрибка), стоячи на місці."], "q": ["Що таке обманні дії у волейболі?", "Чим скидка відрізняється від накату?", "Чому розбіг і замах під час обману мають бути такими самими, як для сильного удару?", "Які правила треба пам'ятати під час скидки?"]}, {"n": "77", "t": "Індивідуальне блокування нападаючого удару. Страхування блокуючого. Навчальна гра", "g": "Учень удосконалить техніку індивідуального блокування та знатиме, як організувати страхування блокуючого гравця в навчальній грі.", "k": "Модулі: Волейбол", "terms": [["Індивідуальне блокування", "блокування, яке виконує один гравець проти одного нападника."], ["Страхування блокуючого", "розташування партнерів позаду блоку, щоб підібрати м'яч, який відскочив від блоку на свій бік."], ["Відскок від блоку", "м'яч, що після удару об руки блокуючого змінює напрямок і летить на будь-яку половину майданчика."], ["Активний блок", "блок, під час якого гравець виносить руки над сіткою й спрямовує м'яч униз на бік суперника."]], "th": [{"h": "Волейбол. Індивідуальне блокування", "p": ["Індивідуальний блок застосовують, коли нападник атакує з краю або коли партнер не встигає підійти. Блокуючий повинен правильно вибрати місце, момент стрибка і положення рук."], "ul": ["Стійте навпроти ударної руки нападника.", "Стрибок — після початку стрибка нападника.", "Руки виносяться над сіткою, кисті напружені.", "Активний блок: руки вперед і вниз над сіткою.", "Пасивний блок (руки вгору) застосовують проти дуже сильних ударів, щоб пом'якшити м'яч."]}, {"h": "Волейбол. Страхування блокуючого", "p": ["Навіть добрий блок не завжди зупиняє м'яч. Часто він відскакує на свій бік, і тоді його має підхопити гравець страхування. У системі «кутом вперед» цю роль виконує гравець зони 6."], "ul": ["Страхувальник стоїть за блоком на відстані 1–2 м.", "Низька стійка, готовність до прийому знизу.", "Слідкуйте за обманними скидками за блок.", "Після прийому — передача зв'язковому для контратаки.", "Голосом повідомляйте блокуючому, що він застрахований."]}, {"h": "Волейбол. Навчальна гра з блоком і страхуванням", "p": ["У грі блокування і страхування мають працювати разом. Після кожного розіграшу корисно оцінити: чи стояв блок правильно, чи був страхувальник на місці."], "ul": ["Гравці передньої лінії слідкують за нападниками суперника.", "Гравець зони 6 займає позицію страхування.", "Пі
