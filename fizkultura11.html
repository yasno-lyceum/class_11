 для удару головою?", "Які суглоби треба найкраще розім'яти перед стрибками?"]}, {"n": "22", "t": "Контрольне тестування: 5 ударів на точність з 16,5 м. Удари після ведення. ЗРВ у русі", "g": "Учень знатиме, як виконується тест на точність ударів з-за меж штрафного майданчика, як до нього готуватися та оцінювати результат.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Штрафний майданчик", "зона перед воротами, межі якої знаходяться на відстані 16,5 м від воріт; у ній воротар може грати руками."], ["Точність удару", "здатність направити м'яч у задану ціль."], ["Удар після ведення", "удар по воротах відразу після переміщення з м'ячем, без зупинки."], ["Задана половина воріт", "ціль, яку визначають у тесті: ліва або права частина воріт."]], "th": [{"h": "Футбол. Контрольне тестування: удари на точність", "p": ["Учень виконує 5 ударів одним зі способів (внутрішньою стороною стопи або підйомом) у задану половину воріт з відстані 16,5 м — з-за меж штрафного майданчика. Зараховуються удари, після яких м'яч потрапляє в потрібну половину.", "Для точності важливіше правильно поставити опорну ногу і зафіксувати стопу, ніж бити сильно."], "ul": ["Опорна нога вказує носком на ціль.", "Корпус над м'ячем.", "Стопа фіксована під час удару.", "Не поспішай: зроби вдих перед ударом.", "Самооцінка: скільки з 5 ударів влучили в ціль."]}, {"h": "Футбол. Удар після ведення", "p": ["Удар після ведення складніший, ніж по нерухомому м'ячу: треба вчасно скоротити крок і відкинути м'яч на зручну відстань. Останнє торкання перед ударом — коротке.", "Тренуй удари з ведення обома ногами з різних кутів."], "ul": ["Останнє торкання готує м'яч до удару.", "Не збивайся з кроку.", "Підніми голову і подивись на ворота.", "Бий у кут, подалі від воротаря.", "Після удару — продовжуй рух на добивання."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ у русі", "p": ["Перед серією ударів розім'яти потрібно м'язи стегна, паху, гомілки. Махи ногами, випади, легкий біг — обов'язкові.", "Дотримуйся черги під час ударів і не заходь у зону воріт, коли б'ють інші."], "ul": ["Біг з махами прямих ніг.", "Випади з поворотом тулуба.", "Підскоки.", "Легкі удари по м'ячу на 5–10 м.", "Безпечна черговість при ударах."]}], "f": "Розмітка футбольного поля має своє походження в британських мірах: 16,5 м — це 18 ярдів, а 11 м до точки пенальті — 12 ярдів.", "pr": ["Опиши, як підготуватися до тесту на точність ударів і як вести облік своїх результатів (таблиця спроб).", "Виконай вдома імітацію удару без м'яча перед дзеркалом: 10 разів кожною ногою, стежачи за положенням опорної ноги та рівновагою."], "q": ["На якій відстані від воріт розташована межа штрафного майданчика?", "Що найбільше впливає на точність удару?", "Чим удар після ведення складніший за удар по нерухомому м'ячу?", "Як оцінити свій результат у тесті?"]}, {"n": "23", "t": "Ведення м'яча з ривком і ударом по воротах. ЗРВ у русі. Укидання м'яча на дальність", "g": "Учень знатиме правила й техніку вкидання м'яча з-за бокової лінії та вмітиме поєднувати ведення, ривок і удар.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Вкидання м'яча", "спосіб повернення м'яча в гру руками з-за бокової лінії."], ["Бокова лінія", "довга лінія, що обмежує футбольне поле з боків."], ["Неправильне вкидання", "порушення правил вкидання, після якого право вкинути м'яч переходить до суперника."], ["Ривок з м'ячем", "раптове прискорення гравця з веденням для відриву від суперника."]], "th": [{"h": "Футбол. Вкидання м'яча на дальність", "p": ["Вкидання виконують двома руками з-за голови. Гравець стоїть обличчям до поля, обидві ноги частково на боковій лінії або за нею, обидві стопи торкаються землі в момент кидка. Ступні не можна відривати від землі.", "Для дальнього вкидання використовують розбіг і прогин тулуба, як у кидку набивного м'яча."], "ul": ["Кидок двома руками одночасно.", "М'яч проходить над головою.", "Обидві стопи на землі.", "Обличчям до поля.", "Безпосередньо з вкидання гол забити не можна."]}, {"h": "Футбол. Ведення з ривком і ударом", "p": ["Комбінація «ведення — ривок — удар» часто вирішує долю атаки. Гравець веде м'яч, зненацька прискорюється, відриваючись від захисника, і завершує атаку ударом.", "Вибір моменту для ривка — найважливіше: коли захисник «завис» або розвернувся."], "ul": ["Зміна темпу збиває захисника.", "М'яч під контролем навіть на швидкості.", "Удар з ходу без зупинки.", "Голова піднята перед ударом.", "Тренуй з обох флангів."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ у русі", "p": ["Вкидання навантажує м'язи плечей, спини та живота. Тому розминка має включати колові рухи руками, прогини і нахили.", "Не роби різких прогинів назад без розминки."], "ul": ["Колові рухи руками.", "Нахили та прогини.", "Повороти тулуба.", "Імітація вкидання без м'яча.", "Легкий біг з прискореннями."]}], "f": "Вкидання — один із небагатьох моментів у футболі, коли польовий гравець за правилами грає м'ячем руками.", "pr": ["Запиши правила вкидання м'яча з-за бокової лінії та 3 найчастіші помилки, через які вкидання вважається неправильним.", "Виконай вправи для плечового поясу та спини: колові рухи руками 2×15, «човник» 3×10, імітація вкидання без м'яча 10 разів."], "q": ["Як правильно виконувати вкидання м'яча?", "Що відбувається після неправильного вкидання?", "Чи можна забити гол безпосередньо з вкидання?", "Коли найкраще робити ривок з м'ячем?"]}, {"n": "24", "t": "ЗРВ у русі, вкидання м'яча на дальність. Гра із застосуванням вивчених прийомів", "g": "Учень вмітиме застосовувати вивчені технічні прийоми футболу в навчальній грі та знатиме основні правила гри.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Навчальна гра", "гра за спрощеними чи повними правилами, мета якої — закріпити вивчені прийоми."], ["Офсайд (положення поза грою)", "положення нападника, коли в момент передачі він ближче до воріт суперника, ніж м'яч і передостанній захисник."], ["Кутовий удар", "удар з кута поля, який призначають, коли м'яч востаннє торкнувся захисника і вийшов за лінію воріт."], ["Штрафний удар", "удар, який призначають команді за порушення правил суперником."]], "th": [{"h": "Футбол. Основні правила гри", "p": ["Мета гри — забити м'яч у ворота суперника. Грають ногами, головою, тулубом; руками — лише воротар у своєму штрафному майданчику. Повна команда — 11 гравців, на уроці грають меншими складами.", "За порушення (підніжка, поштовх, гра рукою) суддя призначає штрафний удар, а якщо порушення сталося у власному штрафному майданчику — пенальті."], "ul": ["М'яч за боковою лінією — вкидання.", "М'яч за лінією воріт від нападника — удар від воріт.", "М'яч за лінією воріт від захисника — кутовий удар.", "Участь у грі з положення поза грою — порушення, за яке призначають штрафний удар.", "Повага до рішень судді."]}, {"h": "Футбол. Гра із застосуванням вивчених прийомів", "p": ["У навчальній грі намагайся використати все вивчене: зупинки, ведення, передачі, удари, вкидання, групові дії. Після гри проаналізуй, що вдалося, а що потрібно доопрацювати.", "Тактика проста: відкривайся, віддавай точно, повертайся в захист."], "ul": ["Короткі передачі надійніші за довгі.", "Використовуй ширину поля.", "Після втрати м'яча — одразу в захист.", "Вкидання — швидко до вільного партнера.", "Чесна гра понад усе."]}, {"h": "Загальна фізична підготовка. ЗРВ у русі та відновлення", "p": ["Після гри важливо не зупинятися різко: легкий біг, ходьба, вправи на дихання і розтяжка допомагають відновитися.", "Розтягувати варто м'язи стегна, гомілки й спини — по 20–30 секунд."], "ul": ["Ходьба з глибоким диханням.", "Розтяжка передньої і задньої поверхні стегна.", "Розтяжка гомілки біля опори.", "Нахили для розслаблення спини.", "Вода після навантаження."]}], "f": "Футбольний матч складається з двох таймів по 45 хвилин, а суддя може додати компенсований час за зупинки в грі.", "pr": ["Склади пам'ятку «10 основних правил футболу» для однокласника, який ніколи не грав.", "Виконай комплекс розтяжки після навантаження: 5 вправ по 20–30 с для ніг і спини."], "q": ["Коли призначається кутовий удар?", "Що таке положення поза грою?", "Які вивчені прийоми ти використовуєш у грі найчастіше?", "Як правильно відновлюватися після гри?"]}, {"n": "25", "t": "Правила безпеки. Перешикування та повороти в русі. Виси та віджимання. Фінти у веденні м'яча", "g": "Учень знатиме правила безпеки під час стройових і силових вправ, техніку висів та віджимань і способи обігрування захисника фінтами.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Перешикування", "зміна строю, наприклад з однієї шеренги у дві чи з колони в шеренгу."], ["Поворот у русі", "зміна напрямку руху строю за командою під час ходьби."], ["Вис", "положення, у якому тіло утримується на руках під опорою, наприклад на перекладині."], ["Фінт", "обманний рух, який змушує суперника помилитися щодо подальших дій гравця."]], "th": [{"h": "Загальна фізична підготовка. Правила безпеки, перешикування та повороти в русі", "p": ["Стройові вправи вчать уважності, дисципліни і злагодженості. Команду подають з попереджувальною і виконавчою частиною: «Ліво-руч!» — поворот виконується на рахунок під ліву ногу. Під час перешикувань важливо зберігати дистанцію й інтервал.", "Під час силових вправ на снарядах діють додаткові правила безпеки: перевірка міцності перекладини, суха долоня, страхування, мати під снарядом."], "ul": ["Займайся на снарядах лише з дозволу вчителя.", "Долоні сухі, без прикрас.", "Під перекладиною — мат.", "Сходь зі снаряда обережно, не зістрибуй з високого положення.", "У строю — дистанція на витягнуту руку."]}, {"h": "Загальна фізична підготовка. Виси та віджимання", "p": ["Вис зміцнює кисті, плечі й розтягує хребет. Хват зверху, руки на ширині плечей, тіло пряме. Віджимання — головна вправа для м'язів грудей, рук і корпусу: тіло пряме, опускання до кута в ліктях 90° або нижче, видих під час підйому.", "Дівчата можуть виконувати віджимання від лави або з колін, поступово переходячи до повної вправи."], "ul": ["Вис на прямих руках 20–30 с.", "Вис на зігнутих руках — для сильніших учнів.", "Віджимання: тіло як «дошка».", "Не прогинай поперек.", "Темп рівний, без ривків."]}, {"h": "Футбол. Фінти у веденні м'яча з активним захисником", "p": ["Фінт — це обман: гравець показує, що піде в один бік, а йде в інший. Прості фінти: «корпусом» (нахил тулуба в один бік, вихід в інший), «удар» (замах для удару і відведення м'яча), «переступання» через м'яч.", "Фінт ефективний, коли виконується на швидкості та на правильній відстані від захисника — приблизно 1,5–2 м."], "ul": ["Фінт корпусом — найпростіший і найнадійніший.", "Фінт «удар» — замах без удару і зміщення м'яча.", "Після фінта — різке прискорення.", "Не роби фінти занадто далеко від захисника.", "Тренуй спочатку повільно, потім на швидкості."]}], "f": "Фінти вигадують і вдосконалюють самі футболісти, і деякі з них стали відомими під іменами гравців, які зробили їх популярними.", "pr": ["Опиши та намалюй (схемою зі стрілками) два фінти: «корпусом» і «удар».", "Виконай віджимання (від підлоги, лави або з колін) 3 підходи з максимально можливою кількістю правильних повторень і запиши результат."], "q": ["Які правила безпеки діють під час вправ на перекладині?", "Як правильно виконувати віджимання?", "Що таке фінт і коли його краще виконувати?", "Як подаються стройові команди?"]}, {"n": "26", "t": "Комплекс ЗРВ. Вправи на силу та гнучкість. Човниковий біг. Фінти з активним захисником", "g": "Учень знатиме техніку човникового бігу, вправи для розвитку сили і гнучкості та закріпить знання про фінти.", "k": "Модулі: Загальна фізична підготовка · Футбол", "terms": [["Човниковий біг", "біг між двома лініями з поворотами, що розвиває швидкість і спритність."], ["Спритність", "здатність швидко опановувати нові рухи і змінювати їх відповідно до ситуації."], ["Динамічна розтяжка", "вправи на гнучкість, які виконуються в русі з поступовим збільшенням амплітуди."], ["Статична розтяжка", "утримання положення розтягнення м'яза протягом 20–30 секунд."]], "th": [{"h": "Загальна фізична підготовка. Човниковий біг", "p": ["Човниковий біг (наприклад, 4×9 м або 3×10 м) вимагає швидкого старту, гальмування і повороту. Перед лінією гравець скорочує кроки, опускає центр ваги, торкається лінії рукою чи ногою і різко відштовхується в протилежний бік.", "Найбільше часу втрачається саме на поворотах, тому техніку гальмування варто тренувати окремо."], "ul": ["Старт з високого положення.", "Гальмування — дрібними кроками на зігнутих ногах.", "Поворот через «близьке» плече.", "Дотик до лінії обов'язковий.", "Неслизьке взуття — запорука безпеки."]}, {"h": "Загальна фізична підготовка. Сила і гнучкість", "p": ["Сила і гнучкість не заважають одна одній, а доповнюють: сильний і гнучкий м'яз менше травмується. Після силових вправ обов'язково розтягуй ті самі м'язи.", "Динамічну розтяжку виконують у розминці, статичну — після основної частини."], "ul": ["Присідання і віджимання для сили.", "Махи ногами — динамічна розтяжка.", "Нахили до прямих ніг — статична розтяжка.", "Розтяжка без болю, лише відчуття натягу.", "Дихай рівно, не затримуй дихання."]}, {"h": "Футбол. Фінти з активним захисником", "p": ["З активним захисником фінт має бути переконливим: рух корпусом виразний, погляд теж «обманює». Після фінта гравець має одразу піти в протилежному напрямку на швидкості.", "Спритність, яку тренує човниковий біг, допомагає швидко змінити напрям після фінта."], "ul": ["Переконливий рух корпусом.", "Вибір моменту, коли захисник переносить вагу.", "Різкий старт після фінта.", "Захищай м'яч корпусом.", "Не бійся помилитися — фінти тренуються повтореннями."]}], "f": "Човниковий біг отримав назву від ткацького човника, який безперервно рухається туди-сюди між нитками.", "pr": ["Опиши в зошиті техніку човникового бігу і поясни, чому на поворотах втрачається найбільше часу.", "Виконай комплекс сили й гнучкості: присідання 3×12, віджимання 3×8–10, потім 4 статичні розтяжки по 20–30 с."], "q": ["Як правильно виконувати поворот у човниковому бігу?", "Чим динамічна розтяжка відрізняється від статичної?", "Чому важливо поєднувати силу й гнучкість?", "Як спритність допомагає у виконанні фінтів?"]}, {"n": "27", "t": "Футбол: взаємодії гравців у полі. Ведення з ривком і ударом по воротах. Навчальна гра", "g": "Учень знатиме ролі гравців на полі, базові схеми розстановки та принципи взаємодії в атаці й захисті.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Тактична схема", "розстановка гравців на полі, наприклад 4-4-2 або 4-3-3."], ["Захисник", "гравець, основне завдання якого — не дати суперникові забити гол."], ["Півзахисник", "гравець центральної лінії, який пов'язує захист і напад."], ["Нападник", "гравець, головне завдання якого — забивати голи."]], "th": [{"h": "Футбол. Ролі гравців і схеми розстановки", "p": ["Команда складається з воротаря, захисників, півзахисників і нападників. Схему розстановки записують цифрами від захисту до нападу: 4-4-2 означає 4 захисники, 4 півзахисники і 2 нападники. Воротар у схемі не враховується.", "Сучасні гравці універсальні: захисники підключаються до атаки, а нападники допомагають у захисті."], "ul": ["Воротар — захищає ворота, організовує захист.", "Захисники — опіка, відбір, перехоплення.", "Півзахисники — контроль центру, передачі.", "Нападники — удари, вихід на позицію.", "Схема — 4-4-2, 4-3-3, 3-5-2 тощо."]}, {"h": "Футбол. Взаємодії гравців у полі", "p": ["Взаємодії — це домовленості між гравцями: хто відкривається, хто підстраховує, хто йде в атаку. Наприклад, фланговий захисник іде вперед, а центральний півзахисник займає його місце.", "У навчальній грі пробуй грати за обраною схемою і тримати свою позицію."], "ul": ["Трикутники для передач.", "Перекриття флангу.", "Зміна позицій.", "Компактність у захисті.", "Швидкий перехід з оборони в атаку."]}, {"h": "Загальна фізична підготовка. Ривок і удар у грі", "p": ["Ривок з веденням і ударом — фінальна частина атаки. Його виконують на швидкості, тому потрібна хороша розминка і достатній запас сил.", "Комплекс ЗРВ перед грою готує м'язи до ривків і ударів."], "ul": ["Розминка ніг і тазостегнових суглобів.", "Прискорення 3–4 рази по 15 м.", "Удари з ходу після ведення.", "Відновлення дихання між повторами.", "Розтяжка після гри."]}], "f": "Перші футбольні команди грали дуже атакувальними схемами з великою кількістю нападників, а з роками кількість захисників поступово збільшувалася.", "pr": ["Намалюй розстановку команди за схемою 4-4-2 і 4-3-3 та поясни, чим вони відрізняються.", "Опиши роль, яку ти обрав(-ла) б для себе у футбольній команді, і які фізичні якості для неї найважливіші."], "q": ["Що означає запис схеми 4-3-3?", "Які завдання в півзахисників?", "Чи враховується воротар у записі схеми?", "Що таке перекриття флангу?"]}, {"n": "28", "t": "Футбол: взаємодії гравців. Ведення з ривком і ударом. Гра. Підсумок чверті", "g": "Учень закріпить знання про взаємодії гравців, зможе оцінити свій прогрес за чверть і повторить головне з модулів футболу та ЗФП.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Пресинг", "активний тиск на суперника з м'ячем для швидкого повернення м'яча."], ["Контратака", "швидкий перехід у напад після відбору м'яча, поки суперник не встиг повернутися."], ["Позиційна атака", "повільна, продумана атака з великою кількістю передач."], ["Аналіз гри", "розбір дій команди й окремих гравців після матчу для покращення результатів."]], "th": [{"h": "Футбол. Взаємодії в атаці та захисті", "p": ["Команди атакують двома способами: контратакою (швидко, мало передач) і позиційною атакою (терпляче, з контролем м'яча). У захисті застосовують пресинг біля чужих воріт або щільний захист біля своїх.", "Вибір залежить від рахунку, сил суперника і стану гравців."], "ul": ["Контратака — швидкість і точні передачі.", "Позиційна атака — контроль і терпіння.", "Пресинг — дії всією командою.", "Перехід від захисту до нападу без пауз.", "Аналізуй гру після матчу."]}, {"h": "Футбол. Підсумок чверті: що ми вивчили", "p": ["Протягом чверті ми опанували зупинки м'яча різними способами, удари ногою і головою, ведення, фінти, вкидання, групові дії в атаці й захисті, основні правила гри.", "Порівняй свої вміння на початку і в кінці чверті: що вдається краще, над чим ще працювати."], "ul": ["Техніка: зупинки, удари, ведення, фінти, вкидання.", "Тактика: стінка, підстраховка, схеми розстановки.", "Правила: штрафний, кутовий, офсайд, небезпечна гра.", "Контрольні тести: зупинка м'яча, удари на точність.", "Фейр-плей і повага до суперника."]}, {"h": "Загальна фізична підготовка. Підсумок чверті з ЗФП", "p": ["З ЗФП ми вивчили біг на витривалість і спринт, стрибок у довжину з місця, метання, підтягування, віджимання, вправи на поставу і гнучкість, самоконтроль пульсу, планування тренувань і харчування.", "Добре, якщо ти продовжуватимеш заняття самостійно — фізичні якості швидко втрачаються без регулярного навантаження."], "ul": ["Витривалість: 1000–1500 м, тест Купера.", "Швидкість: 60 і 100 м, човниковий біг.", "Сила: підтягування, віджимання, присідання.", "Гнучкість: тест нахилу вперед.", "Самоконтроль: пульс, щоденник тренувань."]}], "f": "Фізичні якості, набуті тренуваннями, без регулярних занять поступово знижуються, тому навіть у канікули корисно рухатися хоча б кілька разів на тиждень.", "pr": ["Заповни таблицю «Мій прогрес за чверть»: які тести і вправи виконував(-ла), результат, що хочу покращити.", "Склади план активностей на канікули: 3 заняття на тиждень (розминка, силовий комплекс, розтяжка, прогулянка)."], "q": ["Чим контратака відрізняється від позиційної атаки?", "Що таке пресинг?", "Які технічні прийоми футболу ти вивчив(-ла) цієї чверті?", "Які фізичні якості ти розвивав(-ла) і як їх перевіряли?"]}]}, {"name": "ІІ чверть. Баскетбол", "lessons": [{"n": "29", "t": "Баскетбол: техніка безпеки. Комплекс ЗРВ. Прискорення на 5 м за сигналом. Гра", "g": "Учень знатиме правила безпеки на заняттях баскетболом, значення швидкості реакції та техніку стартів з різних положень.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Швидкість реакції", "час від появи сигналу до початку руху."], ["Зоровий сигнал", "сигнал, який спортсмен бачить, наприклад жест, прапорець чи рух м'яча."], ["Звуковий сигнал", "сигнал, який спортсмен чує, наприклад свисток чи оплеск."], ["Баскетбольна стійка", "положення гравця з напівзігнутими ногами і руками, готовими до дій з м'ячем."]], "th": [{"h": "Баскетбол. Техніка безпеки", "p": ["Баскетбол — швидка гра з частими стрибками, зупинками і контактом, тому травми найчастіше трапляються на гомілковостопних суглобах і пальцях рук. Правильне взуття з фіксацією щиколотки, розминка кистей і уважність значно знижують ризик.", "Під час кидків у кошик стеж, щоб ніхто не стояв під щитом, і не виси на кільці."], "ul": ["Взуття, що фіксує щиколотку, неслизька підошва.", "Розминка пальців і кистей перед ловінням.", "Не виси на кільці й сітці.", "Не кидай м'яч у партнера, який не дивиться.", "Нігті коротко підстрижені, без прикрас."]}, {"h": "Загальна фізична підготовка. Прискорення на 5 м за сигналом", "p": ["У баскетболі майданчик невеликий, тому вирішальними є перші кроки. Старти з різних положень (сидячи, лежачи, стоячи боком чи спиною) за звуковим або зоровим сигналом розвивають швидкість реакції.", "Змагання з суперником додає азарту, але між парами має бути безпечна відстань."], "ul": ["Будь готовий: вага на передній частині стоп.", "Перший крок — короткий і швидкий.", "Реагуй на сигнал, а не на суперника.", "Гальмування після фінішу — плавне.", "Різні стартові положення тренують координацію."]}, {"h": "Баскетбол. Основи гри", "p": ["Мета баскетболу — закинути м'яч у кошик суперника. М'яч ведуть рукою, ударяючи об підлогу; бігати з м'ячем у руках не можна (пробіжка). Гра п'ять на п'ять, кидки оцінюються в 1, 2 або 3 очки.", "Баскетбольна стійка — основа: ноги на ширині плечей, зігнуті в колінах, спина рівна, руки готові."], "ul": ["Штрафний кидок — 1 очко.", "Кидок із зони до трьохочкової лінії — 2 очки.", "Кидок з-за трьохочкової лінії — 3 очки.", "Пробіжка — порушення правил.", "Персональний фол — за контакт із суперником."]}], "f": "Баскетбол винайшов викладач фізичного виховання Джеймс Нейсміт у 1891 році, а першими кошиками були справжні кошики для персиків.", "pr": ["Запиши правила безпеки на заняттях баскетболом і поясни, які травми вони допомагають попередити.", "Виконай вправу на швидкість реакції вдома: член родини плескає в долоні, а ти з положення сидячи швидко встаєш у баскетбольну стійку (10 повторів); також розімни кисті й пальці."], "q": ["Які травми найчастіше трапляються в баскетболі і як їх уникнути?", "Що таке швидкість реакції і як її розвивати?", "Скільки очок дає кидок з різних зон?", "Як виглядає баскетбольна стійка?"]}, {"n": "30", "t": "Баскетбол: різновиди бігу та ходьби. Біг зі зміною напрямку. Прискорення на 10 м за сигналом", "g": "Учень знатиме спеціальні види пересування баскетболіста і як зміна темпу та напрямку допомагає в грі.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Пересування в захисній стійці", "переміщення приставними кроками з низьким центром ваги."], ["Зміна напрямку", "різкий поворот під час бігу, що допомагає звільнитися від опіки."], ["Зупинка стрибком", "зупинка в баскетболі, коли гравець приземляється одночасно на обидві ноги."], ["Зупинка двома кроками", "зупинка, при якій гравець гальмує на два послідовні кроки."]], "th": [{"h": "Баскетбол. Різновиди бігу та ходьби", "p": ["Баскетболіст постійно змінює спосіб пересування: біг лицем уперед, спиною вперед, приставні кроки в захисній стійці, стрибки. Кожен вид має своє завдання: приставні кроки — для захисту, біг спиною — для повернення назад з оглядом майданчика.", "У розминці використовують ходьбу на носках, п'ятах, у напівприсіді та випадами."], "ul": ["Ходьба на носках і п'ятах.", "Ходьба в напівприсіді.", "Біг спиною вперед.", "Приставні кроки в захисній стійці.", "Біг з високим підніманням стегна."]}, {"h": "Загальна фізична підготовка. Біг зі зміною напрямку та прискорення на 10 м", "p": ["Біг зі зміною напрямку за сигналом розвиває спритність і увагу. Перед поворотом знижуй центр ваги й відштовхуйся зовнішньою ногою.", "Прискорення на 10 м з різних положень — це вже не лише реакція, а й стартова швидкість."], "ul": ["Реагуй на сигнал якомога швидше.", "Поворот на зігнутих ногах.", "Руки допомагають балансу.", "Короткі перші кроки.", "Відпочинок між повторами."]}, {"h": "Баскетбол. Зупинки", "p": ["Правильна зупинка — основа для кидка, передачі чи повороту. Є зупинка стрибком (приземлення на обидві ноги одночасно) і зупинка двома кроками (спочатку одна нога, потім інша).", "Нога, яка першою торкнулася підлоги при зупинці двома кроками, стає опорною — її не можна відривати до передачі чи кидка."], "ul": ["Зупинка стрибком дає вибір опорної ноги.", "Коліна зігнуті при приземленні.", "Тулуб не нахиляється занадто вперед.", "Опорну ногу не можна переставляти.", "Після зупинки — готовність до передачі."]}], "f": "Баскетболісти за матч дуже часто змінюють напрямок і швидкість руху, тому спритність для них не менш важлива, ніж зріст.", "pr": ["Опиши в зошиті різницю між зупинкою стрибком і зупинкою двома кроками та поясни, що таке опорна нога.", "Виконай вправи на рівновагу та стійкість: утримання захисної стійки 3×30 с, приставні кроки на місці 3×20, стояння на одній нозі 2×30 с."], "q": ["Які види пересування використовує баскетболіст?", "Як правильно змінювати напрямок бігу?", "Що таке зупинка стрибком?", "Чому не можна відривати опорну ногу?"]}, {"n": "31", "t": "Баскетбол: ведення м'яча і передачі на точність. Підтягування, виси, віджимання. Скакалка", "g": "Учень знатиме техніку ведення м'яча і точних передач у баскетболі, а також правила виконання вправ на силу і зі скакалкою.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Ведення м'яча (дриблінг)", "переміщення гравця з м'ячем, який він ударяє об підлогу однією рукою."], ["Подвійне ведення", "порушення, коли гравець веде м'яч двома руками одночасно або відновлює ведення після зупинки."], ["Передача від грудей", "основна передача двома руками з рівня грудей прямо в руки партнеру."], ["Стрибки через скакалку", "вправа на координацію, витривалість і силу ніг."]], "th": [{"h": "Баскетбол. Ведення м'яча", "p": ["М'яч ведуть пальцями, а не долонею: кисть «супроводжує» м'яч униз і зустрічає його при відскоку. Висота ведення — до рівня пояса, при щільній опіці — нижче. Дивитися треба на майданчик, а не на м'яч.", "Подвійне ведення і пробіжка — найчастіші помилки новачків."], "ul": ["Працюють пальці, а не долоня.", "М'яч збоку від тіла, далі від захисника.", "Голова піднята.", "Чергуй праву і ліву руку.", "Після зупинки ведення не можна відновлювати."]}, {"h": "Баскетбол. Передачі на точність у руки партнеру", "p": ["Передача від грудей: м'яч тримають пальцями, лікті опущені, рух рук уперед з розгинанням і «хльостом» кистей, великі пальці після передачі дивляться вниз. Ціль — груди партнера.", "Партнер готує руки «чашечкою» і йде назустріч м'ячу."], "ul": ["Крок назустріч під час передачі.", "Розворот кистей назовні.", "Передача точно в руки.", "Голосом або жестом дай знати, що відкритий.", "Не передавай партнеру, який не дивиться."]}, {"h": "Загальна фізична підготовка. Підтягування, виси, віджимання та скакалка", "p": ["Сильні руки і плечі потрібні баскетболісту для боротьби під щитом і сильних передач. Підтягування, виси й віджимання виконують з правильною технікою, без ривків.", "Стрибки через скакалку: скакалка обертається кистями, а не всією рукою; стрибки невисокі, на передній частині стопи, тіло пряме."], "ul": ["Підтягування — без розгойдування.", "Віджимання — тіло пряме.", "Скакалка — правильна довжина: ручки до пахв, якщо стати на середину.", "Стрибки на м'якій поверхні.", "Відпочинок між підходами."]}], "f": "Скакалку часто використовують боксери і баскетболісти, бо вона одночасно тренує координацію, роботу ніг і витривалість.", "pr": ["Опиши в зошиті техніку ведення м'яча та передачі від грудей, а також 3 типові помилки.", "Виконай силовий комплекс: віджимання 3×10, планка 3×30–40 с, «човник» 3×10 (стрибки на скакалці — лише на вулиці або на спеціальному покритті з дозволу дорослих)."], "q": ["Якою частиною руки ведуть м'яч?", "Що таке подвійне ведення?", "Як правильно виконати передачу від грудей?", "Як підібрати правильну довжину скакалки?"]}, {"n": "32", "t": "Баскетбол: серійні кидки з середньої та далекої дистанції. Сила рук. Скакалка", "g": "Учень знатиме техніку кидка однією рукою від плеча з середньої та далекої дистанції і принципи серійного тренування кидків.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Кидок однією рукою від плеча", "основний кидок у баскетболі, при якому м'яч посилається в кошик однією рукою з рівня голови."], ["Середня дистанція", "відстань кидка приблизно між зоною під кошиком і трьохочковою лінією."], ["Трьохочкова лінія", "дуга на майданчику, кидок з-за якої оцінюється в 3 очки."], ["Серійні кидки", "послідовне виконання багатьох кидків з однієї або різних точок для закріплення навички."]], "th": [{"h": "Баскетбол. Техніка кидка з середньої та далекої дистанції", "p": ["Кидок однією рукою від плеча: стопи на ширині плечей, кидкова нога трохи попереду, м'яч на пальцях кидкової руки, друга рука підтримує збоку. Лікоть під м'ячем, спрямований у кошик. Кидок починається з ніг: розгинання ніг, тулуба, руки і завершальний «хльост» кистю.", "Для далекої дистанції більше працюють ноги, а не руки. М'яч має летіти по дузі."], "ul": ["Лікоть під м'ячем, у напрямку кошика.", "Друга рука лише підтримує.", "Розгинання знизу вгору: ноги — тулуб — рука — кисть.", "Кисть після кидка «опущена» вниз.", "Погляд на передню дужку кільця."]}, {"h": "Баскетбол. Серійні кидки", "p": ["Серійні кидки — головний спосіб відпрацювання техніки. Виконують 5–10 кидків з однієї точки, потім переходять на іншу. Важливо рахувати влучання — так видно прогрес.", "Починати треба з близької відстані, і лише після стабільних влучань відходити далі."], "ul": ["Однакова техніка у кожному кидку.", "Облік влучань у кожній серії.", "Перехід на далеку дистанцію — поступово.", "Партнер подає м'ячі.", "Стеж, щоб під кошиком нікого не було під час кидків."]}, {"h": "Загальна фізична підготовка. Сила рук і стрибкова витривалість", "p": ["Сила ніг і плечового поясу робить кидок з далекої дистанції стабільнішим. Скакалка тренує легкість стрибка і витривалість ніг.", "Вправи виконують після кидкової частини, щоб утома не заважала техніці."], "ul": ["Підтягування або вис 3 підходи.", "Віджимання 3×10.", "Скакалка 3×30–60 с.", "Присідання 3×15.", "Розтяжка плечей і ніг."]}], "f": "Трьохочковий кидок з'явився в баскетболі не одразу, а значно пізніше від створення гри, і з того часу кардинально змінив тактику команд.", "pr": ["Намалюй баскетбольний майданчик і познач зони кидків на 1, 2 і 3 очки.", "Виконай імітацію кидка однією рукою від плеча без м'яча перед дзеркалом (20 разів), стежачи за положенням ліктя та роботою ніг."], "q": ["З чого починається кидок однією рукою від плеча?", "Чому під час кидка з далекої дистанції більше працюють ноги?", "Як правильно організувати серійні кидки?", "Куди дивиться гравець під час кидка?"]}, {"n": "33", "t": "Баскетбол: комплекс ЗРВ. Навчальна гра з вивченням дій гравців при зонному захисті", "g": "Учень знатиме, що таке зонний захист, чим він відрізняється від особистого та які обов'язки має кожен гравець у зоні.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Зонний захист", "система захисту, коли кожен гравець відповідає за свою ділянку майданчика, а не за конкретного суперника."], ["Особистий захист", "система захисту, коли кожен гравець опікає конкретного суперника."], ["Тришекундна зона", "обмежена зона під кошиком, у якій нападник не може перебувати довше 3 секунд."], ["Зміщення", "рух захисників усередині зони слідом за м'ячем."]], "th": [{"h": "Баскетбол. Зонний захист", "p": ["У зонному захисті гравці розподіляють між собою ділянки майданчика. Коли м'яч переміщується, вся зона зміщується в його бік: найближчий захисник атакує гравця з м'ячем, інші закривають простір під кошиком і напрямки передач.", "Зонний захист добре протидіє проходам під кошик, але вразливий до точних дальніх кидків."], "ul": ["Кожен відповідає за свою зону.", "Уся п'ятірка зміщується слідом за м'ячем.", "Руки підняті — заважають передачам.", "Закривай простір під кошиком.", "Спілкуйся з партнерами."]}, {"h": "Баскетбол. Навчальна гра", "p": ["У навчальній грі одна команда грає зонний захист, інша вчиться його атакувати: швидкими передачами, кидками з середньої дистанції, проходами в «щілини» між захисниками.", "Після кожної атаки варто обговорити, що вдалося, а що ні."], "ul": ["Атака проти зони — швидкі передачі.", "Кидки з середньої дистанції.", "Не стій у тришекундній зоні довше 3 с.", "Підбирання м'яча після кидка.", "Повага до суперника і судді."]}, {"h": "Загальна фізична підготовка. Комплекс ЗРВ", "p": ["Перед грою виконуємо ЗРВ для всіх груп м'язів, особливу увагу приділяючи гомілковостопним суглобам, колінам і кистям.", "Завершуємо розминку прискореннями і пересуваннями в захисній стійці."], "ul": ["Обертання кистями і пальцями.", "Обертання в колінних і гомілковостопних суглобах.", "Нахили і повороти тулуба.", "Приставні кроки в захисній стійці.", "Прискорення на 10 м."]}], "f": "У баскетболі за правилами ФІБА нападник не може перебувати в обмеженій зоні суперника довше 3 секунд, поки його команда володіє м'ячем.", "pr": ["Намалюй схему зонного захисту 2-3 і покажи стрілками, як зміщуються гравці, коли м'яч на фланзі.", "Порівняй у таблиці зонний і особистий захист: переваги, недоліки, коли застосовувати."], "q": ["Чим зонний захист відрізняється від особистого?", "Як зміщується зона, коли м'яч рухається?", "Як найкраще атакувати зонний захист?", "Що таке правило трьох секунд?"]}, {"n": "34", "t": "Баскетбол: зупинки та повороти, підбирання м'яча. Двостороння гра із зонним захистом 3:2", "g": "Учень знатиме техніку поворотів на місці, підбирання м'яча після кидка та розстановку зонного захисту 3-2.", "k": "Модулі: Баскетбол", "terms": [["Поворот на місці", "обертання гравця з м'ячем навколо опорної ноги."], ["Підбирання м'яча", "боротьба за м'яч, що відскочив від кільця чи щита після невдалого кидка."], ["Блокування (відсічення)", "положення гравця спиною до суперника, що не дає йому підійти до кошика за підбиранням."], ["Зона 3-2", "розстановка зонного захисту: три гравці попереду і два ближче до кошика."]], "th": [{"h": "Баскетбол. Зупинки та повороти", "p": ["Повороти на місці дозволяють гравцеві з м'ячем захистити його від суперника і знайти партнера. Поворот виконують, переступаючи вільною ногою, а опорна залишається на місці, обертаючись на передній частині стопи.", "Повороти бувають уперед (обличчям у бік руху) і назад (спиною). М'яч тримають біля грудей, лікті розведені."], "ul": ["Опорна нога не відривається.", "Обертання на передній частині стопи.", "М'яч захищений ліктями і тулубом.", "Коліна зігнуті.", "Після повороту — передача чи кидок."]}, {"h": "Баскетбол. Підбирання м'яча", "p": ["Після кидка гравець має одразу знайти суперника, стати перед ним спиною (відсічення) і лише потім іти до м'яча. Стрибок за м'ячем виконують двома руками у найвищій точці, а після приземлення м'яч захищають біля грудей.", "Підбирання в захисті позбавляє суперника повторної атаки, а в нападі — дає ще одну спробу."], "ul": ["Спочатку відсічення, потім м'яч.", "Широка стійка, руки вгору.", "Ловля двома руками.", "Приземлення на зігнуті ноги.", "Лікті розведені, але без ударів суперника."]}, {"h": "Баскетбол. Двостороння гра із зонним захистом 3-2", "p": ["У зоні 3-2 три гравці стоять ближче до центру, захищаючи від дальніх кидків, а двоє — біля кошика. Ця зона ефективна проти команди, що добре кидає з дистанції, але залишає вразливою середину під кошиком.", "Під час гри захисники зміщуються разом із м'ячем і допомагають одне одному."], "ul": ["Троє попереду — тиск на кидаючих.", "Двоє позаду — захист кошика.", "Зміщення в бік м'яча.", "Обов'язкове підбирання після кидка суперника.", "Голосові підказки."]}], "f": "Підбирання м'ячів є окремим статистичним показником у баскетболі, і найкращі «підбирачі» часто вирішують долю матчу.", "pr": ["Намалюй схему зонного захисту 3-2 і поясни, які ділянки майданчика він захищає найкраще, а які — гірше.", "Виконай імітацію поворотів на місці (вперед і назад) без м'яча по 10 разів на кожну ногу та вправу «стійка — стрибок угору руками — м'яке приземлення» на килимку 2×5."], "q": ["Як виконується поворот на місці?", "Що таке відсічення під час підбирання?", "Як розташовані гравці в зоні 3-2?", "Які переваги та недоліки має зона 3-2?"]}, {"n": "35", "t": "Баскетбол: ведення та передачі на точність. Контрольне тестування: підтягування. Гра", "g": "Учень знатиме, як правильно виконувати тест на підтягування та як готуватися до нього, а також удосконалить знання про ведення і передачі.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Контрольне тестування", "перевірка рівня фізичної підготовленості за визначеними вправами."], ["Вис на прямих руках", "вихідне положення для підтягування, коли руки повністю випрямлені."], ["Передача відскоком", "передача з ударом м'яча об підлогу, що ускладнює перехоплення."], ["Темп гри", "швидкість, з якою команда веде атаку і переходить з захисту в напад."]], "th": [{"h": "Загальна фізична підготовка. Контрольне тестування: підтягування", "p": ["Юнаки підтягуються на високій перекладині з вису хватом зверху; дівчата — на низькій перекладині з вису лежачи. Повтор зараховується, коли підборіддя піднялося вище перекладини, а потім руки повністю випрямилися.", "Розгойдування, ривки ногами, неповне опускання — повтор не зараховується. Перед тестом обов'язкова розминка плечей і кистей."], "ul": ["Розминка плечового поясу 5–7 хвилин.", "Тіло пряме, ноги разом.", "Підборіддя вище перекладини.", "Повне випрямлення рук унизу.", "Порівнюй результат зі своїм попереднім."]}, {"h": "Баскетбол. Ведення та передачі на точність", "p": ["У грі передача має бути швидкою і точною: від грудей — коли шлях вільний, відскоком — коли між тобою і партнером захисник. Передачу відскоком спрямовують так, щоб м'яч ударився об підлогу приблизно на 2/3 відстані до партнера.", "Ведення використовують тоді, коли передати нікому, — передача завжди швидша за ведення."], "ul": ["Передача швидша за ведення.", "Відскок — на 2/3 відстані.", "Передача на рівень грудей партнера.", "Ведення далі від захисника.", "Голова піднята."]}, {"h": "Баскетбол. Гра", "p": ["У навчальній грі закріплюємо передачі в русі та ведення. Корисно ввести обмеження: наприклад, перед кидком обов'язково 3 передачі.", "Після гри — відновлення і розтяжка."], "ul": ["Відкривайся для отримання м'яча.", "Не затримуй м'яч.", "Повертайся в захист.", "Дотримуйся правил.", "Підтримуй партнерів."]}], "f": "Підтягування — одна з небагатьох вправ, де людина піднімає всю вагу свого тіла лише силою рук і спини.", "pr": ["Опиши правила виконання тесту на підтягування для юнаків і дівчат та поясни, які помилки призводять до незарахування повтору.", "Виконай підвідні вправи для підтягування: «човник» 3×12, віджимання 3×10, ізометричне утримання (тягни долонями край міцного столу на себе 3×15 с)."], "q": ["Коли повтор у підтягуванні зараховується?", "Чим відрізняється тест на підтягування для юнаків і дівчат?", "Коли використовують передачу відскоком?", "Чому передача швидша за ведення?"]}, {"n": "36", "t": "Баскетбол: серійні кидки з опором захисника і фінтами. Прес за 1 хв. Набивний м'яч", "g": "Учень знатиме, як виконувати кидки з фінтом при активному опорі захисника, та техніку підйому тулуба для тесту.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Активний опір", "дії захисника, який намагається заблокувати кидок або завадити йому."], ["Фінт кидком", "обманний рух, що імітує кидок і змушує захисника вистрибнути."], ["Підйом тулуба", "вправа на м'язи живота з положення лежачи на спині."], ["Стрибки з виносом стегна", "стрибки на одній нозі з високим підніманням коліна іншої, що розвивають силу ніг."]], "th": [{"h": "Баскетбол. Кидки з фінтами при опорі захисника", "p": ["Коли захисник активно заважає, допомагає фінт кидком: гравець піднімає м'яч, ніби кидатиме. Якщо захисник вистрибнув, нападник проходить повз або чекає, поки той приземлиться, і кидає.", "Фінт має бути переконливим, але опорна нога не повинна відриватися — інакше пробіжка."], "ul": ["Фінт — підйом м'яча до рівня очей.", "Слідкуй за реакцією захисника.", "Опорна нога — на місці.", "Після фінта — кидок або прохід.", "Кидок з однаковою технікою навіть під тиском."]}, {"h": "Загальна фізична підготовка. Прес за 1 хвилину", "p": ["Підйом тулуба: лежачи на спині, ноги зігнуті під кутом близько 90°, стопи закріплені, руки за головою або схрещені на грудях. Піднімайся до торкання ліктями колін і опускайся до торкання лопатками підлоги.", "Не тягни голову руками і не відштовхуйся від підлоги — працюють лише м'язи живота."], "ul": ["Видих — на підйомі.", "Лопатки торкаються підлоги внизу.", "Шия розслаблена.", "Рівний темп протягом хвилини.", "Тренуй прес 2–3 рази на тиждень."]}, {"h": "Загальна фізична підготовка. Стрибки та вправи з набивним м'ячем", "p": ["Стрибки на одній нозі з виносом стегна розвивають силу та координацію, потрібні для кидка в стрибку. Вправи з набивним м'ячем (кидки від грудей, з-за голови, повороти з м'ячем) зміцнюють руки і корпус.", "Набивний м'яч кидають лише партнеру, який дивиться, або в стіну."], "ul": ["Стрибки на м'якому покритті.", "Високе піднімання коліна.", "Кидки набивного м'яча від грудей.", "Повороти тулуба з м'ячем.", "Відпочинок між серіями."]}], "f": "Сильні м'язи живота і спини допомагають баскетболісту зберігати рівновагу під час кидка в контакті із захисником.", "pr": ["Опиши в зошиті техніку фінта кидком і поясни, як не порушити правило пробіжки.", "Виконай підйом тулуба за 1 хв (з правильною технікою), запиши результат і зроби 2 підходи планки по 30–40 с."], "q": ["Як виконується фінт кидком?", "Як правильно виконувати підйом тулуба?", "Для чого баскетболісту вправи з набивним м'ячем?", "Які помилки у вправі на прес найчастіші?"]}, {"n": "37", "t": "Баскетбол: комплекс ЗРВ з м'ячем. Серійні кидки. Контрольне тестування: прес за 1 хв. Гра", "g": "Учень знатиме правила виконання тесту «підйом тулуба за 1 хв», як готуватися до нього та оцінювати свій результат.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["М'язи кору", "м'язи живота, спини і таза, які стабілізують тулуб."], ["Силова витривалість", "здатність довго виконувати силові вправи без зниження якості."], ["Влучність", "відсоток успішних кидків з усіх виконаних."], ["ЗРВ з м'ячем", "загальнорозвивальні вправи з використанням баскетбольного м'яча."]], "th": [{"h": "Загальна фізична підготовка. Контрольне тестування: прес за 1 хвилину", "p": ["Тест виконують у парі: один учень виконує вправу, партнер притримує стопи й рахує повтори. Зараховуються лише правильні повтори — з торканням лопатками підлоги внизу і ліктями колін угорі.", "Щоб показати найкращий результат, розподіли сили: не починай занадто швидко, тримай рівний темп і короткі паузи лише в нижній точці, якщо втомився."], "ul": ["Розминка тулуба перед тестом.", "Рівний темп усю хвилину.", "Дихання: видих на підйомі.", "Партнер рахує лише правильні повтори.", "Порівняй з попереднім результатом."]}, {"h": "Баскетбол. Комплекс ЗРВ з м'ячем і серійні кидки", "p": ["ЗРВ з м'ячем — ефективна розминка для баскетболіста: обертання м'яча навколо тулуба, «вісімка» між ногами, підкидання і ловіння, ведення на місці.", "Після розминки — серійні кидки з різних точок з підрахунком влучань."], "ul": ["Обертання м'яча навколо голови, тулуба, колін.", "«Вісімка» між ногами.", "Ведення по черзі правою і лівою.", "Кидки з 5 точок по 5 разів.", "Облік влучань у таблиці."]}, {"h": "Баскетбол. Гра", "p": ["У грі закріплюємо кидки з різних точок, передачі і захист. Пам'ятай: добра атака починається з доброго захисту.", "Після гри — розтяжка м'язів живота і спини."], "ul": ["Кидай з тих точок, де влучаєш найкраще.", "Підбирай м'яч після кидків.", "Особистий або зонний захист — за вказівкою.", "Без грубощів.", "Відновлення після гри."]}], "f": "Тест на підйом тулуба за 1 хвилину входить до багатьох систем оцінювання фізичної підготовленості, бо він простий і не потребує спеціального обладнання.", "pr": ["Склади план підготовки до тесту «прес за 1 хв» на 2 тижні (3 тренування на тиждень) з поступовим збільшенням навантаження.", "Виконай ЗРВ з м'ячем (обертання навколо тулуба й колін, «вісімка» між ногами) по 10 разів у кожен бік та планку 3×30 с."], "q": ["Як виконується тест на прес за 1 хв?", "Які повтори не зараховуються?", "Що таке м'язи кору і навіщо їх тренувати?", "Як рахувати свою влучність у кидках?"]}, {"n": "38", "t": "Баскетбол: серійні кидки з активним опором захисника і фінтами. Вправи з набивним м'ячем. Гра", "g": "Учень удосконалить розуміння кидків під тиском захисника і знатиме, як тренувати силу рук і корпусу набивним м'ячем.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Накривання", "дія захисника, який вистрибує і торкається м'яча після кидка суперника, блокуючи його."], ["Фінт проходом", "обманний рух, що показує прохід в одну сторону з подальшим кидком або рухом в іншу."], ["Кидок з відходом", "кидок, під час якого гравець відхиляється назад, щоб уникнути блоку."], ["Вибухова потужність рук", "здатність швидко виконати сильний рух руками, наприклад кидок набивного м'яча."]], "th": [{"h": "Баскетбол. Кидки під активним опором", "p": ["Коли захисник близько, кидаючий має створити собі простір: фінтом проходу, кроком назад або швидким кидком після ловіння. Головне — не змінювати базову техніку кидка під тиском.", "Кидок з відходом складніший і вимагає більше сили, тому на уроці його виконують з близької відстані."], "ul": ["Фінт проходом — крок у сторону без відриву опорної ноги.", "Швидкий кидок після ловіння.", "Траєкторія вища, якщо захисник близько.", "Не стрибай на захисника.", "Тренуй кидки з обох сторін кошика."]}, {"h": "Загальна фізична підготовка. Вправи з набивним м'ячем", "p": ["Набивний м'яч розвиває потужність рук, плечей і корпусу. Кидки від грудей, з-за голови, збоку (з поворотом тулуба) імітують рухи баскетболіста.", "Вага м'яча має відповідати силам учня; спочатку — легший м'яч."], "ul": ["Кидок від грудей партнеру.", "Кидок з-за голови двома руками.", "Бічний кидок з поворотом.", "Кидок знизу вперед-угору.", "Ловля з амортизацією руками."]}, {"h": "Баскетбол. Гра", "p": ["У грі використовуй фінти, щоб звільнитися для кидка. Захисникам — тримай руки вгорі, але не фоли на кидаючому.", "Фол на кидаючому гравці може призвести до штрафних кидків."], "ul": ["Фінт перед кидком.", "Руки вгору у захисті.", "Без контакту з кидаючим.", "Підбирання після кидка.", "Чесна гра."]}], "f": "У баскетболі фол на гравці під час кидка зазвичай карається штрафними кидками, кількість яких залежить від зони, звідки кидав гравець.", "pr": ["Опиши два способи створити собі простір для кидка, коли захисник близько.", "Виконай вправи для корпусу: повороти тулуба сидячи з предметом (пляшка води) 3×12, віджимання 3×10, планка 3×30 с."], "q": ["Як звільнитися від захисника для кидка?", "Що таке накривання м'яча?", "Які кидки набивного м'яча корисні баскетболісту?", "Чим карається фол на гравці під час кидка?"]}, {"n": "39", "t": "Баскетбол: чергування ловіння, передач і кидків. Біг зі зміною напрямку. Прискорення на 15 м", "g": "Учень вмітиме поєднувати різні способи ловіння, передач і кидків у зв'язках та знатиме, як розвивати швидкість реакції після фінтів.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Ловіння м'яча", "прийом, коли гравець приймає м'яч двома або однією рукою, амортизуючи його швидкість."], ["Передача однією рукою від плеча", "передача на середню і далеку відстань, схожа на кидок."], ["Передача двома руками з-за голови", "передача над захисником, часто після підбирання."], ["Ігрова зв'язка", "поєднання кількох технічних прийомів у одну безперервну дію."]], "th": [{"h": "Баскетбол. Ловіння, передачі та кидки в зв'язках", "p": ["У грі прийоми рідко виконуються окремо: гравець ловить, повертається, передає або кидає. Тренування зв'язок робить ці дії плавними. Наприклад: ловіння в русі — зупинка двома кроками — передача однією рукою від плеча — рух у вільну зону — ловіння — кидок.", "Ловлять м'яч пальцями, руки йдуть назустріч і «гасять» швидкість."], "ul": ["Руки назустріч м'ячу.", "Ловіння пальцями, не долонями.", "Передача з-за голови — над захисником.", "Передача від плеча — на далеку відстань.", "Після передачі — одразу рух."]}, {"h": "Загальна фізична підготовка. Біг зі зміною напрямку та прискорення на 15 м", "p": ["Прискорення на 15 м з різних положень після фінтів (обманних рухів) за сигналом розвивають уміння швидко рушати після зміни напряму — як у грі, коли гравець звільняється від опіки.", "Змагання з суперником підвищує мотивацію, але правила безпеки — понад усе."], "ul": ["Фінт корпусом перед стартом.", "Різкий перший крок.", "Нахил тулуба вперед на старті.", "Безпечна відстань між парами.", "Відновлення після кожного повтору."]}, {"h": "Баскетбол. Різновиди бігу та комплекс ЗРВ", "p": ["Розминка включає різновиди бігу та ходьби, ЗРВ для рук і ніг. Особливу увагу приділяють кистям і пальцям — вони працюють з м'ячем постійно.", "Завершують розминку передачами в парах."], "ul": ["Біг з високим підніманням стегна.", "Біг приставними кроками.", "Обертання кистей.", "Згинання і розгинання пальців.", "Передачі в парах на місці."]}], "f": "Досвідчені баскетболісти часто вирішують, що робити з м'ячем, ще до того, як його спіймають, — тому зв'язки прийомів тренують до автоматизму.", "pr": ["Склади і опиши 2 ігрові зв'язки прийомів (ловіння — зупинка — передача — кидок) з поясненням, у якій ігровій ситуації вони потрібні.", "Виконай вправи для кистей і пальців: стискання м'ячика або згорнутого рушника 3×20, обертання кистей 2×15 у кожен бік."], "q": ["Як правильно ловити м'яч?", "Коли використовують передачу з-за голови?", "Що таке ігрова зв'язка прийомів?", "Навіщо тренувати прискорення після фінта?"]}, {"n": "40", "t": "Баскетбол: передача м'яча по колу зі зміною місць. Розвиток периферійного зору та координації", "g": "Учень знатиме вправи для розвитку периферійного зору, координації і спритності та їх значення для баскетболу.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Периферійний зір", "здатність бачити предмети збоку від точки, на яку дивишся прямо."], ["Координація рухів", "узгодженість роботи м'язів, що дозволяє виконувати точні рухи."], ["Розподіл уваги", "здатність одночасно стежити за кількома об'єктами чи діями."], ["Передача по колу", "вправа, у якій гравці стоять колом і передають м'яч один одному."]], "th": [{"h": "Баскетбол. Передача м'яча по колу зі зміною місць", "p": ["Учні стають колом, передають м'яч і після передачі біжать на місце того, кому передали (або в інше визначене місце). Вправа вимагає одночасно стежити за м'ячем, партнерами і своїм переміщенням.", "Ускладнення: два м'ячі одночасно, передачі через одного, зміна напрямку за сигналом."], "ul": ["Передача точно в руки.", "Після передачі — одразу рух.", "Голосом назви партнера перед передачею.", "Не дивися лише на м'яч.", "Ускладнюй поступово."]}, {"h": "Загальна фізична підготовка. Периферійний зір і координація", "p": ["Баскетболіст бачить не лише м'яч, а й партнерів, суперників, кошик. Периферійний зір дозволяє віддати передачу «не дивлячись», а насправді — бачачи партнера краєм ока.", "Координацію розвивають вправи з двома м'ячами, жонглювання, ведення з одночасним виконанням іншого завдання."], "ul": ["Ведення м'яча з підрахунком пальців, які показує партнер.", "Жонглювання двома-трьома м'ячиками.", "Ловіння м'яча після відскоку від стіни.", "Вправи з тенісним м'ячиком однією рукою.", "Ведення двох м'ячів одночасно."]}, {"h": "Баскетбол. Значення спритності в грі", "p": ["Спритність — це вміння швидко пристосовуватися до ситуації: зловити неточну передачу, обійти захисника, змінити рішення в останній момент.", "Ігрові вправи з м'ячем, що вимагають уваги та швидких рішень, найкраще розвивають спритність."], "ul": ["Швидке ухвалення рішень.", "Реакція на неточну передачу.", "Рівновага під час контакту.", "Зміна дії в останній момент.", "Чим більше різних вправ — тим краща спритність."]}], "f": "Периферійний зір можна тренувати: спортсмени ігрових видів часто краще помічають рухи збоку, ніж люди, які не займаються спортом.", "pr": ["Виконай вдома вправу на периферійний зір: дивлячись прямо на точку на стіні, називай предмети, які бачиш краєм ока ліворуч і праворуч; запиши, скільки помітив(-ла).", "Виконай вправу на координацію: підкидай і лови м'який м'ячик (або згорнуті шкарпетки) однією рукою, потім іншою, по 20 разів, а потім — стоячи на одній нозі."], "q": ["Що таке периферійний зір і навіщо він баскетболісту?", "Як виконується передача м'яча по колу зі зміною місць?", "Які вправи розвивають координацію?", "Що таке розподіл уваги?"]}, {"n": "41", "t": "Баскетбол: 10 кидків (2×5) з дистанції 4,5 м з п'яти точок півколом", "g": "Учень знатиме, як організувати серію кидків з п'яти точок на однаковій відстані від кошика та як аналізувати свою влучність.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Точки кидка", "визначені місця на майданчику, з яких виконують кидки в тренуванні чи тесті."], ["Кут кидка відносно щита", "положення гравця збоку або навпроти кошика, що впливає на вибір прицілу."], ["Кидок від щита", "кидок, при якому м'яч спочатку ударяється об щит, а потім потрапляє в кошик."], ["Стабільність техніки", "здатність виконувати рух однаково у кожній спробі."]], "th": [{"h": "Баскетбол. Організація кидків з п'яти точок", "p": ["П'ять точок розташовані півколом на однаковій відстані 4,5 м від кошика: дві біля лицьової лінії (під кутом 0°), дві під кутом 45° і одна навпроти кошика. З кожної точки виконують по 2 кидки за два кола (2×5) — разом 10 кидків.", "Учні розташовуються біля кожного щита, по черзі кидають і подають м'ячі. Хто не кидає — стоїть збоку, не під кошиком."], "ul": ["5 точок півколом на відстані 4,5 м.", "Вивчений спосіб кидка — однією рукою від плеча.", "Черговість і безпека під щитом.", "Партнер подає м'яч.", "Облік влучань з кожної точки."]}, {"h": "Баскетбол. Прицілювання з різних кутів", "p": ["Під кутом 45° зручно кидати від щита: прицілюються у верхній кут намальованого на щиті прямокутника. Навпроти кошика і з-під кута 0° кидають «чисто» — у кільце, цілячись у передню дужку.", "Однакова техніка у кожному кидку — запорука стабільності. Змінюється лише точка прицілу, а не рух."], "ul": ["45° — кидок від щита.", "Навпроти кошика — кидок у кільце.", "0° (з боку) — щит не допомагає, кидок «чисто».", "Ритм: ловіння — стійка — кидок.", "Аналізуй, з яких точок влучаєш гірше."]}, {"h": "Загальна фізична підготовка. Розминка перед кидковою серією", "p": ["Перед кидками розминають кисті, пальці, лікті й плечі, а також ноги — адже кидок починається з ніг.", "Завершують розминку кидками з близької відстані."], "ul": ["Обертання кистями і плечима.", "Присідання з винесенням рук угору.", "Імітація кидка без м'яча.", "Кидки з 1–2 м.", "Поступовий перехід на 4,5 м."]}], "f": "Прямокутник на баскетбольному щиті допомагає гравцям прицілюватися під час кидків від щита.", "pr": ["Намалюй схему розташування п'яти точок кидка на відстані 4,5 м від кошика і познач, з яких точок зручно кидати від щита.", "Склади таблицю для обліку влучань (5 точок × 2 кидки) і виконай 20 імітацій кидка без м'яча, стежачи за ліктем і кистю."], "q": ["Як розташовані п'ять точок кидка?", "З якої точки зручно кидати від щита і куди цілитися?", "Чому техніка кидка має бути однаковою з усіх точок?", "Як організувати безпечне виконання кидків групою?"]}, {"n": "42", "t": "Баскетбол: кидок однією рукою в стрибку зверху вниз з розбігу. Вправи для розслаблення", "g": "Учень знатиме техніку кидка однією рукою зверху вниз у стрибку з розбігу та значення вправ на розслаблення після навантаження.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Кидок зверху вниз (слем-данк)", "кидок, при якому гравець у стрибку вкладає м'яч у кошик згори."], ["Двокроковий ритм", "два кроки після ловіння чи ведення перед відштовхуванням для кидка з розбігу."], ["Вправи на розслаблення", "вправи, що знімають напруження м'язів і прискорюють відновлення."], ["Відштовхування однією ногою", "поштовх від підлоги однією ногою, що дозволяє стрибнути вище в русі."]], "th": [{"h": "Баскетбол. Кидок однією рукою зверху вниз з розбігу", "p": ["Кидок зверху вниз виконують після розбігу та двокрокового ритму: ловіння м'яча на перший крок, другий крок — відштовхування, мах коліном угору, винесення м'яча однією рукою вгору і «вкладання» в кошик зверху. Цей кидок доступний не всім за зростом і стрибучістю, тому на уроці навчаються підвідних вправ: виніс м'яча в найвищу точку, кидок з-під кошика у стрибку.", "Не можна висіти на кільці без потреби — це небезпечно і є порушенням."], "ul": ["Двокроковий ритм без пробіжки.", "Відштовхування однією ногою, мах коліном.", "М'яч захищений другою рукою.", "Підвідна вправа — кидок з-під кошика у стрибку.", "Приземлення на обидві ноги, не під інших гравців."]}, {"h": "Загальна фізична підготовка. Стрибучість", "p": ["Для високого стрибка потрібні сильні ноги, швидке відштовхування та координація маху руками й коліном. Розвивають стрибучість вистрибуваннями, стрибками на одній нозі, присіданнями.", "Стрибкові вправи виконують невеликими серіями, з якісним приземленням."], "ul": ["Вистрибування вгору з маху руками.", "Стрибки з ноги на ногу.", "Присідання й випади.", "Підйоми на носки.", "М'яке приземлення."]}, {"h": "Загальна фізична підготовка. Вправи для розслаблення", "p": ["Після інтенсивних стрибків м'язи напружені. Вправи на розслаблення — потрушування руками й ногами, вільні махи, повільне глибоке дихання, легка розтяжка — допомагають їм швидше відновитися.", "Розслаблення також знижує психологічне напруження перед відповідальною грою."], "ul": ["Потрушування кистями і ногами.", "Вільні махи розслабленими руками.", "Глибоке дихання: вдих на 4 рахунки, видих на 6.", "Розтяжка без болю.", "Лежачи — розслаблення м'язів по черзі."]}], "f": "Кидок зверху вниз — один із найефектніших прийомів у баскетболі, але приносить команді стільки ж очок, скільки звичайний кидок з-під кошика, — 2.", "pr": ["Опиши фази кидка з розбігу у двокроковому ритмі та поясни, як не порушити правило пробіжки.", "Виконай комплекс розслаблення після фізичного навантаження: потрушування рук і ніг, дихальна вправа (вдих 4 — видих 6, 10 разів), 4 розтяжки по 20–30 с."], "q": ["Як виконується двокроковий ритм?", "Чому кидок зверху вниз доступний не всім учням і які підвідні вправи існують?", "Навіщо потрібні вправи на розслаблення?", "Як розвивати стрибучість?"]}, {"n": "43", "t": "Контрольне тестування: 10 кидків з дистанції 4,5 м з п'яти точок. Гра на координацію рухів", "g": "Учень знатиме, як виконувати контрольний тест кидків з п'яти точок, як до нього підготуватися та оцінити свій результат.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Залікова спроба", "спроба в тесті, результат якої враховується в оцінці."], ["Відсоток влучання", "кількість влучних кидків, поділена на загальну кількість і помножена на 100."], ["Передстартове хвилювання", "емоційне напруження перед змаганням або тестом."], ["Гра на координацію", "рухлива гра, що вимагає узгоджених і точних рухів, швидкої реакції."]], "th": [{"h": "Баскетбол. Контрольне тестування: 10 кидків з 4,5 м", "p": ["Учень виконує 10 кидків вивченим способом з п'яти точок, розташованих півколом на відстані 4,5 м від кошика (по 2 кидки з кожної точки). Рахують кількість влучень.", "Для успіху важливо розім'ятися, зробити кілька пробних кидків і зберігати однаковий ритм у кожній спробі."], "ul": ["Розминка кистей, плечей, ніг.", "Пробні кидки з кожної точки.", "Однаковий ритм: ловіння — стійка — кидок.", "Не поспішай, але й не затримуйся надовго.", "Порівняй результат з тренувальним."]}, {"h": "Баскетбол. Як упоратися з хвилюванням і оцінити результат", "p": ["Хвилювання перед тестом природне. Допомагають глибоке дихання, зосередженість на техніці (а не на результаті) та позитивні думки: «Я це вже робив багато разів».", "Після тесту порахуй відсоток влучання: наприклад, 6 з 10 — це 60%. Подумай, з яких точок промахи траплялися найчастіше, — саме там і варто тренуватися."], "ul": ["2–3 глибокі вдихи перед кидком.", "Думай про техніку, а не про оцінку.", "Однаковий ритуал перед кожним кидком.", "Аналіз промахів після тесту.", "План тренувань на слабкі точки."]}, {"h": "Загальна фізична підготовка. Гра на координацію рухів", "p": ["Ігри на координацію (наприклад, передачі двох м'ячів у колі, естафети з веденням і зміною рук, «дзеркало» в парах) допомагають зняти напруження після тесту і розвивають спритність.", "Правила гри мають бути зрозумілі всім, а місце — безпечне."], "ul": ["Ведення зі зміною руки за сигналом.", "Передачі двох м'ячів у колі.", "«Дзеркало»: повтори рухи партнера.", "Естафети з м'ячем.", "Безпечна відстань між учасниками."]}], "f": "Багато баскетболістів перед кидком виконують той самий короткий «ритуал» — кілька ударів м'ячем об підлогу чи вдих, — бо це допомагає зосередитися.", "pr": ["Опиши, як ти будеш готуватися до тесту з кидків і як упоратися з хвилюванням; придумай власний «ритуал» перед кидком.", "Порахуй відсоток влучання для результатів 4, 6 і 8 з 10 кидків та виконай вправу на координацію: перекидання м'якого м'ячика з руки в руку над головою 3×20."], "q": ["Як проводиться тест «10 кидків з 4,5 м»?", "Як порахувати відсоток влучання?", "Що допомагає впоратися з хвилюванням перед тестом?", "Навіщо аналізувати промахи після тесту?"]}, {"n": "44", "t": "Баскетбол: організація техніко-тактичних дій у грі. Серійні кидки з пасивним опором захисника", "g": "Учень знатиме, як поєднуються техніка і тактика в баскетболі, та вмітиме пояснити, як діяти в атаці й захисті командою.", "k": "Модулі: Баскетбол", "terms": [["Техніко-тактичні дії", "використання технічних прийомів відповідно до ігрової ситуації та плану команди."], ["Пасивний опір", "захисник лише стоїть перед гравцем з піднятими руками, не намагаючись активно відібрати м'яч."], ["Заслін", "прийом, коли гравець своїм тілом перекриває шлях захисникові, звільняючи партнера."], ["Розіграш", "заздалегідь підготовлена комбінація для атаки."]], "th": [{"h": "Баскетбол. Організація техніко-тактичних дій", "p": ["Техніка — це те, як гравець виконує прийоми (кидок, передачу, ведення), а тактика — коли і для чого він їх використовує. Команда домовляється про ролі: хто розігрує м'яч, хто кидає з дистанції, хто бореться під щитом.", "Найпростіша групова взаємодія — заслін: партнер стає на шляху захисника, і гравець з м'ячем звільняється для кидка чи проходу."], "ul": ["Розігруючий — організовує атаку.", "Кидаючі — кидки з середньої та далекої дистанції.", "Центровий — гра під кошиком, підбирання.", "Заслін — стоїш нерухомо, без штовхання.", "Розіграші — запам'ятовуються і повторюються."]}, {"h": "Баскетбол. Серійні кидки з пасивним опором", "p": ["Пасивний опір — перехідний етап від кидків без захисника до гри. Захисник стоїть з піднятими руками, і кидаючий вчиться тримати техніку, коли перед ним є перешкода.", "Траєкторію кидка роблять трохи вищою, щоб м'яч пролітав над руками захисника."], "ul": ["Не змінюй техніку через захисника.", "Вища траєкторія.", "Кидок з різних точок.", "Облік влучань.", "Зміна ролей у парі."]}, {"h": "Баскетбол. Тактика захисту", "p": ["У захисті команда обирає особистий або зонний захист. В обох випадках важливі: позиція між суперником і кошиком, підняті руки, підбирання після кидка.", "Перехід від атаки до захисту має бути миттєвим, щоб суперник не отримав легкий кидок."], "ul": ["Позиція між суперником і кошиком.", "Руки вгору.", "Спілкування з партнерами.", "Миттєве повернення в захист.", "Підбирання після кидка суперника."]}], "f": "Заслін — одна з найдавніших і найпоширеніших тактичних взаємодій у баскетболі, і більшість командних атак так чи інакше будуються на заслонах.", "pr": ["Намалюй схему заслону для гравця з м'ячем і поясни дії обох нападників.", "Опиши ролі гравців у баскетбольній команді і визнач, яка роль підходить тобі найбільше й чому."], "q": ["Чим техніка відрізняється від тактики?", "Що таке заслін і як його правильно ставити?", "Навіщо тренувати кидки з пасивним опором?", "Які основні завдання захисту?"]}, {"n": "45", "t": "Баскетбол: серійні кидки з активним опором і фінтами. Накривання м'яча. Гра на координацію", "g": "Учень знатиме правила і техніку накривання м'яча та вмітиме пояснити, як кидати під активним опором захисника.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Блокшот", "дія захисника, що зупиняє кинутий м'яч рукою, не порушуючи правил."], ["Порушення при накриванні", "торкання м'яча, який уже опускається на кошик після найвищої точки польоту, що зараховується як влучання."], ["Таймінг стрибка", "вибір правильного моменту для стрибка."], ["Вертикальність", "правило, згідно з яким захисник має право на простір над собою, якщо стрибає вгору, а не на нападника."]], "th": [{"h": "Баскетбол. Накривання м'яча", "p": ["Накривання (блокшот) виконують рукою, ближчою до м'яча, у стрибку вертикально вгору. Чекай, поки нападник почне кидок, а не реагуй на фінт. Торкатися можна лише м'яча, а не рук суперника.", "Не можна торкатися м'яча, який уже опускається до кошика після найвищої точки, — таке влучання зараховується."], "ul": ["Стрибай вертикально, а не на нападника.", "Не реагуй на фінт кидком.", "Торкайся лише м'яча.", "Після блоку — підбирай м'яч.", "Ризик фолу: краще заважати руками, ніж стрибати невчасно."]}, {"h": "Баскетбол. Кидки з активним опором і фінтами", "p": ["Активний захисник намагається накрити кидок. Нападник використовує фінти кидком і проходом, а також швидкий кидок після ловіння. Вища траєкторія і швидший випуск м'яча ускладнюють накривання.", "Тренуйся в парах: один кидає, інший захищає, потім мінятися ролями."], "ul": ["Фінт кидком — змусь захисника стрибнути.", "Швидкий випуск м'яча.", "Висока траєкторія.", "Кидок після кроку в бік.", "Чесна боротьба без фолів."]}, {"h": "Загальна фізична підготовка. Гра на координацію рухів", "p": ["Ігри на координацію після інтенсивних кидків допомагають закріпити вміння контролювати тіло. Наприклад: ведення двох м'ячів, передачі з рухом, гра «вартові і перехоплювачі».", "Головне — уважність і безпечна відстань між гравцями."], "ul": ["Ведення двох м'ячів одночасно.", "Передачі в русі трійками.", "Стрибки з ловінням м'яча.", "Сигнальні завдання від вчителя.", "Безпека під час гри."]}], "f": "Правила баскетболу забороняють захиснику торкатися м'яча, що вже опускається до кошика, — це порушення, і кидок зараховується.", "pr": ["Опиши правила накривання м'яча та поясни, чому захиснику важливо стрибати вертикально.", "Виконай вправу на координацію і рівновагу: стоячи на одній нозі, перекидай м'який м'ячик з руки в руку 2×20 на кожну ногу."], "q": ["Як правильно накривати м'яч?", "Коли торкання м'яча захисником є порушенням?", "Як нападнику уникнути накривання?", "Що означає правило вертикальності?"]}, {"n": "46", "t": "Контрольне тестування: 10 штрафних кидків на точність. Серійні кидки з опором. Гра", "g": "Учень знатиме правила виконання штрафного кидка, як підготуватися до тесту і оцінити свій результат.", "k": "Модулі: Баскетбол", "terms": [["Штрафний кидок", "кидок з лінії штрафного без перешкод, що оцінюється в 1 очко."], ["Лінія штрафного кидка", "лінія на майданчику, з-за якої виконують штрафні кидки, не заступаючи її."], ["Передкидкова рутина", "однакова послідовність дій перед кожним кидком для концентрації."], ["Фол", "порушення правил, пов'язане з неправомірним контактом із суперником або неспортивною поведінкою."]], "th": [{"h": "Баскетбол. Контрольне тестування: штрафний кидок", "p": ["Учень виконує 10 штрафних кидків з лінії штрафного кидка. Заступати за лінію до того, як м'яч торкнеться кільця, не можна. Рахують кількість влучень.", "Штрафний кидок — це кидок без захисника, тож усе залежить від техніки та концентрації. Допомагає однакова «рутина»: стати, вирівняти стопи, кілька ударів м'ячем, вдих, кидок."], "ul": ["Стопи за лінією, кидкова нога трохи попереду.", "Передкидкова рутина однакова щоразу.", "Лікоть під м'ячем, погляд на кільце.", "Кидок по дузі.", "Самооцінка: кількість влучень з 10, відсоток."]}, {"h": "Баскетбол. Серійні кидки з активним опором і накривання", "p": ["Після тесту продовжуємо кидки під тиском захисника. Захисник тренує накривання, нападник — фінти і швидкий кидок.", "Кожна серія завершується підбиранням м'яча."], "ul": ["Фінт перед кидком.", "Вертикальний стрибок захисника.", "Підбирання після кожного кидка.", "Зміна ролей.", "Облік влучань під опором."]}, {"h": "Баскетбол. Фоли і штрафні кидки в грі", "p": ["Штрафні кидки призначаються за фоли, зокрема коли фолять на гравці під час кидка, а також коли команда перевищила ліміт командних фолів у чверті. Тому точні штрафні часто вирішують результат напруженого матчу.", "У грі намагайся захищатися без фолів: ноги, а не руки, мають утримувати позицію."], "ul": ["Фол на кидаючому — штрафні кидки.", "Командні фоли накопичуються протягом чверті.", "Захищайся ногами, а не руками.", "Не штовхай і не тримай суперника.", "Поважай рішення судді."]}], "f": "Штрафний кидок — єдиний кидок у баскетболі, під час якого гравцю ніхто не заважає, тому його ще називають «вільним кидком».", "pr": ["Опиши свою передкидкову рутину для штрафного кидка і поясни, як вона допомагає зосередитися.", "Виконай 20 імітацій штрафного кидка без м'яча перед дзеркалом, стежачи за положенням ліктя, кисті та стоп; потім 10 присідань із винесенням рук угору."], "q": ["Скільки очок дає штрафний кидок?", "Коли гравець може заступити за лінію штрафного?", "За що призначаються штрафні кидки?", "Що таке передкидкова рутина?"]}, {"n": "47", "t": "Баскетбол: різновиди бігу та ходьби. Організація швидкого прориву. Зіскоки в глибину", "g": "Учень знатиме, як організувати швидкий прорив у баскетболі, та техніку безпечного виконання зіскоків у глибину.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Швидкий прорив", "швидкий перехід від захисту в атаку, щоб атакувати кошик до того, як суперник повернеться в захист."], ["Перша передача", "передача після підбирання м'яча, з якої починається швидкий прорив."], ["Чисельна перевага", "ситуація, коли нападників біля кошика більше, ніж захисників, наприклад 2 проти 1."], ["Зіскок у глибину", "стрибок з невисокої опори вниз з м'яким приземленням, що тренує амортизацію і силу ніг."]], "th": [{"h": "Баскетбол. Організація швидкого прориву", "p": ["Швидкий прорив складається з трьох фаз: підбирання м'яча або перехоплення, перша передача на фланг або в центр і завершення атаки кидком з близької відстані. Головне — швидкість і чисельна перевага.", "Гравці біжать коридорами: один у центрі з м'ячем, двоє — по флангах. Завершення — двокроковий кидок або передача партнеру, який відкритий."], "ul": ["Підбирання — швидка перша передача.", "Три коридори: центр і два фланги.", "М'яч рухається передачами швидше, ніж веденням.", "Завершення — кидок з-під кошика.", "Якщо прорив не вдався — переходь до позиційної атаки."]}, {"h": "Загальна фізична підготовка. Зіскоки в глибину", "p": ["Зіскоки з невисокої опори (гімнастичної лави) вчать правильно приземлятися: на передню частину стоп з перекатом, коліна зігнуті і спрямовані за носками, корпус трохи нахилений уперед. Це захищає коліна під час гри.", "Висота — невелика, лише на м'який мат, після розминки і з дозволу вчителя."], "ul": ["Невисока опора, мат для приземлення.", "Приземлення на обидві ноги м'яко.", "Коліна не зводяться всередину.", "Руки вперед для рівноваги.", "Невелика кількість повторень."]}, {"h": "Баскетбол. Різновиди бігу та ходьби", "p": ["Розминка до швидкого прориву включає біг з прискоренням, біг спиною вперед, приставні кроки, ходьбу випадами. Вони готують м'язи до швидкої зміни темпу.", "Темп поступово зростає від ходьби до прискорень."], "ul": ["Ходьба випадами.", "Біг спиною вперед.", "Приставні кроки.", "Прискорення 3×15 м.", "Ривки з переходом у ведення."]}], "f": "Швидкий прорив вважається одним із найрезультативніших способів атаки, бо дозволяє кидати з близької відстані, коли захист ще не встиг організуватися.", "pr": ["Намалюй схему швидкого прориву втрьох (три коридори) і поясни дії кожного гравця.", "Опиши правильну техніку приземлення після стрибка і виконай вдома 3×10 повільних присідань, стежачи, щоб коліна не зводилися всередину (без стрибків)."], "q": ["З яких фаз складається швидкий прорив?", "Чому в прориві м'яч краще передавати, ніж вести?", "Як правильно приземлятися після зіскоку?", "Що таке чисельна перевага?"]}, {"n": "48", "t": "Баскетбол: ловіння та передачі без зорового контролю під опором захисника. Гра. Підсумок чверті", "g": "Учень знатиме, як виконувати передачі без зорового контролю, та повторить головне, вивчене з баскетболу протягом чверті.", "k": "Модулі: Баскетбол · Загальна фізична підготовка", "terms": [["Передача без зорового контролю", "передача, під час якої гравець не дивиться прямо на партнера, а бачить його периферійним зором."], ["Перехоплення", "дія захисника, коли він заволодіває м'ячем під час передачі суперників."], ["Ігрове мислення", "здатність швидко оцінювати ситуацію на майданчику та обирати найкраще рішення."], ["Командна взаємодія", "узгоджені дії гравців для досягнення спільної мети."]], "th": [{"h": "Баскетбол. Ловіння та передачі без зорового контролю", "p": ["Передача без зорового контролю обманює захисника: він стежить за поглядом нападника і не очікує передачі в інший бік. Гравець бачить партнера периферійним зором і передає точно в руки.", "Такі передачі ризиковані, тому їх виконують лише тоді, коли впевнений, що партнер готовий до прийому. Під опором захисника головне — точність і швидкість."], "ul": ["Периферійний зір — основа передачі.", "Партнер має бути готовий.", "Коротка і швидка передача.", "Погляд «обманює» захисника.", "Не ризикуй без потреби."]}, {"h": "Баскетбол. Підсумок чверті: що ми вивчили", "p": ["Протягом чверті ми вивчили правила безпеки, стійку, пересування, зупинки й повороти, ведення, передачі різними способами, кидки однією рукою від плеча з середньої та далекої дистанції, кидок з розбігу, штрафні кидки, підбирання і накривання.", "З тактики — особистий і зонний захист (зони 2-3, 3-2), заслін, швидкий прорив. Контрольні тести: підтягування, прес за 1 хв, кидки з 4,5 м, штрафні кидки."], "ul": ["Техніка: ведення, передачі, кидки, зупинки, повороти.", "Тактика: зонний захист, заслін, швидкий прорив.", "Правила: пробіжка, подвійне ведення, 3 секунди, фоли.", "Тести: підтягування, прес, кидки з 4,5 м, штрафні.", "Командна гра і повага до суперника."]}, {"h": "Загальна фізична підготовка. Підсумок з фізичної підготовки", "p": ["Баскетбол розвиває швидкість реакції, стрибучість, спритність, координацію та витривалість. Протягом чверті ми тренували ці якості прискореннями, стрибками, вправами з набивним м'ячем і скакалкою.", "Порівняй свої результати тестів з початку і кінця чверті та визнач, над чим працювати далі."], "ul": ["Швидкість реакції — старти за сигналом.", "Стрибучість — стрибки, зіскоки.", "Сила — підтягування, віджимання, прес.", "Координація — вправи з двома м'ячами.", "Самоконтроль і щоденник прогресу."]}], "f": "У баскетболі командна гра часто важливіша за індивідуальну майстерність: команда, яка добре передає м'яч, створює більше відкритих кидків.", "pr": ["Заповни таблицю «Мій прогрес у баскетболі»: вивчені прийоми, результати тестів, що вдається найкраще, над чим працювати.", "Виконай вправу на периферійний зір і координацію: дивлячись прямо перед собою, підкидай і лови м'який м'ячик, називаючи предмети, які бачиш збоку (3×1 хв)."], "q": ["Коли доречна передача без зорового контролю?", "Які види захисту ми вивчили і чим вони відрізняються?", "Які контрольні тести ти виконував(-ла) цієї чверті?", "Які правила баскетболу порушуються найчастіше?"]}]}, {"name": "ІІІ чверть. Волейбол", "lessons": [{"n": "49", "t": "Безпека у волейболі. Ігри й вольові якості. Пересування вздовж сітки, передачі", "g": "Учень пригадає правила безпеки на уроках волейболу, зрозуміє, як спортивні ігри виховують характер, і повторить техніку пересувань уздовж сітки та верхньої й нижньої передач.", "k": "Модулі: Волейбол", "terms": [["Морально-вольові якості", "риси характеру (цілеспрямованість, витримка, сміливість, відповідальність, чесність), які допомагають долати труднощі й поводитися гідно."], ["Приставний крок", "спосіб пересування, коли одна нога приставляється до іншої без схрещування, що дає змогу швидко зупинитися й змінити напрямок."], ["Верхня передача", "передача м'яча двома руками над головою кінчиками пальців, яка забезпечує найвищу точність."], ["Нижня передача", "прийом і передача м'яча двома руками знизу передпліччями, складеними в єдину площину."]], "th": [{"h": "Волейбол. Правила безпеки та роль спортивних ігор у вихованні", "p": ["Волейбол — гра без прямого контакту із суперником, але травми все ж можливі: удари м'ячем, падіння, зіткнення з партнером, розтягнення пальців і гомілкостопа. Безпечна гра починається з якісної розминки, зручного спортивного взуття та уважності до партнерів.", "Спортивні ігри — це модель реального життя: треба ухвалювати рішення під тиском, приймати поразку, підтримувати команду і поважати суперника. Саме тому в грі формуються морально-вольові якості."], "ul": ["Перед заняттям — розминка суглобів пальців, кистей, плечей, колін і гомілкостопів.", "Займайтеся у спортивному взутті з неслизькою підошвою, без прикрас і годинників.", "Не перебігайте на чужу половину й не пролазьте під сіткою під час гри.", "Голосом повідомляйте партнерові «Моя!», щоб уникнути зіткнень.", "Чесна гра: визнавайте торкання сітки чи аут, навіть якщо суддя не помітив.", "Командна гра вчить відповідальності: помилка одного — завдання для всіх."]}, {"h": "Волейбол. Пересування вздовж сітки", "p": ["Гравці передньої лінії постійно переміщуються вздовж сітки: щоб заблокувати удар, підстрахувати партнера або вийти на передачу. Основні способи — приставний крок, біг, схресний крок. Головне — зберігати низьку стійку й бути готовим до стрибка."], "ul": ["Стійка: ноги на ширині плечей, коліна злегка зігнуті, вага на передній частині стоп.", "Рухайтеся приставним кроком боком до сітки, не схрещуйте ноги на коротких відстанях.", "Руки тримайте на рівні грудей або голови — так швидше підняти їх для блоку.", "Зупинка — на обидві ноги, з невеликим присіданням.", "Типова помилка: випрямлені ноги та підскоки під час руху — втрачається швидкість."]}, {"h": "Волейбол. Повторення верхньої та нижньої передач, навчальна гра", "p": ["Верхня передача — основний спосіб другої передачі для нападу; нижня — головний спосіб прийому подачі та сильних ударів. У навчальній грі важливо застосовувати обидва способи залежно від висоти й швидкості м'яча."], "ul": ["Верхня: кисті утворюють «ківш», великі пальці напрямлені один до одного, м'яч зустрічають над лобом.", "Верхня: рух іде знизу вгору від ніг через руки — працює все тіло.", "Нижня: руки випрямлені, кисті з'єднані, удар по м'ячу передпліччями, а не кистями.", "Нижня: виходьте під м'яч ногами, а не тягніться руками.", "Типова помилка: м'яч приймають надто пізно, над головою або збоку."]}], "f": "Волейбол придумав у 1895 році американський викладач Вільям Морган як спокійнішу альтернативу баскетболу.", "pr": ["Напишіть 5–6 речень про те, які морально-вольові якості ви виховуєте в собі завдяки спортивним іграм, і наведіть приклад із власного досвіду.", "Виконайте 3 підходи по 10 імітацій верхньої передачі перед дзеркалом (без м'яча), стежачи за положенням кистей і ніг."], "q": ["Які основні правила безпеки треба виконувати на уроці волейболу?", "Як спортивні ігри впливають на формування хар
