сля блоку — швидкий перехід до атаки.", "Не торкайтеся сітки під час приземлення.", "Обговорюйте вдалі й невдалі блоки."]}], "f": "", "pr": ["Намалюйте схему розташування блокуючого та гравця, що його страхує, у системі «кутом вперед».", "Виконайте 3 підходи по 10 імітацій блоку на місці без стрибка (напівприсід — підйом на носки з випрямленими руками) з короткою паузою у верхньому положенні."], "q": ["Коли застосовують індивідуальне блокування?", "Чим активний блок відрізняється від пасивного?", "Навіщо страхувати блокуючого?", "Де має стояти гравець, що страхує блок?"]}, {"n": "78", "t": "Прийом м'яча після швидкого переміщення. Навчальна гра. Підсумок ІІІ чверті", "g": "Учень удосконалить прийом м'яча після швидкого переміщення та підсумує знання, здобуті в модулі «Волейбол» у ІІІ чверті.", "k": "Модулі: Волейбол", "terms": [["Швидкість реакції", "час від появи сигналу (руху м'яча) до початку відповідної дії."], ["Випад", "широкий крок уперед або вбік зі згинанням опорної ноги, щоб дістати далекий м'яч."], ["Прийом у русі", "прийом м'яча, коли гравець не встигає повністю зупинитися перед контактом."], ["Ігрова позиція", "місце гравця на майданчику, звідки він найшвидше дістає м'ячі своєї зони."]], "th": [{"h": "Волейбол. Прийом м'яча після швидкого переміщення", "p": ["У грі м'яч рідко летить просто в руки: треба швидко переміститися, а потім прийняти. Найкраще, якщо гравець встигає зупинитися перед контактом; якщо ні — використовує випад або прийом у русі."], "ul": ["Стартуйте одразу після удару суперника.", "Перші кроки — короткі й швидкі.", "Перед контактом намагайтеся зупинитися.", "Якщо не встигаєте — випад і платформа в бік цілі.", "Після прийому — повернення в ігрову позицію."]}, {"h": "Волейбол. Підсумок ІІІ чверті: техніка", "p": ["Протягом чверті ви повторили й удосконалили основні технічні прийоми волейболу. Вони складають ланцюжок гри: подача — прийом — передача — удар — блок."], "ul": ["Подачі: націлена, силова, верхня бокова, у праву й ліву половини.", "Прийом: знизу в зонах 5, 6, 1, прийом збоку, після переміщення.", "Передачі: зв'язковому, у стрибку, у падінні, через сітку на точність.", "Нападаючий удар: прямий, з переводом, за ходом, слабкою рукою, обманні дії.", "Блок: одиночний, індивідуальний, зі страхуванням."]}, {"h": "Волейбол. Підсумок ІІІ чверті: тактика, теорія, фізична підготовка", "p": ["Окрім техніки, ви вивчали тактичні системи, правила й суддівство, а також теми про здоров'я: самоконтроль, втому й функціональні можливості організму."], "ul": ["Система гри «кутом вперед», взаємодія гравців зон 4, 3, 2.", "Суддівська бригада, жести, правила підрахунку очок.", "Волейбол в олімпійському русі, амплуа гравців.", "Самоконтроль, втома і перевтома, засоби відновлення.", "Контрольні нормативи: віджимання, піднімання тулуба, подачі й передачі на точність."]}], "f": "", "pr": ["Складіть письмовий план-конспект «Волейбол: що я вмію» з трьох розділів — техніка, тактика, правила — і в кожному розділі вкажіть, що вдається найкраще і над чим ще варто працювати.", "Виконайте 3 підходи по 8 випадів у різні боки з імітацією прийому м'яча знизу та поверненням у стійку."], "q": ["Як прийняти м'яч, якщо не встигаєш зупинитися?", "Які види подач і нападаючих ударів вивчено в ІІІ чверті?", "У чому суть системи «кутом вперед»?", "Які ознаки перевтоми і як її уникнути?"]}]}, {"name": "IV чверть. Футбол та загальна фізична підготовка", "lessons": [{"n": "79", "t": "Безпека на стадіоні. Біг на 30 і 60 м. Естафета. Метання м'яча. Елементи футболу", "g": "Учень знатиме правила безпеки на заняттях легкою атлетикою та футболом на стадіоні, техніку бігу на короткі дистанції, естафетної передачі й метання м'яча.", "k": "Модулі: Легка атлетика · Футбол · Загальна фізична підготовка", "terms": [["Високий старт", "положення на старті стоячи, з однією ногою попереду та нахиленим уперед тулубом."], ["Стартовий розгін", "частина спринтерського бігу, під час якої бігун нарощує швидкість після старту."], ["Естафетна передача", "передача палички від одного бігуна до іншого в межах зони передачі."], ["Метання", "кидання спортивного снаряда (м'яча, гранати, списа) на дальність або в ціль."]], "th": [{"h": "Легка атлетика. Правила безпеки на стадіоні", "p": ["Навесні заняття переносяться на стадіон, і з'являються нові ризики: нерівна поверхня, вологий газон, кидки снарядів. Дисципліна і уважність — найкращий захист.", "Під час метання ніхто не повинен перебувати в секторі, а забирати снаряди можна лише за командою вчителя."], "ul": ["Займайтеся у взутті з добрим зчепленням і одязі за погодою.", "Бігайте лише по своїй доріжці, не перетинайте чужу.", "Не стійте в секторі метання й не метайте без команди.", "Перед бігом — розминка м'язів ніг і гомілкостопів.", "Повідомляйте вчителя про погане самопочуття.", "У футболі — без грубих підкатів і ударів по ногах."]}, {"h": "Легка атлетика. Біг на 30 і 60 м, естафета, метання м'яча", "p": ["Біг на 30 і 60 м — спринт, де вирішальними є реакція на старт, швидкий розгін і збереження швидкості до фінішу. В естафеті важливо передати паличку на швидкості, не втрачаючи часу. Метання м'яча вимагає розбігу, обгону снаряда та потужного кидка через плече."], "ul": ["Старт: руки зігнуті, вага на передній нозі, погляд уперед.", "Розгін: нахил тулуба поступово зменшується.", "Фініш: не сповільнюйтеся перед лінією, пробігайте її.", "Естафета: бігун, що приймає, починає рух заздалегідь, паличку передають у зоні.", "Метання: розбіг, відведення руки, кидок під кутом близько 40–45°."]}, {"h": "Футбол. Елементи гри та спеціальні вправи", "p": ["У IV чверті повертаємося до футболу. Спершу варто пригадати базові елементи: ведення, передачі, зупинки й удари. ЗФП (біг, стрибки, силові вправи) готує організм до гри."], "ul": ["Ведення м'яча внутрішньою та зовнішньою стороною стопи.", "Передачі внутрішньою стороною стопи.", "Зупинка підошвою та внутрішньою стороною стопи.", "Удари по воротах з місця.", "ЗФП: бігові та стрибкові вправи, прискорення."]}], "f": "", "pr": ["Складіть пам'ятку з 6 правил безпеки на уроках фізичної культури на стадіоні.", "Виконайте вдома 3 підходи по 10 імітацій рухів рук під час спринтерського бігу на місці (руки зігнуті під кутом близько 90°, рух вперед-назад) перед дзеркалом."], "q": ["Які правила безпеки треба виконувати під час метання?", "З яких частин складається спринтерський біг?", "Як правильно передавати естафетну паличку?", "Які елементи футболу варто пригадати на початку чверті?"]}, {"n": "80", "t": "Контрольне тестування: біг на 30 і 60 м. Комплекс ЗРВ. Метання м'яча на дальність", "g": "Учень знатиме, як підготуватися до тестування з бігу на 30 і 60 м, як правильно його пробігти й оцінити результат, а також вдосконалить метання м'яча на дальність.", "k": "Модулі: Легка атлетика · Загальна фізична підготовка", "terms": [["Стартова реакція", "час від команди чи сигналу до початку руху бігуна."], ["Фінішний кидок", "рух грудьми або плечем уперед на останньому кроці перед фінішною лінією."], ["Кут вильоту", "кут, під яким снаряд відлітає від руки; для метання м'яча оптимальний кут близько 40–45°."], ["Обгін снаряда", "положення під час метання, коли ноги й таз випереджають руку зі снарядом, що дає змогу вкласти силу всього тіла."]], "th": [{"h": "Легка атлетика. Як скласти тест з бігу на 30 і 60 м", "p": ["Тестування проводять після розминки, з високого або низького старту за вказівкою вчителя. Результат фіксують секундоміром і порівнюють з навчальними нормативами. Для вас найважливіше — пробігти технічно правильно й показати свій найкращий результат.", "Оцінюйте прогрес порівняно з власними попередніми результатами."], "ul": ["Розминка 10–15 хв: біг, ЗРВ, спеціальні бігові вправи, 2–3 прискорення.", "Старт за командами «На старт!», «Увага!», «Руш!».", "Не стартуйте до сигналу — фальстарт.", "Біжіть до кінця, не озираючись.", "Після фінішу — повільний біг і ходьба для відновлення."]}, {"h": "Загальна фізична підготовка. Різновиди бігу, ходьби та комплекс ЗРВ", "p": ["Комплекс ЗРВ перед тестами готує м'язи та суглоби до максимального зусилля. Різновиди бігу й ходьби поступово підвищують інтенсивність і допомагають налаштуватися."], "ul": ["Ходьба з махами руками й ногами.", "Біг з підніманням стегна, із закиданням гомілки.", "Нахили, повороти, випади.", "Розминка гомілкостопів і колін.", "Короткі прискорення 15–20 м."]}, {"h": "Легка атлетика. Метання м'яча на дальність", "p": ["Дальність кидка залежить від швидкості розбігу, обгону снаряда і кута вильоту. Найсильніша частина кидка — це не рука, а ноги й тулуб, які передають силу руці."], "ul": ["Розбіг — розмірений, без зупинки перед кидком.", "Відведення руки назад на останніх кроках.", "Кидок — через плече, рука прямує вгору-вперед.", "Ліва нога (для правші) — ставиться попереду, як упор.", "Не заступайте за лінію кидка."]}], "f": "", "pr": ["Запишіть свої результати бігу на 30 і 60 м і порівняйте їх з результатами минулої осені; зробіть висновок про прогрес.", "Виконайте 3 підходи по 10 імітацій кидка без снаряда (з відведенням руки й поворотом тулуба) у вільному місці."], "q": ["Як підготуватися до тестування з бігу на 30 і 60 м?", "Що таке фальстарт?", "Від чого залежить дальність метання м'яча?", "Що таке обгін снаряда?"]}, {"n": "81", "t": "Рівномірний біг 1000/1500 м. Удари на точність і зупинки м'яча. Вправи для постави", "g": "Учень знатиме, як розподіляти сили під час рівномірного бігу на середні дистанції, удосконалить удари по м'ячу на точність і зупинки та виконуватиме вправи для постави.", "k": "Модулі: Легка атлетика · Футбол · Загальна фізична підготовка", "terms": [["Рівномірний біг", "біг з постійною швидкістю на всій дистанції, що дає змогу економно витрачати сили."], ["Темп бігу", "швидкість бігу, яку зручно контролювати за часом пробігання кола або відрізка."], ["Зупинка м'яча", "прийом, яким гравець гасить швидкість м'яча й залишає його біля себе для наступної дії."], ["Постава", "звичне положення тіла людини стоячи, сидячи й під час руху."]], "th": [{"h": "Легка атлетика. Рівномірний біг 1000 м (дівчата) і 1500 м (хлопці)", "p": ["На середніх дистанціях найважливіше — розподіл сил. Якщо почати надто швидко, наприкінці не вистачить енергії. Рівномірний темп і ритмічне дихання дають змогу пробігти дистанцію ефективно."], "ul": ["Старт спокійний, без різкого ривка.", "Тримайте однаковий темп на кожному колі.", "Дихання ритмічне: вдих і видих на 2–3 кроки.", "Тулуб прямий, плечі розслаблені.", "Фініш — прискорення на останніх 100–200 м, якщо є сили."]}, {"h": "Футбол. Удари на точність і зупинки м'яча", "p": ["Точний удар — це більше про техніку, ніж про силу. Найточніший спосіб — внутрішньою стороною стопи. Зупинка м'яча готує його до наступної дії: передачі, удару чи ведення."], "ul": ["Опорна нога — поруч із м'ячем, носок у напрямку удару.", "Удар внутрішньою стороною стопи — для точних передач.", "Погляд на м'яч у момент удару.", "Зупинка — м'яким відведенням ноги назад, щоб погасити швидкість.", "Зупинка підошвою — для м'ячів, що котяться."]}, {"h": "Загальна фізична підготовка. Вправи для формування та корекції постави", "p": ["Правильна постава забезпечує нормальну роботу внутрішніх органів, зменшує навантаження на хребет і робить рухи ефективнішими. Її формують сильні м'язи спини, преса та сідниць."], "ul": ["Стійка біля стіни: потилиця, лопатки, сідниці й п'яти торкаються стіни.", "«Човник» лежачи на животі.", "Планка на передпліччях.", "Ходьба з книжкою на голові.", "Розтягування грудних м'язів."]}], "f": "", "pr": ["Виконайте комплекс для постави: стійка біля стіни 1 хв, «човник» 3×10, планка 3×20–30 с, розтягування грудних м'язів 2×20 с.", "Складіть план розподілу сил на дистанції 1000 або 1500 м: як бігти перше коло, середину та фініш."], "q": ["Чому важливо бігти середню дистанцію рівномірно?", "Як правильно дихати під час бігу?", "Який спосіб удару найточніший і чому?", "Які вправи допомагають формувати правильну поставу?"]}, {"n": "82", "t": "Контрольне тестування: рівномірний біг 1000/1500 м. Комплекс ЗРВ", "g": "Учень знатиме, як підготуватися до тесту з бігу на 1000 м (дівчата) і 1500 м (хлопці), як правильно його пробігти та оцінити свій результат і стан.", "k": "Модулі: Легка атлетика · Загальна фізична підготовка", "terms": [["Розкладка сил", "план розподілу швидкості й зусиль на різних частинах дистанції."], ["Мертва точка", "стан тимчасової важкості, задишки й бажання зупинитися на початку тривалого бігу, коли організм ще не пристосувався."], ["Друге дихання", "полегшення стану після подолання мертвої точки, коли дихання й кровообіг пристосовуються до навантаження."], ["Заминка", "повільний біг, ходьба та розтягування після навантаження для поступового відновлення."]], "th": [{"h": "Легка атлетика. Як скласти тест з бігу на 1000/1500 м", "p": ["Тест перевіряє загальну витривалість. Результат фіксують за часом. Щоб показати найкращий результат, потрібно добре розім'ятися, тримати рівномірний темп і не здаватися в момент мертвої точки.", "Оцініть себе не лише за часом, а й за самопочуттям та відновленням пульсу після бігу."], "ul": ["Не їжте щільно за 1,5–2 години до тесту.", "Розминка: легкий біг, ЗРВ, кілька прискорень.", "Перші 200 м — без ривка, займіть зручне місце.", "На мертвій точці — зберігайте темп і зосередьтеся на диханні.", "Після фінішу не сідайте й не лягайте — ходіть 3–5 хвилин."]}, {"h": "Загальна фізична підготовка. Різновиди бігу та ходьби, комплекс ЗРВ", "p": ["ЗРВ перед тривалим бігом мають включати вправи для ніг, тазу й корпусу, а також для дихання. Розминка поступово підвищує пульс, щоб старт не був для організму стресом."], "ul": ["Ходьба з глибоким диханням.", "Повільний біг 3–5 хвилин.", "Нахили, повороти, кругові рухи тазом.", "Махи ногами, випади.", "Розтягування литкових м'язів."]}, {"h": "Загальна фізична підготовка. Заминка та самоконтроль після бігу", "p": ["Після тривалого бігу важливо поступово знизити навантаження. Заминка запобігає запамороченню й прискорює відновлення. Пульс через 2–3 хвилини після фінішу показує, як організм упорався."], "ul": ["Ходьба 3–5 хвилин після фінішу.", "Розтягування литок, стегон, сідниць.", "Пиття води невеликими ковтками.", "Вимірювання пульсу через 1 і 3 хвилини.", "Запишіть результат і самопочуття в щоденник самоконтролю."]}], "f": "Відчуття «другого дихання» знайоме багатьом бігунам: після важкого початку стає легше, бо дихальна й серцево-судинна системи пристосовуються до роботи.", "pr": ["Запишіть свій результат тесту, пульс після фінішу і через 3 хвилини та опишіть, як ви почувалися на різних частинах дистанції.", "Виконайте 10-хвилинний комплекс розтягування для ніг (литки, передня й задня поверхня стегна, сідниці), утримуючи кожне положення 20–30 секунд."], "q": ["Що таке мертва точка і друге дихання?", "Як правильно розподілити сили на дистанції 1000/1500 м?", "Чому не можна одразу сідати після фінішу?", "Як оцінити своє відновлення після бігу?"]}, {"n": "83", "t": "Стрибок у довжину з місця. Естафетний біг. Удари на точність і зупинки м'яча. Постава", "g": "Учень знатиме техніку стрибка в довжину з місця та естафетного бігу, удосконалить удари на точність і зупинки м'яча й виконуватиме вправи для постави.", "k": "Модулі: Легка атлетика · Футбол · Загальна фізична підготовка", "terms": [["Стрибок у довжину з місця", "стрибок з відштовхуванням двома ногами з місця вперед, який показує швидкісно-силову підготовленість ніг."], ["Мах руками", "швидкий рух прямих рук назад, а потім уперед-угору, який допомагає збільшити дальність стрибка."], ["Відштовхування", "активне випрямлення ніг, яке надає тілу швидкість і напрямок польоту."], ["Удар внутрішньою стороною стопи", "удар, під час якого м'яч торкається внутрішньої частини стопи; найточніший спосіб передачі."]], "th": [{"h": "Легка атлетика. Стрибок у довжину з місця та естафетний біг", "p": ["Стрибок з місця складається з підготовки (присідання з махом рук назад), відштовхування, польоту й приземлення. Дальність залежить від сили ніг і узгодженості рухів рук і ніг. В естафеті важлива командна злагодженість і точна передача палички."], "ul": ["Стопи на ширині плечей, носки біля лінії.", "Мах руками назад і напівприсід, потім мах уперед-угору та потужне відштовхування.", "У польоті ноги підтягуються вперед.", "Приземлення — на обидві ноги з м'яким згинанням колін, не падати назад.", "Естафета: передача в межах зони, на швидкості, без озирання."]}, {"h": "Футбол. Удари на точність і зупинки м'яча", "p": ["Точність удару залежить від положення опорної ноги та ударної стопи. Для точних передач на коротку відстань використовують внутрішню сторону стопи. Зупинки м'яча закріплюють у парах."], "ul": ["Опорна нога — на відстані стопи від м'яча.", "Ударна стопа розвернута назовні, гомілкостоп зафіксований.", "Удар по центру м'яча — щоб він котився низом.", "Зупинка внутрішньою стороною — нога рухається назад у момент контакту.", "Перший дотик має спрямувати м'яч у потрібний бік."]}, {"h": "Загальна фізична підготовка. Вправи для формування постави", "p": ["Вправи для постави виконують регулярно, бо постава формується щоденними звичками: як ми сидимо за партою, як носимо рюкзак, як стоїмо."], "ul": ["Носіть рюкзак на обох плечах.", "Під час навчання сидіть з опорою на спинку стільця.", "Кожні 40–45 хвилин — коротка розминка.", "Вправи на зміцнення м'язів спини й преса.", "Стійка біля стіни для перевірки постави."]}], "f": "", "pr": ["Опишіть письмово 4 фази стрибка в довжину з місця і для кожної назвіть одну типову помилку.", "Виконайте 3 підходи по 12 присідань з махом рук назад і вперед-угору (без стрибка), відпрацьовуючи узгодженість рук і ніг."], "q": ["З яких фаз складається стрибок у довжину з місця?", "Як мах руками впливає на дальність стрибка?", "Як правильно виконати удар внутрішньою стороною стопи?", "Які щоденні звички впливають на поставу?"]}, {"n": "84", "t": "Контрольне тестування: стрибок у довжину з місця. Удари на точність і зупинки м'яча", "g": "Учень знатиме, як підготуватися й правильно виконати тест зі стрибка в довжину з місця, як вимірюють результат і як його оцінити, а також удосконалить футбольні навички.", "k": "Модулі: Легка атлетика · Футбол", "terms": [["Вимірювання результату", "визначення дальності стрибка від лінії відштовхування до найближчого сліду, залишеного тілом під час приземлення."], ["Згрупування", "підтягування колін до грудей у польоті, щоб винести ноги якомога далі вперед."], ["Зупинка підошвою", "зупинка м'яча накладанням підошви зверху на м'яч, що котиться."], ["Удар серединою підйому", "удар верхньою частиною стопи (шнурівкою), який дає велику силу удару."]], "th": [{"h": "Легка атлетика. Як виконати тест зі стрибка в довжину з місця", "p": ["Учень виконує зазвичай кілька спроб, і зараховується найкраща. Результат вимірюють від лінії до найближчого сліду п'ят або іншої частини тіла. Тому важливо не лише далеко стрибнути, а й стійко приземлитися, не відкидаючись назад.", "Оцінку виставляє вчитель відповідно до навчальних нормативів, а ви порівнюєте результат з власним попереднім."], "ul": ["Розминка: присідання, випади, кілька пробних стрибків.", "Не заступайте за лінію перед відштовхуванням.", "Відштовхуйтеся одночасно двома ногами.", "Приземляйтеся з руками вперед, щоб не впасти назад.", "Між спробами відпочивайте 1–2 хв."]}, {"h": "Футбол. Удари на точність", "p": ["Удар серединою підйому дає силу, а внутрішньою стороною стопи — точність. У вправах на точність гравці б'ють у задану зону воріт або в ціль, поступово збільшуючи відстань."], "ul": ["Удар серединою підйому: носок відтягнутий, коліно над м'ячем.", "Опорна нога поруч із м'ячем.", "Тулуб над м'ячем — щоб м'яч не злітав угору.", "Точність важливіша за силу.", "Погляд на м'яч під час удару."]}, {"h": "Футбол. Зупинки м'яча у різний спосіб", "p": ["Вибір способу зупинки залежить від висоти та швидкості м'яча. М'ячі, що котяться, зупиняють підошвою або внутрішньою стороною стопи; високі — стегном, грудьми чи підйомом."], "ul": ["Підошва — для м'ячів, що котяться повільно.", "Внутрішня сторона — найнадійніший спосіб.", "Стегно — для м'ячів, що падають на рівні пояса.", "Груди — для високих м'ячів, тулуб злегка відхилити назад.", "Головне — погасити швидкість м'яча м'яким рухом."]}], "f": "", "pr": ["Запишіть результат свого тесту й порівняйте його з результатом минулої осені (якщо є); зробіть висновок про прогрес.", "Виконайте 3 підходи по 10 підйомів на носки та 3 підходи по 12 присідань для зміцнення м'язів ніг."], "q": ["Як вимірюють результат стрибка в довжину з місця?", "Чому важливо не падати назад під час приземлення?", "Чим відрізняється удар серединою підйому від удару внутрішньою стороною стопи?", "Як вибрати спосіб зупинки м'яча?"]}, {"n": "85", "t": "Метання малого м'яча в ціль. Удари на точність і зупинки м'яча. Вправи для постави", "g": "Учень знатиме техніку метання малого м'яча в ціль, удосконалить удари на точність і зупинки, а також зрозуміє причини порушень постави.", "k": "Модулі: Легка атлетика · Футбол · Загальна фізична підготовка", "terms": [["Метання в ціль", "кидок снаряда з метою влучити в задану мішень, де головне — точність, а не дальність."], ["Хват м'яча", "спосіб утримання м'яча пальцями перед кидком."], ["Зупинка стегном", "зупинка м'яча, що падає, передньою частиною стегна з м'яким відведенням ноги вниз."], ["Сутулість", "порушення постави, коли плечі зведені вперед, а грудний відділ хребта надмірно вигнутий назад."]], "th": [{"h": "Легка атлетика. Метання малого м'яча в ціль", "p": ["На відміну від метання на дальність, тут важливий контроль: стабільна стійка, однаковий рух руки і концентрація на цілі. Кидок виконують з місця або з кількох кроків."], "ul": ["Хват: м'яч тримають пальцями, а не долонею.", "Стійка: ліва нога попереду (для правші), погляд на ціль.", "Рука відводиться назад і рухається через плече.", "Випуск м'яча — у момент, коли рука спрямована на ціль.", "Безпека: кидати лише за командою, нікого не має бути біля мішені."]}, {"h": "Футбол. Удари на точність і зупинки", "p": ["Удари на точність закріплюють у вправах: у ворота, у ціль, у задану зону. Зупинки виконують із прийомом м'яча від партнера різної висоти."], "ul": ["Удари у визначену половину воріт.", "Передачі партнерові на відстань 10–15 м.", "Зупинка стегном — для м'ячів середньої висоти.", "Зупинка і одразу передача — два дотики.", "Чергуйте праву й ліву ноги."]}, {"h": "Загальна фізична підготовка. Корекція постави", "p": ["Найпоширеніші порушення постави в старшокласників — сутулість і асиметрія плечей. Причини: тривале сидіння, слабкі м'язи спини, нерівномірне навантаження. Регулярні вправи допомагають їх виправити."], "ul": ["Вправи для м'язів спини: «човник», «плавець».", "Зведення лопаток з гумовою стрічкою або без неї.", "Розтягування грудних м'язів у дверному отворі.", "Планка та бокова планка.", "Перерви під час роботи за комп'ютером."]}], "f": "", "pr": ["Опишіть письмово техніку метання малого м'яча в ціль за фазами (хват, стійка, замах, кидок, завершення) і виконайте 15 повільних імітацій руху руки без снаряда перед дзеркалом.", "Виконайте комплекс проти сутулості: «плавець» 3×10, зведення лопаток 3×15, розтягування грудних м'язів 2×20 с."], "q": ["Чим метання в ціль відрізняється від метання на дальність?", "Як правильно тримати малий м'яч?", "Які причини сутулості?", "Які вправи допомагають виправити поставу?"]}, {"n": "86", "t": "Удари по м'ячу ногою на точність. Зупинки м'яча. Комплекс ЗРВ", "g": "Учень удосконалить техніку ударів на точність і зупинок м'яча, розумітиме роль опорної та ударної ноги.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Опорна нога", "нога, на яку спирається гравець під час удару; її положення визначає напрямок і стабільність удару."], ["Ударна нога", "нога, якою гравець б'є по м'ячу."], ["Зупинка грудьми", "прийом високого м'яча грудьми з відхиленням тулуба назад, щоб м'яч упав перед гравцем."], ["Точність удару", "здатність спрямувати м'яч у задану ціль."]], "th": [{"h": "Загальна фізична підготовка. Різновиди ходьби та бігу, комплекс ЗРВ", "p": ["Перед футбольними вправами розминають гомілкостопи, коліна, стегна й паховий відділ — саме ці ділянки найбільше навантажуються під час ударів."], "ul": ["Ходьба з махами ногами вперед і в сторони.", "Біг з поворотами й прискореннями.", "Обертання в колінних і гомілкостопних суглобах.", "Випади вперед і в сторони.", "Короткі ривки на 10–15 м."]}, {"h": "Футбол. Опорна та ударна нога", "p": ["Від опорної ноги залежить, куди полетить м'яч: носок опорної ноги вказує напрямок удару. Ударна нога рухається маятником, і чим точніше контакт з м'ячем, тим точніший удар."], "ul": ["Опорна нога — поруч із м'ячем, коліно трохи зігнуте.", "Носок опорної ноги — у бік цілі.", "Ударна нога — замах від стегна.", "Гомілкостоп ударної ноги зафіксований.", "Після удару нога продовжує рух у напрямку цілі."]}, {"h": "Футбол. Зупинки м'яча у різний спосіб", "p": ["Зупинки закріплюють з м'ячами різної висоти. Важливо, щоб після зупинки м'яч залишався поруч і можна було одразу виконати наступну дію."], "ul": ["М'ячі, що котяться, — підошвою чи внутрішньою стороною.", "Високі — грудьми чи стегном.", "Тіло розвертається в бік наступної дії.", "Зупиняйте м'яч обома ногами по черзі.", "Погляд — на м'яч, потім на поле."]}], "f": "", "pr": ["Виконайте 3 підходи по 10 махів кожною ногою вперед-назад і в сторони, тримаючись за опору, для розминки кульшових суглобів.", "Опишіть письмово, як положення опорної ноги впливає на напрямок удару, і намалюйте схему (вигляд згори)."], "q": ["Яку роль відіграє опорна нога під час удару?", "Як має рухатися ударна нога?", "Як правильно зупинити м'яч грудьми?", "Які суглоби треба розім'яти перед ударами?"]}, {"n": "87", "t": "Різновиди бігу та ходьби. Зупинки м'яча. Комплекс ЗРВ. Естафетний біг", "g": "Учень удосконалить зупинки м'яча і знатиме правила та техніку естафетного бігу.", "k": "Модулі: Легка атлетика · Футбол · Загальна фізична підготовка", "terms": [["Естафета", "командне змагання, в якому учасники по черзі долають етапи дистанції, передаючи паличку чи естафету."], ["Зона передачі", "ділянка доріжки, в межах якої має відбутися передача естафетної палички."], ["Амортизація", "м'яке гасіння швидкості м'яча чи тіла поступальним рухом назад або згинанням суглобів."], ["Зупинка внутрішньою стороною стопи", "найнадійніший спосіб зупинки м'яча, що котиться або летить низько."]], "th": [{"h": "Легка атлетика. Естафетний біг", "p": ["Естафета — командний вид, де результат залежить від кожного учасника і від якості передач. Передача повинна відбутися в межах зони, інакше команду дискваліфікують."], "ul": ["Бігун, що приймає, стартує, коли партнер добіг до контрольної позначки.", "Передача — за сигналом «Гоп!» чи «Тримай!».", "Паличку передають знизу вгору або згори вниз.", "Не озирайтеся під час прийому — тримайте руку нерухомо.", "Після передачі не виходьте на чужу доріжку."]}, {"h": "Футбол. Зупинки м'яча", "p": ["Ключ до якісної зупинки — амортизація. Нога зустрічає м'яч і рухається назад разом з ним, гасячи його швидкість."], "ul": ["Зустрічайте м'яч, а не чекайте його.", "Нога розслаблена в момент контакту.", "Внутрішня сторона стопи — до м'яча під прямим кутом.", "Зупинка з поворотом — одразу в бік наступної дії.", "Тренуйте на обох ногах."]}, {"h": "Загальна фізична підготовка. Різновиди бігу та ходьби, ЗРВ", "p": ["Різновиди бігу (з високим підніманням стегна, із закиданням гомілки, приставним кроком) розвивають координацію і готують до естафет, де потрібні швидкий старт і зміна напрямку."], "ul": ["Біг з високим підніманням стегна — 20 м.", "Біг із закиданням гомілки — 20 м.", "Біг приставним кроком — 20 м.", "Прискорення — 2–3 рази по 20 м.", "Ходьба з відновленням дихання."]}], "f": "", "pr": ["Намалюйте схему естафетного етапу з зоною передачі та поясніть, коли має стартувати бігун, що приймає паличку.", "Виконайте 3 підходи по 30 секунд ходьби на місці з високим підніманням стегна та активною роботою рук, з 1 хвилиною спокійної ходьби для відновлення між підходами."], "q": ["Що таке зона передачі естафети?", "Як правильно передавати естафетну паличку?", "Що таке амортизація під час зупинки м'яча?", "Які різновиди бігу використовують у розминці?"]}, {"n": "88", "t": "Удари по м'ячу ногою на точність. Зупинки м'яча. Корекція постави", "g": "Учень закріпить удари на точність різними частинами стопи, якість першого дотику та знатиме, як м'язовий корсет впливає на поставу.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Удар зовнішньою частиною підйому", "удар зовнішньою стороною стопи, який дає м'ячу обертання й закручену траєкторію."], ["Перший дотик", "перше торкання м'яча після його отримання, від якого залежить швидкість наступної дії."], ["М'язовий корсет", "м'язи спини, живота й боків тулуба, які утримують хребет у правильному положенні."], ["Правильна постава", "положення тіла, при якому голова тримається прямо, плечі розправлені на одному рівні, а хребет має природні вигини."]], "th": [{"h": "Футбол. Удари на точність різними способами", "p": ["Кожен спосіб удару має своє призначення: внутрішня сторона — точність, середина підйому — сила, зовнішня частина підйому — закручений м'яч. Гравець, який володіє різними ударами, непередбачуваний для суперника."], "ul": ["Внутрішня сторона — короткі й середні передачі.", "Середина підйому — удари по воротах.", "Зовнішня частина підйому — передачі в обхід суперника.", "Удар по центру м'яча — прямолінійний політ.", "Удар збоку по м'ячу — закручений політ."]}, {"h": "Футбол. Перший дотик і зупинки", "p": ["Хороший перший дотик дає час і простір. Гравець має зупинити м'яч так, щоб одразу виконати наступну дію: пас, ведення чи удар."], "ul": ["Перед отриманням м'яча озирніться.", "Відводьте м'яч від суперника першим дотиком.", "Не зупиняйте м'яч «мертво» під собою, якщо треба рухатися.", "Корпус відкритий у бік гри.", "Тренуйте в парах з різними подачами."]}, {"h": "Загальна фізична підготовка. М'язовий корсет і постава", "p": ["Футболістам потрібна сильна спина й прес: вони стабілізують тіло під час ударів і боротьби за м'яч. Ті самі м'язи формують поставу."], "ul": ["Планка на передпліччях — 3×30 с.", "Бокова планка — по 20 с на кожен бік.", "«Супермен» лежачи на животі — 3×10.", "Скручування на прес — 3×15.", "Перевірка постави біля стіни."]}], "f": "", "pr": ["Виконайте комплекс для м'язового корсету: планка 3×30 с, бокова планка 2×20 с на кожен бік, «супермен» 3×10.", "Складіть таблицю «Способи удару у футболі»: спосіб, частина стопи, коли застосовують."], "q": ["Які способи ударів по м'ячу ви знаєте і коли кожен застосовують?", "Чому важливий перший дотик?", "Що таке м'язовий корсет?", "Як перевірити правильність постави?"]}, {"n": "89", "t": "Ривки з ударом по воротах. Фінти з урахуванням амплуа. Ходьба зі зміною ритму", "g": "Учень удосконалить ривки з ударом по воротах, зрозуміє, як обирати фінти залежно від свого амплуа, та навчиться ходьбі зі зміною ритму.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Фінт", "обманний рух тілом, ногою чи поглядом, щоб змусити суперника рухатися в неправильний бік."], ["Ігрове амплуа", "роль гравця в команді: воротар, захисник, півзахисник, нападник."], ["Ривок", "коротке максимально швидке переміщення з місця чи з повільного руху."], ["Зміна ритму", "перехід від повільного до швидкого руху та навпаки, який допомагає обігравати суперника."]], "th": [{"h": "Футбол. Ривки до м'яча з ударом по воротах", "p": ["У грі часто вирішує, хто першим встигне до м'яча. Ривок з подальшим ударом вимагає вміння бити по м'ячу на швидкості, не втрачаючи контролю."], "ul": ["Старт — з низькою позицією та короткими кроками.", "Останній крок — підлаштування опорної ноги.", "Тулуб над м'ячем під час удару.", "Удар у дальній кут воріт складніший для воротаря.", "Після удару — добігання на випадок відскоку."]}, {"h": "Футбол. Фінти з урахуванням ігрового амплуа", "p": ["Кожна позиція має свої улюблені фінти. Нападник використовує фінти для звільнення під удар, півзахисник — для збереження м'яча й передачі, захисник — щоб безпечно вийти з-під тиску."], "ul": ["Нападник: фінт ударом, різка зміна напрямку.", "Півзахисник: фінт передачею, розворот з м'ячем.", "Захисник: фінт корпусом, щоб відкритися для передачі.", "Фінт виконують на відстані 1–2 м від суперника.", "Після фінта — різке прискорення."]}, {"h": "Загальна фізична підготовка. Організаційні вправи, ЗРВ, ходьба зі зміною ритму", "p": ["Ходьба зі зміною ритму розвиває координацію й відчуття темпу: важливо навчитися швидко перемикатися з повільних рухів на швидкі. Ця навичка безпосередньо допомагає у фінтах."], "ul": ["Ходьба повільна — швидка за сигналом.", "Ходьба з чергуванням довгих і коротких кроків.", "Комплекс ЗРВ у русі.", "Чергування бігу й ходьби.", "Відновлення дихання."]}], "f": "", "pr": ["Опишіть, яке ігрове амплуа вам найбільше підходить і які 2 фінти для нього найкорисніші; поясніть чому.", "Виконайте вдома 3 хвилини ходьби на місці зі зміною ритму (20 с повільно — 10 с швидко) і 2 хвилини спокійної ходьби для відновлення."], "q": ["Що таке фінт і навіщо він потрібен?", "Як відрізняються фінти для різних амплуа?", "Як правильно бити по м'ячу після ривка?", "Як зміна ритму допомагає обігрувати суперника?"]}, {"n": "90", "t": "Удари по м'ячу головою. Фінти. Групові дії при швидкій атаці. Профілактика плоскостопості", "g": "Учень знатиме техніку удару по м'ячу головою, принципи групових дій у швидкій атаці та вправи для профілактики плоскостопості.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Удар головою", "удар по м'ячу лобовою частиною голови, яким передають м'яч або б'ють по воротах."], ["Швидка атака", "напад, який розпочинається одразу після відбору м'яча, доки суперник не встиг повернутися в оборону."], ["Плоскостопість", "зміна форми стопи, за якої її склепіння опускається, і стопа гірше амортизує навантаження."], ["Склепіння стопи", "дугоподібна будова стопи, яка забезпечує пружність і амортизацію під час ходьби та бігу."]], "th": [{"h": "Футбол. Удари по м'ячу головою", "p": ["Удар головою виконують лобом, а не тім'ям. Сила удару йде від руху тулуба, а шия залишається напруженою. На уроці удари головою виконують легкими м'ячами й у невеликій кількості."], "ul": ["Дивіться на м'яч до самого контакту, очі відкриті.", "Контакт — лобом, біля лінії волосся.", "Шия напружена, підборіддя трохи притиснуте.", "Удар виконують рухом тулуба вперед.", "Не застосовуйте удар головою при болю чи запамороченні."]}, {"h": "Футбол. Фінти та групові дії у швидкій атаці", "p": ["Швидка атака — найефективніший спосіб забити гол, поки оборона суперника не організована. Вона вимагає швидких передач, відкривання партнерів і рішучих дій нападників."], "ul": ["Після відбору — передача вперед на вільного партнера.", "Нападники відкриваються в глибину.", "Мінімум передач — максимум швидкості.", "Фінт допомагає обіграти останнього захисника.", "Атакуйте чисельною перевагою (2 проти 1, 3 проти 2)."]}, {"h": "Загальна фізична підготовка. Естафета і вправи для профілактики плоскостопості", "p": ["Естафета зі стрибками і бігом розвиває швидкісно-силові якості. Здорова стопа — основа для бігу й стрибків, тому її м'язи треба зміцнювати."], "ul": ["Ходьба на носках, п'ятах, зовнішній стороні стопи.", "Збирання дрібних предметів пальцями ніг.", "Катання м'ячика стопою.", "Згинання й розгинання пальців ніг.", "Ходьба босоніж по різних поверхнях."]}], "f": "", "pr": ["Виконайте комплекс для стоп: ходьба на носках, п'ятах і зовнішньому краї стопи по 30 с, збирання 10 предметів пальцями ніг, катання м'ячика стопою 1 хв кожною ногою.", "Намалюйте схему швидкої атаки 3 проти 2 зі стрілками передач і рухів гравців."], "q": ["Як правильно виконати удар головою?", "У чому суть швидкої атаки?", "Що таке плоскостопість і як її попередити?", "Як фінт допомагає у швидкій атаці?"]}, {"n": "91", "t": "Удари на дальність по футбольному й набивному м'ячах. Швидка атака. Навчальна гра", "g": "Учень знатиме техніку ударів на дальність і безпечну роботу з набивним м'ячем, закріпить групові дії у швидкій атаці та вміння відновлювати дихання.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Набивний м'яч", "обважнений м'яч (медбол) для розвитку сили й швидкісно-силових якостей."], ["Удар на дальність", "удар, під час якого м'ячу надають максимальну швидкість і оптимальну траєкторію польоту."], ["Контратака", "швидкий напад після відбору м'яча, коли команда суперника ще перебуває в атаці."], ["Відновлення дихання", "поступове вирівнювання частоти й глибини дихання після навантаження за допомогою спокійної ходьби та дихальних вправ."]], "th": [{"h": "Футбол. Удари на дальність по футбольному та набивному м'ячу", "p": ["Для удару на дальність використовують середину підйому. М'яч б'ють трохи нижче центру, щоб він летів угору-вперед. Набивний м'яч на уроці не б'ють з розмаху ногою — його використовують для кидків руками та поштовхів, щоб не травмувати стопу."], "ul": ["Розбіг під невеликим кутом до м'яча.", "Опорна нога трохи позаду й збоку від м'яча.", "Удар нижче центру — м'яч летить вгору.", "Носок ударної ноги відтягнутий і зафіксований.", "Набивний м'яч — лише за вказівкою вчителя, з дотриманням техніки."]}, {"h": "Футбол. Групові дії в нападі під час швидкої організації атаки", "p": ["Ключовий момент контратаки — перша передача після відбору. Вона має бути спрямована вперед, у вільну зону. Інші гравці миттєво переходять від захисту до атаки й займають широкі позиції."], "ul": ["Після відбору — погляд уперед.", "Флангові гравці розтягують оборону суперника.", "Гравець з м'ячем рухається в центр, відтягуючи захисників.", "Завершуйте атаку ударом, а не зайвою передачею.", "Підтримка ззаду — на випадок втрати м'яча."]}, {"h": "Загальна фізична підготовка. Навчальна гра та відновлення дихання", "p": ["У навчальній грі застосовують швидкі атаки. Після гри важливо відновити дихання: ходьба зі спокійним глибоким диханням знижує пульс і допомагає організму відновитися."], "ul": ["Вдих через ніс на 3–4 кроки.", "Видих через рот на 4–5 кроків.", "Підняття рук угору на вдиху, опускання на видиху.", "Ходьба 3–5 хвилин після гри.", "Контроль пульсу після відновлення."]}], "f": "", "pr": ["Виконайте 5 хвилин дихальних вправ під час повільної ходьби на місці: вдих на 4 рахунки, видих на 6, руки вгору на вдиху.", "Опишіть письмово, як відбувається контратака у футболі, і назвіть 3 правила, що роблять її ефективною."], "q": ["Як виконати удар на дальність?", "Як безпечно працювати з набивним м'ячем?", "Що таке контратака і чим вона ефективна?", "Як відновлювати дихання після навантаження?"]}, {"n": "92", "t": "Підготовка дівчат у футболі. Вправи з набивним м'ячем. Удари головою. Гра на увагу", "g": "Учень дізнається про особливості футбольної підготовки дівчат, удосконалить удари головою й зупинки, а також розвиватиме концентрацію уваги.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Жіночий футбол", "футбол серед жінок і дівчат, що має власні змагання, збірні та олімпійський турнір."], ["Індивідуальний підхід", "врахування віку, статі, рівня підготовки та стану здоров'я під час планування тренувань."], ["Мах ногою", "швидкий рух прямої або зігнутої ноги вперед, який розвиває швидкісно-силові якості й гнучкість."], ["Зосередження уваги", "здатність тривалий час концентруватися на одному завданні, не відволікаючись."]], "th": [{"h": "Футбол. Особливості підготовки дівчат", "p": ["Жіночий футбол активно розвивається в Україні та світі. Підготовка дівчат загалом подібна до підготовки хлопців, але має особливості: більше уваги приділяють зміцненню м'язів довкола колінних суглобів, корпусу й техніці приземлень, бо дівчата більш схильні до травм зв'язок коліна.", "Також важливо враховувати самопочуття й індивідуальні особливості організму."], "ul": ["Вправи на зміцнення м'язів стегна й сідниць.", "Тренування правильних приземлень і зупинок.", "Розвиток сили корпусу.", "Регулярна розминка й розтягування.", "Індивідуальне дозування навантаження."]}, {"h": "Футбол. Удари головою та зупинки м'яча", "p": ["Удари головою закріплюють з легкими м'ячами та короткими дистанціями. Зупинки поєднують із подальшою передачею."], "ul": ["Удар лобом, очі відкриті.", "Рух тулуба — джерело сили удару.", "Зупинка — м'яка, з амортизацією.", "Після зупинки — передача партнерові.", "Чергування способів зупинки."]}, {"h": "Загальна фізична підготовка. ЗРВ з набивними м'ячами та гра на зосередження уваги", "p": ["Вправи з набивними м'ячами розвивають силу рук, корпусу та ніг. Кидок набивного м'яча за рахунок енергійного маху ногою виконують лише за вказівкою вчителя з легким м'ячем. Ігри на увагу тренують концентрацію — важливу якість для футболіста."], "ul": ["Набивний м'яч: передачі від грудей, з-за голови, повороти з м'ячем.", "Тримайте спину прямо під час підняття м'яча.", "Гра на увагу: виконувати дії лише за певним сигналом.", "Ігри з кольоровими сигналами чи числами.", "Помилки в іграх на увагу — привід усміхнутися, а не засмутитися."]}], "f": "Жіночий футбол входить до програми Олімпійських ігор з 1996 року.", "pr": ["Виконайте вправи для зміцнення м'язів довкола колін: 3×12 присідань із контролем, щоб коліна не заходили всередину, 3×10 «місток» на сідниці, 3×10 підйомів на носки.", "Напишіть 5–6 речень про розвиток жіночого футболу та причини, чому в підготовці дівчат важлива профілактика травм коліна."], "q": ["Які особливості підготовки дівчат у футболі?", "Як правильно виконувати вправи з набивним м'ячем?", "Навіщо футболістові ігри на зосередження уваги?", "Як виконувати удар головою безпечно?"]}, {"n": "93", "t": "Ривок після імітації удару головою. Відбір м'яча у підкаті. Підсилення захисту", "g": "Учень знатиме техніку і правила відбору м'яча у підкаті, зрозуміє принцип підсилення захисту та розвиватиме координацію рухів.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Підкат", "спосіб відбору м'яча, коли захисник у ковзанні вибиває м'яч ногою з-під ніг суперника."], ["Підсилення захисту", "повернення півзахисників і нападників назад, щоб створити чисельну перевагу в обороні."], ["Координація рухів", "здатність узгоджувати рухи різних частин тіла для точного виконання дій."], ["Максимальна швидкість", "найвища швидкість, яку людина здатна розвинути на короткому відрізку."]], "th": [{"h": "Футбол. Біг з максимальною швидкістю після імітації удару головою", "p": ["Ця вправа моделює ігрову ситуацію: гравець вистрибує на м'яч, а потім одразу продовжує боротьбу. Головне — швидко відновити рівновагу після приземлення й зробити ривок."], "ul": ["Імітація удару головою — зі стрибка з двох ніг.", "Приземлення на обидві ноги з амортизацією.", "Одразу — низький старт і прискорення.", "Відрізок — 10–20 м.", "Відпочинок між повтореннями — до відновлення дихання."]}, {"h": "Футбол. Відбирання м'яча у підкаті", "p": ["Підкат — ризикований прийом: невдалий підкат залишає захисника на землі, а неправильний може травмувати суперника. Тому його виконують лише коли інших варіантів немає, і граючи саме в м'яч.", "Підкат ззаду чи двома ногами є грубим порушенням правил."], "ul": ["Виконуйте збоку або спереду, ніколи ззаду.", "Граєте в м'яч, а не в ногу суперника.", "Ковзання на боці стегна, опорна нога зігнута.", "Шипами в суперника — заборонено.", "На уроці — лише імітація або на м'якому газоні за дозволом учителя."]}, {"h": "Футбол. Підсилення захисту та гра на координацію", "p": ["Коли суперник атакує, команда повертає додаткових гравців назад. Це закриває простір і дає змогу відібрати м'яч. Ігри на координацію розвивають уміння швидко узгоджувати рухи."], "ul": ["Півзахисники повертаються до своєї штрафної.", "Захисники тримають лінію й страхують одне одного.", "Підсилення — на тому фланзі, де атакує суперник.", "Гра на координацію: виконувати різні рухи руками й ногами одночасно.", "Після відбору — швидкий перехід в атаку."]}], "f": "", "pr": ["Виконайте вправи на координацію: 3 серії по 30 с поперемінних торкань правою рукою лівого коліна й навпаки, 3 серії по 20 с стояння на одній нозі із заплющеними очима (поруч з опорою).", "Поясніть письмово, у яких ситуаціях підкат допустимий, а в яких — заборонений правилами."], "q": ["Які правила безпеки треба дотримуватися під час підкату?", "Що таке підсилення захисту?", "Навіщо вправа з ривком після імітації удару головою?", "Як можна розвивати координацію рухів?"]}, {"n": "94", "t": "Боротьба за м'яч поштовхами. Підкат. Елементи гри воротаря. Вправи для розслаблення", "g": "Учень знатиме допустимі способи силової боротьби за м'яч, техніку ловіння, відбивання, кидків і вибивання м'яча воротарем та вправи для розслаблення м'язів.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Поштовх плечем", "дозволений правилами спосіб силової боротьби, коли гравець плечем у плече тисне на суперника, борючись за м'яч, що перебуває поруч."], ["Ловіння м'яча", "прийом воротаря, коли м'яч захоплюють обома руками й притискають до тулуба."], ["Вибивання м'яча", "введення м'яча в гру воротарем ударом ноги з рук або з землі."], ["Розслаблення м'язів", "свідоме зняття напруження з м'язів, яке прискорює відновлення."]], "th": [{"h": "Футбол. Боротьба за м'яч поштовхами та підкат", "p": ["Правилами дозволено плечем відштовхувати суперника, якщо м'яч поруч і обидва гравці борються за нього. Заборонено штовхати руками, у спину чи з розгону."], "ul": ["Поштовх — плечем у плече, лікті притиснуті.", "М'яч — у межах досяжності.", "Не стрибайте на суперника.", "Підкат — лише збоку, в м'яч.", "Безпека партнера важливіша за виграний м'яч."]}, {"h": "Футбол. Елементи гри воротаря: ловіння, відбивання, кидки, вибивання", "p": ["Воротар — єдиний гравець, якому дозволено грати руками у своєму штрафному майданчику. Його техніка включає ловіння, відбивання, кидки рукою та вибивання ногою."], "ul": ["Ловіння низького м'яча: долоні вниз, мізинці разом, м'яч притиснути до грудей.", "Ловіння високого м'яча: пальці утворюють «віконце», великі пальці поруч.", "Відбивання — кулаком або долонею, якщо зловити неможливо.", "Кидок рукою — точний і швидкий спосіб почати атаку.", "Вибивання ногою — для далекої передачі."]}, {"h": "Загальна фізична підготовка. Вправи для розслаблення", "p": ["Після інтенсивних вправ м'язи залишаються напруженими. Вправи на розслаблення допомагають їм відновитися й зменшують ризик судом і болю."], "ul": ["Струшування рук і ніг.", "Вільні махи руками в нахилі.", "Глибоке дихання з повільним видихом.", "Лежання на спині з розслабленими руками й ногами.", "Повільна ходьба."]}], "f": "", "pr": ["Виконайте 5-хвилинний комплекс на розслаблення: струшування рук і ніг по 30 с, вільні махи руками в нахилі 30 с, 2 хв лежання на спині з глибоким диханням.", "Опишіть письмово техніку ловіння низького і високого м'яча воротарем та намалюйте положення рук."], "q": ["Які способи силової боротьби дозволені правилами?", "Як воротар ловить низькі та високі м'ячі?", "Коли воротар відбиває м'яч, а не ловить?", "Навіщо потрібні вправи на розслаблення?"]}, {"n": "95", "t": "Біг боком і спиною вперед. Підкат. Гра воротаря на виходах. Узгодження дій в обороні", "g": "Учень знатиме, як воротар визначає напрямок удару й грає на виходах, і розумітиме принципи узгоджених дій в обороні.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Вихід воротаря", "рух воротаря від воріт назустріч м'ячу чи нападникові, щоб перехопити м'яч або зменшити кут для удару."], ["Скорочення кута", "зменшення площі воріт, відкритої для удару, завдяки правильній позиції воротаря."], ["Страхування в обороні", "розташування захисника позаду партнера, який атакує гравця з м'ячем, на випадок, якщо той буде обіграний."], ["Узгодження дій", "спільна робота захисників, коли кожен знає свою зону й підтримує партнера."]], "th": [{"h": "Загальна фізична підготовка. Біг боком і спиною вперед навипередки", "p": ["Захисники й воротарі часто пересуваються боком і спиною вперед, не втрачаючи з поля зору м'яча. Бігати так навипередки можна лише на рівній поверхні й з достатньою відстанню між учасниками."], "ul": ["Спиною вперед: короткі кроки, легкий нахил уперед.", "Боком: приставні або схресні кроки.", "Озирайтеся, щоб не зіткнутися.", "Відрізки — 10–20 м.", "Не виконуйте на мокрому газоні."]}, {"h": "Футбол. Елементи гри воротаря: визначення напрямку удару й гра на виходах", "p": ["Воротар «читає» гру: за положенням тіла й опорної ноги нападника можна передбачити напрямок удару. Вихід на нападника скорочує кут, але залишає ворота відкритими для удару над воротарем."], "ul": ["Стежте за опорною ногою й плечима нападника.", "Вихід — швидкий, із зупинкою перед ударом.", "У момент удару — стійка на зігнутих ногах.", "Виходьте на передачі, лише якщо впевнені, що дістанете м'яч.", "Голосно повідомляйте «Моя!» захисникам."]}, {"h": "Футбол. Узгодження дій в обороні", "p": ["Оборона — справа всієї команди. Один гравець атакує власника м'яча, інший страхує, а решта закривають зони та опікують суперників. Відбір м'яча у підкаті застосовують лише як останній засіб."], "ul": ["Перший захисник — тиск на гравця з м'ячем.", "Другий — страхування на 2–3 м позаду.", "Решта — закривають зони і вільних нападників.", "Спілкування з воротарем.", "Гра на зосередження уваги допомагає не втрачати позицію."]}], "f": "", "pr": ["Намалюйте схему виходу воротаря на нападника і покажіть, як змінюється відкрита для удару площа воріт.", "Виконайте 3 серії по 30 с стрибкової стійки воротаря без стрибків: напівприсід, вага на передній частині стоп, переступання з ноги на ногу."], "q": ["Як воротар визначає напрямок можливого удару?", "Що дає вихід воротаря і який у нього ризик?", "Хто страхує захисника, що атакує суперника з м'ячем?", "Які правила безпеки під час бігу спиною вперед?"]}, {"n": "96", "t": "Воротар у швидкій організації атаки. Організація швидкого нападу. Еластичність м'язів", "g": "Учень зрозуміє роль воротаря в початку атаки, принципи швидкого нападу та знатиме вправи для збільшення еластичності м'язів.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Введення м'яча воротарем", "передача м'яча партнерові рукою чи ногою після того, як воротар заволодів м'ячем."], ["Швидкий напад", "атака, що розвивається з мінімальною кількістю передач і на високій швидкості."], ["Еластичність м'язів", "здатність м'язів розтягуватися й повертатися до вихідної довжини без пошкоджень."], ["Стретчинг", "комплекс вправ на розтягування м'язів, сухожиль і зв'язок."]], "th": [{"h": "Футбол. Елементи гри воротаря: швидка організація атаки", "p": ["Сучасний воротар — це перший нападник. Зловивши м'яч, він може миттєво ввести його у гру кидком рукою чи вибиванням ногою на вільного партнера, поки суперник не повернувся в оборону."], "ul": ["Після ловіння — погляд уперед, пошук вільного партнера.", "Кидок рукою — точний на 20–30 м.", "Вибивання з рук — на велику відстань.", "Не затримуйте м'яч у руках довше дозволеного правилами.", "Домовляйтеся з захисниками про сигнали."]}, {"h": "Футбол. Організація швидкого нападу", "p": ["Швидкий напад вимагає, щоб гравці заздалегідь знали свої дії. Фланговий гравець стартує вперед, центральний нападник тягне захисників, півзахисники підтримують атаку."], "ul": ["Перша передача — вперед, у простір.", "Ведення м'яча на швидкості.", "Відкривання в глибину.", "Чисельна перевага над обороною.", "Завершення ударом по воротах."]}, {"h": "Загальна фізична підготовка. Вправи для збільшення еластичності м'язів", "p": ["Еластичні м'язи менше травмуються, і рухи стають вільнішими. Розтягування виконують на розігрітих м'язах — після розминки або наприкінці заняття."], "ul": ["Розтягування задньої поверхні стегна сидячи.", "Розтягування передньої поверхні стегна стоячи з опорою.", "Розтягування литкових м'язів біля стіни.", "Розтягування привідних м'язів у положенні «метелик».", "Кожне положення — 20–30 с без ривків і болю."]}], "f": "", "pr": ["Виконайте 10-хвилинний стретчинг для ніг: 5 вправ по 2 підходи по 20–30 с, плавно, без болю.", "Опишіть письмово, як воротар може розпочати швидку атаку, і намалюйте один варіант такої атаки."], "q": ["Як воротар може розпочати атаку?", "Які принципи швидкого нападу?", "Чому розтягуватися треба на розігрітих м'язах?", "Які вправи збільшують еластичність м'язів ніг?"]}, {"n": "97", "t": "Біг спиною і розворот. Воротар керує обороною. Захист від швидкого нападу. Самомасаж", "g": "Учень знатиме, як воротар керує партнерами по обороні, як організувати захист проти швидкого нападу та як виконувати самомасаж і струшування.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Командна комунікація", "обмін короткими командами й сигналами між гравцями під час гри."], ["Повернення в оборону", "швидкий біг гравців назад після втрати м'яча, щоб зайняти захисні позиції."], ["Самомасаж", "масаж, який людина виконує сама собі для розслаблення й відновлення м'язів."], ["Струшування", "швидкі дрібні коливальні рухи кінцівками для розслаблення м'язів."]], "th": [{"h": "Загальна фізична підготовка. Швидкий перехід від бігу спиною до звичайного", "p": ["Захисник часто біжить спиною, а потім мусить розвернутися й прискоритися. Швидкий розворот без втрати рівноваги — важлива навичка."], "ul": ["Біг спиною — короткі кроки, погляд уперед.", "Розворот — через плече в бік м'яча.", "Після розвороту — 3–5 швидких кроків.", "Тренуйте розворот в обидва боки.", "Виконуйте на рівній поверхні."]}, {"h": "Футбол. Воротар керує обороною та захист проти швидкого нападу", "p": ["Воротар бачить усе поле, тому він керує захисниками голосом: вказує, кого опікувати, коли виходити, коли триматися. Проти швидкого нападу головне — затримати атаку й дати партнерам повернутися."], "ul": ["Воротар дає короткі команди: «Тримай!», «Виходь!», «Моя!».", "Ближчий гравець затримує суперника з м'ячем, не кидаючись у підкат.", "Решта — максимально швидко повертаються в оборону.", "Захисники закривають центр і шлях до воріт.", "Тактичні фоли — неспортивна поведінка, яку карають."]}, {"h": "Загальна фізична підготовка. Самомасаж і струшування", "p": ["Самомасаж після навантаження покращує кровообіг і прискорює відновлення. Основні прийоми — погладжування, розтирання, розминання й струшування. Рухи виконують у напрямку від периферії до центру (від стопи до стегна)."], "ul": ["Погладжування — легкі ковзні рухи долонями.", "Розтирання — інтенсивніші рухи для розігріву.", "Розминання — захоплення м'яза пальцями й легке стискання.", "Струшування — розслаблені кінцівки, дрібні коливання.", "Не масажуйте ділянки з травмами, синцями, запаленнями."]}], "f": "", "pr": ["Виконайте самомасаж литок і стегон (по 2 хв на кожну ногу): погладжування, розтирання, розминання, струшування.", "Складіть список із 6 коротких команд, якими воротар керує обороною, і поясніть, що кожна означає."], "q": ["Як воротар керує обороною?", "Що треба робити проти швидкого нападу суперника?", "Які прийоми самомасажу ви знаєте і в якому напрямку їх виконують?", "Коли самомасаж протипоказаний?"]}, {"n": "98", "t": "Укидання м'яча на точність. Жонглювання. Організація поступового нападу. Постава", "g": "Учень знатиме правила й техніку укидання м'яча з-за бічної лінії, принципи поступового нападу, удосконалить жонглювання та виконуватиме вправи для постави.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Укидання м'яча", "введення м'яча в гру руками з-за бічної лінії після того, як він вийшов за її межі."], ["Жонглювання", "утримування м'яча в повітрі послідовними дотиками ніг, стегон, голови без падіння на землю."], ["Поступовий напад", "атака з поступовим просуванням м'яча вперед через серію передач, коли оборона суперника вже організована."], ["Контроль м'яча", "уміння утримувати м'яч під своєю владою за допомогою точних дотиків."]], "th": [{"h": "Футбол. Укидання м'яча на точність", "p": ["Укидання виконують двома руками з-за голови, стоячи обличчям до поля. Обидві ноги мають торкатися землі на лінії або за нею. Порушення — укидання переходить до суперника."], "ul": ["М'яч тримають двома руками, пальці розставлені.", "Рух — з-за голови вперед одним махом.", "Обидві ноги на землі в момент кидка.", "Укидайте в ноги або на груди вільному партнерові.", "Партнер відкривається для отримання м'яча."]}, {"h": "Футбол. Жонглювання та поступовий напад", "p": ["Жонглювання розвиває відчуття м'яча й координацію. Поступовий напад застосовують, коли швидка атака неможлива: команда терпляче передає м'яч, шукаючи слабке місце в обороні суперника."], "ul": ["Жонглювання: дотик підйомом, м'яч невисоко.", "Чергуйте ноги, використовуйте стегно.", "Поступовий напад: широке розташування гравців.", "Передачі вбік і назад, щоб змістити оборону.", "Різке прискорення, коли з'являється простір."]}, {"h": "Загальна фізична підготовка. ЗРВ у парах і вправи для постави", "p": ["ЗРВ у парах роблять розминку цікавішою й дозволяють виконувати вправи з опором партнера. Вправи для постави доповнюють тренування, зміцнюючи м'язи, що тримають хребет."], "ul": ["Нахили з опорою на плечі партнера.", "Присідання тримаючись за руки.", "Повороти тулуба з передачею м'яча.", "Стійка біля стіни.", "«Човник» і планка."]}], "f": "", "pr": ["Виконайте 3 підходи по 10 імітацій укидання (руки з-за голови вперед) без м'яча, стоячи обома ногами на підлозі.", "Опишіть письмово різницю між швидким і поступовим нападом: коли застосовують кожен і які в них головні принципи."], "q": ["Які правила укидання м'яча?", "Що розвиває жонглювання?", "Коли застосовують поступовий напад?", "Які ЗРВ можна виконувати в парах?"]}, {"n": "99", "t": "Прискорення й ривки з м'ячем на 30–60 м. Удари з розрахунком сили. Укидання на дальність", "g": "Учень удосконалить ведення м'яча на швидкості, навчиться розраховувати силу удару та дізнається техніку укидання м'яча на дальність і вправи для відновлення дихання.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Ведення на швидкості", "просування з м'ячем, коли гравець відштовхує м'яч далі вперед і рідше торкається його, щоб бігти швидше."], ["Сила удару", "швидкість, яку гравець надає м'ячу; її регулюють довжиною замаху й швидкістю руху ноги."], ["Укидання на дальність", "укидання м'яча з-за бічної лінії з розбігу та максимальним прогином тулуба для далекої передачі."], ["Дихальна гімнастика", "вправи з керуванням ритмом і глибиною дихання для відновлення та розслаблення."]], "th": [{"h": "Футбол. Прискорення й ривки з м'ячем на 30–60 м", "p": ["На вільному просторі гравець веде м'яч на швидкості: відкидає його вперед на 2–3 м і наздоганяє. Важливо не втратити контроль і бачити поле."], "ul": ["Дотик — серединою або зовнішньою частиною підйому.", "М'яч відкидайте недалеко, щоб суперник не перехопив.", "Голову піднімайте між дотиками.", "Біжіть з високою частотою кроків.", "Сповільнюйтеся перед зміною напрямку."]}, {"h": "Футбол. Удари з розрахунком сили та укидання на дальність", "p": ["Удар має бути не найсильнішим, а відповідним до ситуації: на ближнього партнера — м'яко, на далекого — сильніше. Укидання на дальність виконують з розбігу, але обидві ноги в момент кидка мають бути на землі."], "ul": ["Сила удару залежить від замаху й швидкості ноги.", "Коротка передача — короткий замах.", "Довга передача — повний замах, удар підйомом.", "Укидання: розбіг 2–3 кроки, прогин тулуба, кидок з-за голови.", "Ноги не відриваються від землі під час укидання."]}, {"h": "Загальна фізична підготовка. Ходьба з вправами на відновлення дихання", "p": ["Після серії прискорень пульс і дихання прискорюються. Ходьба з дихальними вправами допомагає повернути їх до норми й підготуватися до наступного завдання."], "ul": ["Вдих — руки через сторони вгору.", "Видих — руки вниз, легкий нахил.", "Видих довший за вдих.", "Ходьба в спокійному темпі.", "Контроль пульсу після відновлення."]}], "f": "", "pr": ["Виконайте дихальну гімнастику 5 хвилин: вдих на 4 рахунки з підняттям рук, видих на 6 рахунків з опусканням.", "Опишіть 3 ігрові ситуації, коли треба бити слабко, і 3 — коли сильно, пояснивши свій вибір."], "q": ["Як вести м'яч на високій швидкості?", "Як регулювати силу удару?", "Які правила укидання на дальність?", "Навіщо дихальна гімнастика після навантаження?"]}, {"n": "100", "t": "Естафета з кидками й ловінням. Удари з розрахунком сили. Ведення м'яча у різний спосіб", "g": "Учень удосконалить ведення м'яча різними способами та удари з розрахунком сили, а також розвиватиме спритність в естафетах з м'ячем.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Ведення м'яча", "просування з м'ячем послідовними дотиками ноги, не втрачаючи його контролю."], ["Дозування удару", "вибір сили та способу удару залежно від відстані й ситуації."], ["Ловіння", "захоплення м'яча руками, що летить, з амортизацією."], ["Зміна напрямку", "різкий поворот під час ведення м'яча, щоб обіграти суперника або вийти у вільну зону."]], "th": [{"h": "Загальна фізична підготовка. Естафета з кидками та ловінням м'яча", "p": ["Естафети з м'ячем розвивають спритність, швидкість реакції та командну злагодженість. Ловіння м'яча з амортизацією — корисна навичка й для воротаря."], "ul": ["Ловіть м'яч двома руками, пальці розслаблені.", "Руки рухаються назустріч, потім назад, гасячи швидкість.", "Кидок — точно в руки партнерові.", "Чекайте своєї черги за лінією.", "Чесно виконуйте всі умови естафети."]}, {"h": "Футбол. Ведення м'яча у різний спосіб", "p": ["Ведення внутрішньою стороною стопи — для контролю, зовнішньою — для швидкого руху й обходу, серединою підйому — для бігу по прямій. Добрий гравець володіє всіма способами обома ногами."], "ul": ["Внутрішня сторона — контроль і зміни напрямку.", "Зовнішня сторона — ведення на швидкості й обхід.", "Середина підйому — прямолінійне ведення.", "Підошва — для зупинок і розворотів.", "Тримайте м'яч близько, коли поруч суперник."]}, {"h": "Футбол. Удари з розрахунком сили", "p": ["Удари з розрахунком сили тренують на різних відстанях: 5, 10, 20 м. Мета — щоб м'яч доходив до партнера з зручною швидкістю."], "ul": ["Оцініть відстань до партнера.", "Оберіть спосіб удару.", "Відрегулюйте замах.", "М'яч має котитися рівно, без підскоків.", "Аналізуйте: м'яч не дійшов чи пролетів?"]}], "f": "", "pr": ["Складіть таблицю «Способи ведення м'яча»: спосіб, частина стопи, коли використовують.", "Виконайте 3 підходи по 30 с вправи на спритність: перекидання м'якого невеликого предмета з руки в руку над головою з ловінням, стоячи на місці."], "q": ["Які способи ведення м'яча ви знаєте?", "Як правильно ловити м'яч руками?", "Як дозувати силу удару залежно від відстані?", "Навіщо вміти вести м'яч обома ногами?"]}, {"n": "101", "t": "Правила гри у футбол та арбітраж. Ведення з ривком і ударом у ціль. Ходьба зі зміною ритму", "g": "Учень знатиме основні правила гри у футбол і роботу арбітрів, удосконалить ведення з ривком і ударом у ціль.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Положення поза грою", "ситуація, коли гравець у момент передачі партнера ближче до лінії воріт суперника, ніж м'яч і передостанній гравець суперника, і бере активну участь у грі."], ["Пенальті", "одинадцятиметровий штрафний удар, який призначають за порушення захисників у своєму штрафному майданчику."], ["Жовта картка", "попередження гравцеві за неспортивну поведінку чи грубе порушення; друга жовта означає вилучення."], ["Арбітр", "головний суддя матчу, який стежить за дотриманням правил і ухвалює остаточні рішення."]], "th": [{"h": "Футбол. Основні правила гри", "p": ["Футбольний матч складається з двох таймів по 45 хвилин, у кожній команді на полі 11 гравців, один з яких — воротар. Гол зараховують, коли м'яч повністю перетнув лінію воріт між стійками й під поперечиною.", "Правила захищають безпеку гравців і роблять гру чесною."], "ul": ["Гру руками дозволено лише воротарю в межах свого штрафного майданчика.", "Штрафний удар — прямий або непрямий, залежно від порушення.", "Кутовий удар — якщо м'яч вийшов за лінію воріт від захисника.", "Удар від воріт — якщо від нападника.", "Положення поза грою фіксується в момент передачі."]}, {"h": "Футбол. Арбітраж", "p": ["Матч обслуговує арбітр і його помічники. Арбітр свистком зупиняє гру, жестами показує рішення і картками попереджає або вилучає гравців."], "ul": ["Помічники арбітра — прапорцями показують аути й положення поза грою.", "Жовта картка — попередження.", "Червона картка — вилучення до кінця матчу.", "Перевага: арбітр може не зупиняти гру, якщо це вигідно потерпілій команді.", "Рішення арбітра — остаточне, сперечатися неприпустимо."]}, {"h": "Загальна фізична підготовка. Ведення з ривком і ударом у ціль, ходьба зі зміною ритму", "p": ["Вправа поєднує контроль м'яча, прискорення й точний удар. Ходьба зі зміною ритму наприкінці допомагає відновитися й тренує координацію."], "ul": ["Ведення 10–15 м у середньому темпі.", "Ривок з м'ячем 5–10 м.", "Удар у ціль внутрішньою стороною або підйомом.", "Повернення ходьбою зі зміною ритму.", "Чергування ніг."]}], "f": "Пенальті б'ють з позначки, розташованої на відстані 11 метрів від лінії воріт.", "pr": ["Складіть тест з 6 питань на знання правил футболу з варіантами відповідей і позначте правильні.", "Намалюйте схему ситуації положення поза грою та ситуації, коли його немає, і поясніть різницю."], "q": ["Скільки триває матч і скільки гравців у команді?", "Що таке положення поза грою?", "За що показують жовту і червону картку?", "Як працюють помічники арбітра?"]}, {"n": "102", "t": "Колова естафета з кидками й ловінням м'яча. Навчальна гра. Вправи для еластичності м'язів", "g": "Учень застосовуватиме вивчені технічні й тактичні дії в навчальній грі, розвиватиме спритність у коловій естафеті та знатиме види гнучкості й вправи для еластичності м'язів.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Колова естафета", "естафета, в якій учасники рухаються по колу й передають один одному м'яч чи естафету."], ["Ігрова дисципліна", "виконання гравцем своїх тактичних обов'язків і правил гри впродовж усього матчу."], ["Активна гнучкість", "здатність досягати великої амплітуди руху власними м'язовими зусиллями."], ["Пасивна гнучкість", "амплітуда руху, якої досягають з допомогою зовнішньої сили: партнера, опори, ваги тіла."]], "th": [{"h": "Загальна фізична підготовка. Колова естафета з кидками й ловінням м'яча", "p": ["Колова естафета вимагає швидкої реакції, точних кидків і уважності. Помилка одного учасника впливає на всю команду, тому важлива злагодженість."], "ul": ["Кидайте м'яч точно в руки партнерові.", "Ловіть з амортизацією.", "Тримайте дистанцію в колі.", "Не перебігайте чужі доріжки.", "Підтримуйте партнерів голосом."]}, {"h": "Футбол. Навчальна гра", "p": ["У навчальній грі закріплюють усе вивчене: ведення, передачі, удари, зупинки, швидкий і поступовий напад, організацію оборони. Ігрова дисципліна — ключ до командного успіху."], "ul": ["Тримайте свою позицію в обороні.", "Відкривайтеся для передачі.", "Грайте за правилами, без грубощів.", "Після втрати м'яча — одразу в оборону.", "Поважайте рішення судді."]}, {"h": "Загальна фізична підготовка. Вправи для збільшення еластичності м'язів", "p": ["Гнучкість буває активною й пасивною. Для футболістів важливі обидві: активна — для ударів і махів, пасивна — для профілактики травм. Розвивають її вправами на розтягування після тренування."], "ul": ["Активна: махи ногами з утриманням у верхній точці.", "Пасивна: нахил до прямих ніг сидячи.", "Розтягування привідних м'язів стегна.", "Розтягування литок біля стіни.", "Без ривків і різкого болю."]}], "f": "", "pr": ["Виконайте комплекс на гнучкість: 3 вправи на активну гнучкість (махи з утриманням) і 3 на пасивну (нахили, «метелик», розтягування литок) по 2 підходи.", "Напишіть 4–5 речень про те, як ігрова дисципліна впливає на результат футбольної команди."], "q": ["Чим активна гнучкість відрізняється від пасивної?", "Що таке ігрова дисципліна?", "Як правильно ловити м'яч в естафеті?", "Які вправи збільшують еластичність м'язів?"]}, {"n": "103", "t": "Діставання підвішеного м'яча головою та ногою у стрибку з розбігу. Фінти. Самомасаж", "g": "Учень зрозуміє техніку стрибка з розбігу для діставання високого м'яча, закріпить фінти з урахуванням амплуа та прийоми самомасажу й струшування.", "k": "Модулі: Футбол · Загальна фізична підготовка", "terms": [["Стрибок з розбігу", "стрибок після кількох кроків розбігу з відштовхуванням однією ногою, що дає змогу вистрибнути вище."], ["Відштовхування однією ногою", "активне випрямлення поштовхової ноги з одночасним махом другої ноги й рук угору."], ["Обманний рух", "рух тілом чи ногою, яким гравець показує один напрямок, а рухається в інший."], ["Погладжування", "початковий і завершальний прийом масажу, коли долоня легко ковзає по шкірі."]], "th": [{"h": "Футбол. Діставання підвішеного м'яча головою та ногою у стрибку з розбігу", "p": ["Ця вправа тренує стрибучість і вміння вибрати момент для боротьби за верховий м'яч. Гравець розбігається, відштовхується однією ногою і торкається підвішеного м'яча головою або ногою."], "ul": ["Розбіг — 3–5 кроків.", "Відштовхування однією ногою, мах руками вгору.", "Удар головою — лобом, очі відкриті.", "Торкання ногою — без різкого махового удару, контрольовано.", "Приземлення на дві ноги з амортизацією."]}, {"h": "Футбол. Фінти з урахуванням ігрового амплуа", "p": ["Фінти закріплюють у вправах один на один. Кожен гравець вибирає фінти, які підходять його позиції та стилю гри."], "ul": ["Фінт корпусом — нахил в один бік, рух в інший.", "Фінт ударом — замах без удару.", "Фінт зупинкою — різка зупинка й прискорення.", "Виконуйте фінт до того, як суперник наблизився впритул.", "Після фінта — прискорення в протилежний бік."]}, {"h": "Загальна фізична підготовка. Навчальна гра, самомасаж і струшування", "p": ["Після навчальної гри наприкінці уроку виконують заминку з самомасажем і струшуванням. Це допомагає зняти напруження з м'язів ніг."], "ul": ["Погладжування — 1 хв на кожну ногу.", "Розтирання — долонями поперек м'яза.", "Розминання литок і стегон.", "Струшування — сидячи, нога розслаблена.", "Самомасаж виконують від стопи до стегна."]}], "f": "", "pr": ["Виконайте самомасаж ніг після фізичного навантаження: погладжування, розтирання, розминання й струшування — по 2–3 хвилини на кожну ногу.", "Опишіть письмово 3 фінти, які підходять вашому ігровому амплуа, і поясніть, у яких ситу function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}
