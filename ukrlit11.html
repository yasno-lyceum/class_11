<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Українська література · 11 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.note{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line,#ccc);background:rgba(127,127,127,.08);font-style:italic;font-size:14px;opacity:.9;border-radius:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{info:`<h4>Українська література ХХ ст.</h4>
<p>ХХ ст. – епоха великих відкриттів у науці й техніці; людина усвідомлює, що повністю пізнати світ неможливо, тому виникає новий тип художньої свідомості. Письменники занурюються в загадкову людську душу, свідомість і підсвідомість.</p>
<p>Історичні умови: соціалістична революція, колективізація, голодомори, дві світові війни, сталінські репресії, кілька хвиль еміграції, розпад СРСР і здобуття Україною незалежності. Актуальні проблеми – <b>митець і влада, свобода творчості</b>.</p>
<p>Домінували стильові напрями: <b>модернізм</b> (кінець ХІХ ст. – 1920-і), <b>соцреалізм</b> (1930–1980-і), <b>постмодернізм</b> (1980-і – початок ХХІ ст.).</p>
<h4>«Розстріляне відродження»</h4>
<p>Умовна назва літературно-мистецької генерації 20-х – початку 30-х років ХХ ст. (також «червоний ренесанс»). Знищено: М. Драй-Хмару, М. Зерова, М. Куліша, Л. Курбаса, В. Підмогильного, Є. Плужника, М. Семенка та ін.</p>
<h4>Літературні угруповання</h4>
<ul><li>«Біла студія» (1918), «Музагет» (1919) → «Гроно» (1920), «Аспанфут» (1921, М. Семенко), «Аспис» (1923) → «Ланка» → МАРС (1926).</li>
<li>Харків: «Плуг» (1922–1932, С. Пилипенко) – традиції реалізму, село в дусі партійних вимог; «Гарт» (1923–1925, В. Еллан-Блакитний); <b>ВАПЛІТЕ</b> (1926–1928, президент М. Хвильовий).</li>
<li>Авангард: «Нова генерація» (М. Семенко), «Авангард» (В. Поліщук). Офіційні: «Молодняк», ВУСПП.</li>
<li>Літературна дискусія 1925–1928 рр. – привід: стаття М. Хвильового «Про ”сатану в бочці“…».</li>
<li>1932 р. – Спілка радянських письменників України. 1937 р. в урочищі <b>Сандармох</b> розстріляно 1111 в’язнів Соловків, серед них 130 українських письменників. Понад 500 митців – жертви репресій 1920–1930-х.</li></ul>
<p><b>Соцреалізм</b> – художній метод, проголошений владою в 1930-і роки; базувався на народності, героїзмі трудящих, уславленні комуністичних вождів.</p>`,

{info:`<h4>Авангард. Футуризм</h4>
<p><b>Авангард</b> (фр. avant – спереду, garde – передовий загін) – літературний напрям з радикальним новаторством і схильністю до експериментів. Виявився в абстракціонізмі, дадаїзмі, конструктивізмі, кубізмі, сюрреалізмі, футуризмі.</p>
<p><b>Футуризм</b> (фр. futurum – майбутнє) – авангардний напрям, що заперечував класичну спадщину. Три «м»: <b>місто, машина, маса</b>. Ознаки: урбаністичні мотиви; культ надлюдини; епатажність; прагнення створити мистецтво майбутнього. Засновник – Ф. Т. Марінетті («Маніфест футуристів», 1909). В Україні започаткував <b>М. Семенко</b>; представники – О. Влизько, Ґео Шкурупій. Художники-авангардисти: О. Архипенко, О. Богомазов, Д. Бурлюк, О. Екстер, А. Петрицький.</p>
<h4>Михайль Семенко (1892–1937)</h4>
<ul><li>Народився 31 грудня 1892 р. в с. Кибинцях на Полтавщині. Петербурзький психоневрологічний інститут.</li>
<li>Збірки «Прелюди» (1913), «Дерзання» і «Кверофутуризм» (1914) – початок українського футуризму. У Владивостоці – «П’єро здається», «П’єро кохає».</li>
<li>«Аспанфут», «Нова генерація» (1927–1930). Розстріляний 24 жовтня 1937 р.</li></ul>
<h4>Поезії</h4>
<ul><li>«Бажання» (1914) – прагнення перевернути світ «догори ногами»; верлібр, деструкція, знижені фразеологізми («дати березової каші»), служниця Маша й Петька.</li>

{info:`<h4>Теорія літератури. Кларнетизм</h4>
<p><b>Кларнетизм</b> – термін на позначення стилю ранньої лірики П. Тичини («Соняшні кларнети»). Виражається звуковими (асонанс, алітерація, звуконаслідування, анафора, епіфора), зоровими (епітет, метафора, індивідуально-авторські слова) і формальними засобами (розміщення строф і рядків).</p>
<p><b>Ознаки</b>: музикальність і ритмічність строф; асоціювання; символізм поетичної мови. Поняття: «кольоровий слух», «слуховий колір», «аристократичність духу», «філософська ідея всеєдності». О. Білецький: «З духу музики зародилася ця лірика».</p>
<h4>Аналіз поезій</h4>
<ul><li>«<b>Ви знаєте, як липа шелестить…</b>» (1911) – фольклорний паралелізм (почуття людини – явища природи); провідний мотив – гармонія світу в єдності природи й почуттів закоханої людини; персоніфікації («сплять старі гаї»), риторичні запитання; ознаки імпресіонізму.</li>
<li>«<b>Арфами, арфами…</b>» (1914) – під впливом «Блакитної Панни» М. Вороного; гімн весні, молодості, вірі в щастя; неологізми «самодзвонними», «ніжнотонними»; порівняння «поточки, як дзвіночки»; «Сміх буде, плач буде / Перламутровий…»; рядки-сходинки.</li>

{info:`<h4>«Одчиняйте двері…» (1918)</h4>
<ul><li>Революцію, як і весну, Тичина бачив в образі прекрасної дівчини; сумний мотив навіяний кривавими наслідками захоплення влади більшовиками.</li>
<li>Перша строфа – світлі символи: <b>наречена</b> – нове життя, національне пробудження; <b>голуба блакить</b> – мир. Друга – трагічна: <b>горобина ніч</b> – нічна гроза з бурею; «Всі шляхи в крові!».</li>
<li>Антитеза, кольоровий контраст; алітерація [р], асонанс [о]. Ознаки експресіонізму.</li></ul>
<h4>Теорія літератури. Експресіонізм</h4>
<p><b>Експресіонізм</b> (фр. expression – вираження) – течія модернізму, що виникла на противагу імпресіонізму; нервова емоційність, трагічність світовідчуття, проблема вини і кари. В українській літературі започаткував В. Стефаник, утвердив О. Турянський («Поза межами болю»).</p>
<h4>«Пам’яті тридцяти» (1918)</h4>
<ul><li><b>Вірш-реквієм</b>, громадянська лірика. Присвячений студентам, які в січні 1918 р. під час <b>бою під Крутами</b> потрапили в полон до більшовиків і були страчені; поховані на <b>Аскольдовій могилі</b> в Києві.</li>
<li>Юні захисники – «український цвіт», вороги – <b>Каїн</b> (братовбивці).</li>

{info:`<h4>Євген Плужник (1898–1936)</h4>

{info:`<h4>«Ніч… а човен — як срібний птах!..» (1933)</h4>

{info:`<h4>«Київські неокласики»</h4>
<p>У 20-х роках ХХ ст. в Києві група поетів, що протиставляла себе експериментам футуристів і пролетарському мистецтву, – «<b>п’ятірне гроно</b>»: <b>М. Зеров</b> (лідер), <b>М. Рильський</b>, <b>П. Филипович</b>, <b>М. Драй-Хмара</b>, <b>Юрій Клен</b> (О. Бурґардт). Маніфест – сонет М. Драй-Хмари «Лебеді» (1928): «О гроно п’ятірне нездоланих співців…».</p>
<p>Не мали ні програми, ні статуту; об’єднували захоплення античністю, французькими парнасцями, українським бароко, дружні стосунки. «Парнас» – французьке угруповання поетів «чистого мистецтва» 70-х років ХІХ ст.</p>
<ul><li>Поезія високого стилю, аристократична за духом, вільна від сентиментів і народницьких мотивів.</li>
<li>Гасло в дискусії 1925–1928 рр. – «<b>До джерел!</b>» (творче переосмислення національної й зарубіжної традицій).</li>
<li>Відродили книжну, ренесансно-барокову традицію. Естетична концепція (М. Рильський): «Любов до слова, до строгої форми, до великої спадщини світової літератури».</li>
<li>Зеров, Филипович, Драй-Хмара загинули в репресіях; Юрій Клен емігрував; Рильський став офіційним радянським поетом.</li></ul>
<h4>Теорія літератури. Неокласицизм</h4>
<p><b>Неокласицизм</b> (грецьк. neos – новий) – літературний стиль: поміркованість, гармонія й рівновага; античні, міфологічні, ренесансні теми; вишукані форми (сонет, рондель); уникання буденних проблем.</p>`,

{info:`<h4>Максим Рильський (1895–1964)</h4>
<ul><li>Народився <b>19 березня 1895 р.</b> в Києві. Батько Тадей – етнограф, громадський діяч; мати Меланія – селянка. Дитинство – с. Романівка.</li>
<li>Перша збірка «На білих островах» (1910) – у 15 років; «Під осінніми зорями» (1918). 1919–1929 рр. учителював на Житомирщині.</li>
<li>«Неокласичний» період – збірки «Синя далечінь» (1922), «Крізь бурю і сніг» (1925), «Тринадцята весна» (1926).</li>
<li>1931 р. – арешт, майже рік у Лук’янівській тюрмі; «зізнання». Зі збірки «Знак терезів» (1932) – офіційний радянський поет.</li>
<li>Академік (1943), директор Інституту мистецтвознавства, фольклору та етнографії; Ленінська премія за «Троянди й виноград» (1957) і «Далекі небосхили» (1959). Носив передачі ув’язненому Плужнику. Помер 24 липня 1964 р.</li></ul>
<h4>«Солодкий світ!..» (1919)</h4>
<p>Сповнений вітаїстичності: ліричний герой насолоджується життям, красою, молодістю, коханням. <b>Провідний мотив</b> – захоплення красою й величчю світу. Епітети («простір блакитно-білий», «дух ширококрилий»), порівняння («погляд, ніби пролісок несмілий»), риторичне запитання. Рефрен «Солодкий світ». Будова 4 + 5 + 4 – <b>рондель</b>.</p>
<h4>Сонет «У теплі дні збирання винограду…» (1922)</h4>
<p>Збірка «Синя далечінь». Випадкова зустріч дівчини з немолодим чоловіком; Кіпріда (Афродіта). <b>Провідний мотив</b> – гімн життю й молодості. Порівняння «Ясна, як сад, і радісна, як сміх»; алітерація [сн]. <b>Філософічність</b> – філософське осмислення світу, людини в ньому.</p>
<p><b>Сонет</b> (італ. sonetto, від латин. sonus – звук) – 14 рядків: два катрени й два терцети (4 + 4 + 3 + 3); шекспірівський – 4 + 4 + 4 + 2.</p>`,

{info:`<h4>Роман «Майстер корабля» (1928)</h4>
<ul><li>Автобіографічний, написаний за сім місяців; досвід роботи на Одеській кінофабриці.</li>
<li><b>Тема</b> – море й кіномистецтво; проблема творення нової української культури – «Культура нації — звуть її».</li>
<li>Оповідач – сімдесятилітній <b>То-Ма-Кі</b> (Товариш Майстер Кіно) – сам Яновський.</li>
<li>Прототипи: <b>Сев</b> – О. Довженко; <b>Богдан</b> – Г. Гричер; <b>Професор</b> – В. Кричевський; <b>Директор</b> – П. Нечеса; <b>Тайах</b> – балерина Іта Пензо.</li>
<li>Сюжет багатошаровий, як лялька-мотрійка: спогади То-Ма-Кі – зйомки фільму – сюжет фільму – розповідь Богдана про повстання на Балканах.</li></ul>
<h4>Теорія літератури</h4>
<p><b>Умовність зображення</b> – нетотожність образу об’єкту, зумисне руйнування правдоподібності. <b>Художній час і простір</b> – змодельовані автором; час може забігати наперед або сягати в минуле. Дія переноситься з Одеси до Італії, на о. Яву, в Румунію.</p>
<h4>Неоромантизм роману</h4>
<ul><li><b>Екзотика</b> – перший український мариністичний роман; далекі краї; мелодія імен.</li>
<li><b>Герої, піднесені над буднями</b>: Сев і Редактор – лицарі Прекрасної Дами Тайах.</li>
<li><b>Вітаїзм</b> – ода молодості, любові та творчості: «Людина — натура творча».</li>
<li><b>Символіка</b>: корабель – символ держави (України); майстер корабля – дерев’яна жіноча фігурка, ширше – «веселий народ», що творить свою Республіку. Епіграф з Горація.</li></ul>`,

{info:`<h4>Роман «Місто» (1927)</h4>
<ul><li><b>Сюжет</b>: Степан Радченко, енергійний сільський юнак, їде до Києва вчитися в технічному виші, щоб повернутися в село; захоплюється літературою, стає відомим письменником, залишає навчання. Переконаний: місту потрібна «свіжа кров села». Згодом прилаштовується до міста, думки про село зникають.</li>

{info:`<h4>Образ Степана Радченка</h4>
<p>Складний і неоднозначний: поєднано диявольське з янгольським; показаний у розвитку. Марнославний, егоїстичний, самозакоханий; спровокував самогубство Зоськи. Водночас знає докори сумління, біль, самотність, роздвоєння, відчуття абсурдності буття; схильний до самоаналізу й іронії. Прагне осягати дійсність розумом.</p>
<p><b>Еволюція</b>: від ненависті до міста – до примирення; спаливши старий одяг, звільнився від села й минулого – місто поглинуло «завойовника». Внутрішній конфлікт розум – тіло. Зображення «цілісної» людини – в єдності біологічного, духовного, соціального.</p>
<h4>Жіночі образи</h4>

<tr><td>Надійка</td><td>село; блакитноока, «худеньке, у плескатому капелюшкові»</td></tr>
<tr><td>Тамара Василівна («мусінька»)</td><td>передмістя; немолода, додала Степанові впевненості</td></tr>
<tr><td>Зоська</td><td>місто; сходинка в кар’єрі, тимчасова забавка; покінчила з собою</td></tr>
<tr><td>Рита</td><td>відкритий стиль життя; фальшива й тимчасова, як усе в місті</td></tr></table>
<p>Т. Тимошенко: кожна з жінок – певний етап творчості, щаблі на шляху до ангельської суті. Степан став успішним письменником, але місто не дало йому душевного комфорту: «Що більше Степан свою кімнату встатковував, то чужішою вона йому була».</p>`,

{info:`<h4>«Мисливські усмішки» (1954)</h4>
<p>За лукавим образом оповідача – сам автор, мисливець, який іде на полювання не з метою вбити, а щоб уникнути насильства над природою. Збірка виховує повагу до всього живого. Більшість із 26 усмішок названо за головним героєм: «Лисиця», «Ведмідь», «Бекас», «Вовк», «Сом».</p>
<h4>Усмішка «Сом»</h4>
<ul><li>Починається з мальовничого <b>пейзажу</b>: заплава річки Осколу (Слобожанщина), очерети, куга, верболіз, латаття, водяні лілії, солов’ї, дикі качки; дівочі пісні.</li>
<li>Ведуть сюжет оповідач, <b>дід Панько</b> й безіменний рибалка.</li>
<li>Ковбаня така глибока, що «наша дзвіниця пірне! … Пірне з хрестом!» – глибину вимірюють <b>дзвіницею</b>.</li>
<li>Велетенський сом з’їв гусака, панського собаку сетера-гордона Джоя; міг би з’їсти й катер, «якби тихо плив».</li>
<li>Друга історія – на Дніпрі сом тягнув проти течії човен із дідком.</li>
<li>Фінал – «інструкція» з ловлі сома й побрехеньки: у череві – копчена ковбаса, варений рак, пара шпротів.</li></ul>

{info:`<h4>Національний театр 1920–1930-х</h4>
<p>На початку 1920-х – 74 професійні театри. Два напрями: <b>традиційний</b> (театр ім. І. Франка, режисер Г. Юра – традиції «Театру корифеїв») і <b>експериментальний</b> – <b>Лесь Курбас</b>: «Молодий театр» (1916–1919), «Кийдрамте», з 1922 р. – «<b>Березіль</b>» (з 1926 р. у Харкові). Синкретичний театр: драма + пластика, хорова декламація, цирк, балет, кіно. Курбас ставив «Гайдамаки», «Цар Едіп», «Макбет»; п’єси Куліша «Народний Малахій», «Мина Мазайло», «Маклена Граса». Курбаса розстріляно 1937 р. в Сандармосі.</p>
<h4>Микола Куліш (1892–1937)</h4>
<ul><li>Народився <b>6 грудня 1892 р.</b> в с. Чаплинці Таврійської губернії (нині Херсонщина) в родині батрака. Олешківське училище й гімназія; дружина – Антоніна Невель.</li>
<li>Новоросійський (Одеський) університет; Перша світова війна (поранений). Організував «Просвіту» в Олешках; учасник громадянської війни.</li>
<li>Прославився драмою «<b>97</b>» (1924, постановка Г. Юри) – голод 1921 р. на Херсонщині.</li>
<li>Харків: «Гарт», президент <b>ВАПЛІТЕ</b> (з 1926 р.); будинок «Слово». Підтримав Хвильового в дискусії. Співпраця з Л. Курбасом.</li>
<li>«Народний Малахій», «Мина Мазайло», «<b>Патетична соната</b>» (лірична драма, 1929: Ілько Юга, Марина, Ступай-Ступаненко; будинок-вертеп), «Маклена Граса» (1932).</li>

{info:`<h4>Сатирична комедія «Мина Мазайло»</h4>
<ul><li>Навесні 1929 р. поставлена в Дніпропетровську, Харкові, Києві; Курбас назвав її «епохальним» явищем. 1930 р. знята з репертуару.</li>
<li>Проблема: якою мірою українське суспільство готове бути власне українським, наскільки ми є «третім сортом».</li>
<li><b>Тема</b> (за автором) – «міщанство й українізація». Автор визначив жанр як «<b>філологічний водевіль</b>»; літературознавці – <b>сатирична комедія</b>, комедія типів і поз.</li>
<li><b>Конфлікт</b>: службовець Мина Мазайло (типовий малорос) хоче змінити «мужицьке» прізвище на «благородне» російське <b>Мазєнін</b>; син Мокій – максималіст-романтик, шанувальник усього українського, пропонує додати загублену частинку – <b>Мазайло-Квач</b>.</li>
<li><b>Композиція</b> – чотири дії, кожна починається розмовою Рини з подругою Улею. Рина – стратег «любовного» плану (закохати Улю в Мокія «базою»); гра переходить в антигру: Уля справді закохується й змінює ставлення до української мови.</li></ul>

<p><b>Сатирична комедія</b> – жанр драматичного твору з гострим, дошкульним висміюванням негативних явищ; засоби – іронія, сарказм, гротеск, шарж, карикатура.</p>`,

{info:`<h4>Образи комедії</h4>
<ul><li><b>Тьотя Мотя</b> (Мотрона Розторгуєва з Курська) – великоросійська шовіністка: «Нащо, питаюся, навіщо ви нам іспортілі город?» (напис «Харків»); українці – «австріяцька видумка». Ремарка: «ходила Наполеоном і думала».</li>
<li><b>Мина</b> наймає вчительку «правильних проізношеній» Баронову-Козино: «В інтелігентній мові вимовляють ”єво“…». Передчуває, що українізація – «спосіб зробити з мене… другосортного службовця».</li>
<li><b>Дядько Тарас</b>: «Їхня українізація — це спосіб виявити всіх нас, українців, а тоді знищити разом…»</li>
<li><b>Мокій</b> – фанатик «укрмови», розкриває синонімічне багатство й милозвучність мови.</li>
<li>Пари: Мокій – Баронова-Козино; дядько Тарас – тьотя Мотя; Мина – Мокій; Рина – Уля.</li></ul>
<p>У третій дії всі персонажі в одній кімнаті – «комічно-сатиричний парад характерів». <b>Розв’язка</b>: Мина дізнається з газети про своє звільнення через… опір українізації. Послідовність: телеграма до Курська – навчання «правильних проізношеній» – приїзд тьоті Моті – звільнення Мазайла.</p>
<p>Ю. Шевельов: позитивного героя шукати марно – «усі постаті комедії — тільки легкі й дотепні маски»; український театр дістав «свою найкращу комедію». Фільм-вистава С. Проскурні (1991), тьотя Мотя – Т. Яценко.</p>`,

{info:`<h4>Розвиток літератури в Західній Україні (до 1939 р.)</h4>
<p>1919 р. Західну Україну окупувала Польща, Буковину й Бессарабію – Румунія, Закарпаття – Чехословаччина. Літературний процес відбувався <b>автономно</b>, з орієнтацією на західноєвропейську літературу. Угруповання: «Митуса» (1922), «Логос» (1927, християнське), «Дажбог» (Б.-І. Антонич, Б. Кравців), «Гроно», богемна «Дванадцятка» (1930). Проза – Ірина Вільде, О. Турянський, А. Чайковський, Б. Лепкий; театр «Заграва» В. Блавацького.</p>
<h4>Богдан-Ігор Антонич (1909–1937)</h4>
<ul><li>Народився <b>5 жовтня 1909 р.</b> в с. Новиці на <b>Лемківщині</b> (нині Польща) в родині греко-католицького священика. Львівський університет (1928–1933).</li>
<li>Збірки «Привітання життя» (1931), «Три перстені» (1933), «Книга Лева» (1936); посмертно – «Зелена Євангелія», «Ротації». Помер 6 липня 1937 р., похований на Янівському цвинтарі у Львові.</li>
<li><b>Аполітичний</b> («не збирається бити в барабани якоїсь партії»); життєствердність, метафоричність, <b>міфологізм</b>, <b>асоціативність</b>; «я — закоханий в житті поганин» (язичник, людина природи).</li></ul>
<p><b>«Різдво»</b> (1933) – християнське таїнство поєднане з язичницьким: «Народився Бог на санях / в лемківськім містечку Дуклі»; «місяць — золотий горіх». <b>«Коляда»</b> – «Ходить сонце у крисані»; алітерація свистячих. <b>«Зелена Євангелія»</b> – «Весна — неначе карусель»; «слов’янський дзбан»; провідний мотив – нерозривна єдність природи й людини.</p>
<p><b>Асоціативність</b> – зв’язок між уявленнями за подібністю, суміжністю, контрастом. <b>Міфологізм</b> – поетична реалізація міфу в оригінальній літературі.</p>`,

{info:`<h4>Осип Турянський (1880–1933)</h4>
<ul><li>Народився <b>22 лютого 1880 р.</b> в с. Оглядові (нині Львівщина). Львівська українська гімназія, Віденський університет.</li>
<li>1914 р. мобілізований до австрійської армії, потрапив у <b>сербський полон</b>; етапований через гори Албанії – «<b>дорога смерті</b>». Урятував лікар В. Романишин.</li>
<li>Повість-поема «<b>Поза межами болю</b>» (написана 1917, вийшла 1921). Комедія «Раби», роман «Син землі» (1933). Помер 28 березня 1933 р., похований на Личаківському цвинтарі.</li></ul>
<h4>Поема в прозі «Поза межами болю»</h4>
<ul><li>Історичний матеріал Першої світової війни як предмет художнього узагальнення. Шестеро товаришів відстали від колони й загинули.</li>
<li><b>Умовність зображення</b>: «Поміж небом і землею блукають тисячі й тисячі тіней»; нереальне розпалення вогню одягом.</li>
<li><b>Тема</b> – трагічні події війни й боротьба людини за життя в критичній ситуації; <b>ідея</b> – навіть у найскладніших обставинах залишатися людиною. Автор: «Любов до життя й до його вищих цінностей переможе смерть».</li></ul>
<p><b>Поема в прозі</b> (повість-поема) – великий ліро-епічний твір із всеохопним пафосом і ліризмом. Твір – зразок <b>експресіоністичної</b> прози: суб’єктивність оповіді (від першої особи), увага до психіки, трагізм; оксиморони, інверсії, три крапки. Суголосний з Ремарком («На Західному фронті без змін»), Барбюсом. Екранізація Я. Лупія (1989).</p>`,

{info:`<h4>Література письменників-емігрантів. «Празька школа»</h4>
<p>Історик Б. Кравців підрахував: у 1920–1930-х розстріляно 89 українських письменників, 83 емігрували під час Другої світової війни; з літературного життя вибуло 448 майстрів слова.</p>

{info:`<h4>Іван Багряний (1907–1963)</h4>
<ul><li>Справжнє прізвище – <b>Лозов’ягін</b>. Народився <b>2 жовтня 1907 р.</b> в с. Куземині біля Охтирки (Сумщина) у родині муляра.</li>
<li>Краснопільська художньо-керамічна школа; Київський художній інститут (диплома не дали як «політично неблагонадійному»). Угруповання МАРС.</li>
<li>Віршований роман «Скелька» (1930) заборонено; збірка «Крокви над табором»; арешт, заслання на Далекий Схід; утеча, Бамлаг; арешт 1938 р.</li>
<li>1943 р. у Львові – роман «Звіролови» (1944), перевиданий як «<b>Тигролови</b>» (1946–1947). З 1945 р. – у Німеччині: газета «Українські вісті», памфлет «<b>Чому я не хочу вертатися до СССР?</b>» (зачитували в ООН).</li>
<li>Романи «Сад Гетсиманський» (1950), «Людина біжить над прірвою» (1957). Помер 25 серпня 1963 р. в Німеччині.</li></ul>
<h4>Роман «Тигролови» (1944)</h4>
<p>Написаний за 14 днів; перекладений англійською, голландською, німецькою, данською; цікавився Голлівуд. <b>Тематика</b>: свобода, життя і смерть, вибір місця в історії. <b>Ідея</b> – трагічність буття людини в тоталітарному суспільстві; за будь-яких обставин особистість може й повинна бути Людиною. Проблема свободи й боротьби за визволення.</p>
<h4>Теорія літератури. Пригодницький роман</h4>

{info:`<h4>Композиція й сюжет</h4>
<ul><li>Сюжет напружений, починається з кульмінації (як детектив): Григорій на ходу вистрибує з вагона «ешелону смерті». Відомості про минуле героя розпорошено по тексту.</li>
<li><b>Дві сюжетні лінії</b>: полювання майора НКВС Медвина («новітнього тигролова») за Григорієм; романтична – кохання Григорія й Наталки Сірко.</li>
<li>Пейзажі тайги контрастують з настроєм арештантів або підсилюють події. Неоромантичність: сильний герой, екзотика, романтичне кохання.</li></ul>
<h4>Образи</h4>
<ul><li><b>Григорій Многогрішний</b> – сильна, мужня, вольова особистість; рід – від першого каторжника Сибіру гетьмана Дем’яна Многогрішного. Не визнав себе «коліщатком» системи, зберіг доброту. Кредо: «ліпше вмирати біжучи, ніж жити гниючи».</li>
<li><b>Родина Сірків</b> – представники козацького роду; зберегли традиції й звичаї серед тайги. Денис Сірко: «Я ще не знаю, хто ти, але моя хата — твоя хата… такий закон тут». Сірчиха згадує вишневі сади, барвінок і чорнобривці.</li>
<li><b>Наталка</b>: «У сміливих щастя завжди є!..»</li>
<li><b>Майор Медвин</b> – уособлення тоталітарної системи: «Тут я тобі... й рев, тут я тобі й трибунал!» Григорій: «Я тебе переслідуватиму все твоє життя…»</li></ul>`,

{info:`<h4>Символіка роману</h4>
<ul><li><b>Два потяги</b>, що прямують на схід: «ешелон смерті» з ув’язненими й комфортабельний експрес із партійною елітою, прокурорами, військовими – образ нелюдської радянської імперії.</li>
<li>Експрес нагадує <b>дракона</b> – символ тоталітарної системи.</li>
<li><b>Тигролови</b> – мисливці за тиграми (Сірки й Григорій приручають тигреня); у ширшому сенсі – «ловці» волелюбних людей (Медвин).</li>
<li>Григорій – «гордий сокіл», нескорений волелюбний дух українця.</li></ul>
<h4>Ідея перемоги добра над злом</h4>
<p>В образі Григорія Багряний утілив ідею перемоги добра над злом. Фінал: Многогрішний убиває Медвина й залишає на снігу напис: «Судив і присуд виконав я — Григорій Многогрішний. А за що — цей пес сам знає» – щоб не постраждали інші. Григорій з Наталкою йдуть до Маньчжурії.</p>
<p><b>Популярність</b>: роман видано в США, Англії, Канаді; переклади кількома мовами; у повоєнній Європі твір відкривав правду про радянський тоталітаризм. Фільм Р. Синька «Тигролови» (1994). Актуальність – проблема свободи, гідності, активної життєвої позиції.</p>`,

{info:`<h4>Українська література 40–50-х років ХХ ст.</h4>
<p>Через Другу світову війну ідеологічний тиск послабився. Понад сто письменників воювали на передовій, у партизанських загонах, фронтових виданнях. Загинули М. Трублаїні, О. Теліга, О. Ольжич. Провідні – патріотично-визвольні мотиви, посилення філософічності: «Клятва» М. Бажана, «Україно моя» А. Малишка, «Я утверждаюсь» П. Тичини, «Слово про рідну матір» М. Рильського. «Україна в огні» Довженка, «Любіть Україну» Сосюри, «Жива вода» Яновського – розкритиковані й заборонені. Післявоєнні романи: «Прапороносці» О. Гончара, «Велика рідня» М. Стельмаха. Засилля соцреалізму.</p>
<h4>Олександр Довженко (1894–1956)</h4>
<ul><li>Народився <b>10 вересня 1894 р.</b> в с. В’юнищі (нині Сосниця Чернігівщини). Глухівський учительський інститут; Комерційний інститут у Києві.</li>
<li>Посольство у Варшаві, торгпредство в Німеччині; Берлінська вища школа образотворчого мистецтва. Карикатури під псевдонімом <b>Сашко</b>. «Гарт», ВАПЛІТЕ.</li>
<li>Фільм «<b>Земля</b>» (1930) – світова слава; «Звенигора», «Арсенал», «Іван» (перший звуковий). Чарлі Чаплін: «…одного видатного митця, мислителя й поета — Олександра Довженка». Засновник <b>поетичного кіно</b>.</li>

{info:`<h4>Два ліричні герої</h4>
<p>Двоплановість сюжету: <b>малий Сашко</b> (окремі новели про дитинство, враження) і <b>зрілий митець Олександр Довженко</b> (ліричні відступи, філософське осмислення творчості, праці, природи). Поєднання минулого і сучасного.</p>
<h4>Образи</h4>
<ul><li><b>Дід Семен</b> – «у старих срібнофольгових шатах», «пахнув дід теплою землею й млином»; мудрий, добрий, «наш добрий дух лугу й риби»; навчав любити природу.</li>
<li><b>Прабаба Марусина</b> – «малесенька й така прудка»; прокльони – «її духовна їжа»: «Куди ти тютюн ламаєш, бодай тобі руки й ноги поламало!»</li>
<li><b>Мати Одарка Єрмолаївна</b> – забобонна, спалила Псалтир; любить землю: «Нічого у світі так я не люблю, як саджати що-небудь у землю, щоб проізростало». Образ берегині.</li>
<li><b>Батько Петро</b> – талановитий трудівник: «Багато бачив я гарних людей, але такого, як батько, не бачив»; «тяжкі кайдани неписьменності й несвободи».</li>
<li><b>Сашко</b>: «І от скінчилася моя святість. Не треба було чіпати моркви».</li></ul>
<p>Романтичне світобачення: ворона, що «завідувала погодою»; нафантазований лев біля Десни; картина Божого суду. Морально-етичні проблеми: праця, любов до землі, родина, творчість.</p>`,

{info:`<h4>Василь Симоненко (1935–1963)</h4>
<ul><li>Народився <b>8 січня 1935 р.</b> в с. Біївцях на Полтавщині; виховували мати й дід. Школа в Тарандинцях (9 км в один кінець) – золота медаль. Факультет журналістики Київського університету; «Черкаська правда».</li>
<li>1962 р. жорстоко побитий міліцією на станції Сміла; помер <b>13 грудня 1963 р.</b> (рак нирок), похований у Черкасах. З А. Горською й Л. Танюком розслідував злочини НКВС у Биківні.</li>
<li>О. Гончар: «<b>витязь молодої української поезії</b>». За життя – одна збірка «<b>Тиша і грім</b>» (1962); посмертно – «Земне тяжіння», «Берег чекань» (Мюнхен), новели «Вино з троянд».</li>
<li>«Поет національної ідеї»: «Лебеді материнства», «Де зараз ви, кати мого народу?».</li></ul>
<h4>«Задивляюсь у твої зіниці...» (1962)</h4>
<p>Первісна назва – «Україні». Монолог ліричного героя до України-матері: «Маю я святе синівське право / З матір’ю побуть на самоті»; «Україно, ти моя молитва». Передбачення загибелі: «Я проллюся крапелькою крові / На твоє священне знамено!» Патріотична лірика; громадянський вибір поета.</p>
<h4>«Я...» (1962)</h4>
<p>Філософська лірика. «Ми — не безліч стандартних ”я“, / А безліч всесвітів різних». Провідні мотиви – самоствердження людини, її самодостатність і неповторність. Людина – не гвинтик у державній машині.</p>

{info:`<p class="note">У підручнику інтимна лірика Симоненка представлена коротко: названо вірші «Є в коханні і будні, і свята...», «Вона прийшла», «Ну, скажи, хіба не фантастично...», «Ікс плюс ігрек», наведено строфу з «Ікс плюс ігрек». Повні тексти учитель надає окремо.</p>
<h4>Інтимна лірика В. Симоненка</h4>
<p>Провідні мотиви лірики Симоненка – любов до України, засудження тоталітаризму, оспівування людей праці, утвердження неповторності особистості, краса материнства, жіноча доля, <b>кохання</b>, краса природи.</p>
<p>У віршах інтимної лірики ліричний герой відкриває «формулу» взаємного притягання двох сердець:</p>
<p><i>Я не заздрю уже нікому — / Де ще мудрих таких знайти? / Одному лиш мені відомо: / Ікс плюс ігрек — це будеш ти</i> («Ікс плюс ігрек»).</p>
<p>Поетичні твори Симоненка вражають лаконічністю, прозорістю й глибиною думки, художньою досконалістю й довершеністю рими. О. Мусієнко: Симоненко вразив читача «осяянням краси власної душі, справжністю почуттів».</p>
<h4>Завдання</h4>
<ul><li>Визначте провідний мотив віршів «Ну, скажи, хіба не фантастично...» і «Ікс плюс ігрек».</li>
<li>Знайдіть і поясніть символи у віршах «Я...» і «Задивляюсь у твої зіниці...».</li></ul>`,

{info:`<h4>Дмитро Павличко (нар. 1929 р.)</h4>
<ul><li>Народився <b>28 вересня 1929 р.</b> в с. Стопчатові на Івано-Франківщині в селянській родині. Коломийська гімназія; Львівський університет.</li>
<li>Збірки «Любов і ненависть» (1953), «Правда кличе» (1958), «Гранослов» (1968), «Сонети подільської осені» (1973), «Покаянні псалми» (1994). Збірка любовної лірики «Таємниця твого обличчя».</li>
<li>Перекладач; громадсько-політичний діяч (організатор Народного Руху України, посол у Словаччині й Польщі); сценарії до фільмів «Сон», «Захар Беркут».</li>
<li>Продовжує традиції І. Франка; приділяє увагу сонету; найбільше прославився як <b>поет-пісняр</b> («Лелеченьки», «Два кольори», «Впали роси на покоси»), працював із композитором <b>О. Білашем</b>.</li></ul>
<h4>«Два кольори» (1964)</h4>
<p>За символікою барв близький до фольклорної традиції: «Червоне — то любов, а чорне — то журба». Провідний мотив – <b>дорога</b>: мати вишила синові сорочку червоними й чорними нитками, благословляючи в путь. Вишита сорочка – оберіг, часточка маминої душі. Роль антитези. Музика О. Білаша – стала народною піснею; споріднена з «Піснею про рушник» А. Малишка.</p>
<h4>«Я стужився, мила, за тобою...» (1998)</h4>
<p>Фольклорна образність: ліричний герой – <b>явір</b>, «палений журбою»; потім – <b>скрипка</b> («Скрипку зроблять із його журби») – метаморфоза (як Мавка – верба – сопілка). Інтимна лірика; провідний мотив – туга через нерозділене кохання. Порівняння «печаль, як небеса», персоніфікація «Яворові сниться яворина».</p>`,

{info:`<h4>Іван Драч (1936–2018)</h4>
<ul><li>Народився <b>17 жовтня 1936 р.</b> в с. Теліжинцях на Київщині. Київський університет; Вищі сценарні курси в Москві.</li>
<li>Дебют – поема «Ніж у сонці» (1961); збірка «<b>Соняшник</b>» (1962) – «сонячний поет»; «Протуберанці сонця» (1965), «Балади буднів» (1967); поема «Чорнобильська мадонна» (1986).</li>
<li>Сценарії: «Криниця для спраглих» (реж. Ю. Іллєнко, заборонений 22 роки), «Іду до тебе» (про Лесю Українку), «Пропала грамота».</li>
<li>Продовжував авангардистську течію, обірвану на початку 30-х; сміливі експерименти з формою + фольклорна традиція; асоціації, метафори, гіперболізація. Помер 19 червня 2018 р.</li></ul>
<h4>«Балада про соняшник» (1962)</h4>
<ul><li>Соняшник – хлопчик, що бігає, стріляє горобців з рогатки, – раптом бачить сонце, яке їде на велосипеді «в золотих переливах кучерів, / У червоній сорочці навипуск». «Дайте покататися, дядьку!»</li>

{info:`<h4>Образ любові</h4>
<p>Любов у новелі – висока християнська цінність, що вивищує людину над прагматичною буденністю, очищає душу. Всі «кути» трикутника про все знають, і ніхто нікого не осуджує. Душа Марфи «відділялася від тіла й витала… над сибірськими соснами».</p>
<p><b>Параболічна структура</b>: початок і фінал віддано сприйняттю оповідача-сина. Він не може збагнути, чому Марфа й тато, «одне одного чуючи», так і не одружилися. Відповідь – як заключний акорд: «Тоді не було б тебе...», — шумить велика ”татова сосна“» (М. Наєнко). Зміщення часових площин як художній засіб.</p>
<h4>Теорія літератури. Художня деталь</h4>
<p><b>Художня деталь</b> – характерна риса чи подробиця з відносно самостійним значенням, що емоційно й глибоко змальовує образ, підкреслює важливе. Буває речовою, портретною, пейзажною, нюховою, інтер’єрною.</p>
<ul><li>Марфа <b>ворушить губами</b> – говорить боязко, ніби щось приховує.</li>
<li><b>Сиве волосся</b>, що колись сяяло золотом, – страждання й горе.</li>
<li><b>Новенький дешевий костюмчик</b> оповідача («три вагони цегли розвантажив… то й купив») – скромність і самостійність героя.</li>
<li>Закреслене «нерішучою рукою» й знову написане «Сибір неісходиму».</li>
<li>«Татова сосна».</li></ul>
<p>У повісті «Климко» символічною деталлю є «діжурка».</p>`,

{info:`<h4>Ліна Костенко (нар. 1930 р.)</h4>

<li>Московський літературний інститут ім. О. Горького (з відзнакою); дипломна збірка «Проміння землі». Чоловік – польський письменник Є. Пахльовський; донька Оксана Пахльовська.</li>

<li>«Над берегами вічної ріки» (1977), роман у віршах «<b>Маруся Чурай</b>» (1979), «Неповторність» (1980) – Шевченківська премія (1987); «Сад нетанучих скульптур», «Інкрустації» (премія Петрарки, 1994), «Берестечко» (1999), роман «Записки українського самашедшого» (2010).</li></ul>

<li>Церковна лексика (кадильниці, ладан) – натяк на святість почуттів.</li>

{info:`<h4>Роман у віршах «Маруся Чурай» (1979)</h4>
<ul><li><b>Історичний</b> твір: Україна XVII ст.; Л. Костенко здійснила величезну дослідницьку роботу.</li>
<li>Марусю Чурай називають дівчиною з легенди – документально її існування не підтверджене; перекази, пісні («Орлику, сизий орлику, молодий Чураю!»), зацікавленість Г. Квітки-Основ’яненка.</li>
<li>Легендарна біографія: народилася в Полтаві близько 1625 р.; батько <b>Гордій Чурай</b> зарубав шляхтича, пішов на Січ, учасник повстання Павлюка, страчений. Маруся любила <b>Григорія Бобренка</b>; у неї був закоханий <b>Іван Іскра</b> (син гетьмана Якова Іскри-Остряниці).</li>
<li>Пісні Марусі: «Засвіт встали козаченьки» та ін.</li></ul>
<h4>Теорія літератури. Роман у віршах</h4>
<p><b>Роман у віршах</b> – ліро-епічний жанр, що поєднує ознаки великого розповідного твору (приватне життя в зв’язку із суспільним, кілька сюжетних ліній, багато героїв) і поезії (ліризм, віршовий розмір, тропи).</p>
<h4>Композиція – дев’ять розділів</h4>
<p>«Якби знайшлась неопалима книга» (суд над Марусею) – «Полтавський полк виходить на зорі» – «Сповідь» (центральний: спогади Марусі у в’язниці) – «Гінець до гетьмана» (Іскра мчить до Хмельницького) – «Страта» – «Проща» (Маруся з мандрівним дяком іде до Києва; інтелектуальний центр) – «Дідова балка» – «Облога Полтави» – «Весна, і смерть, і світле воскресіння».</p>`,

{info:`<h4>Проблематика</h4>
<ul><li><b>Патріотизм</b> – готовність безкорисливо служити Україні; лицарі волі й «безкрилі» люди, зосереджені на власному благополуччі.</li>
<li><b>Філософія любові</b>: любов – особлива духовна цінність; любов і зрада.</li>
<li><b>Митець і суспільство</b> (основна): Маруся – геніально обдарована людина, голос і душа народу; її сприймають від захоплення до агресивності як «не таку, як усі»; самотність неординарної особистості («пасмурниця», «чаклунка»). Індивідуальна свобода людини.</li></ul>
<h4>Образи</h4>
<ul><li><b>Гордій Чурай</b>: «Він гордий був. Гордієм він і звався… Стояв на смерть. Ніколи не здавався».</li>
<li><b>Мати</b>: «Здушили сльози — не виходь на люди. / Болить душа — не виявляй на вид».</li>
<li><b>Маруся</b>: «Я — навіжена. Я — дитя любові. / Мені без неї білий світ глевкий».</li>
<li><b>Грицько Бобренко</b> – виріс у сім’ї Чураїв; його любов буденна; «Він народився під такою зіркою, / Що щось в душі двоїлося йому». Мати Бобренчиха «воювала за курку, за телицю».</li>
<li><b>Іван Іскра</b> – шляхетний, зумів зрозуміти Марусю: «Шляхетний дуже і чолом не б’є»; «Ми з вами люди різного коша»; урятував Марусю універсалом Хмельницького.</li>
<li><b>Вишняк</b> – «Вся Україна полум’ям горить, він і на цьому теж нагріє руки».</li></ul>
<p>Мова роману сконденсована; стилізація судових протоколів XVII ст., мова мандрівного дяка з церковнослов’янізмами.</p>`,

// 61 Стус
{info:`<h4>Василь Стус (1938–1985)</h4>
<ul><li>Народився <b>6 січня 1938 р.</b> (на Святвечір) в с. Рахнівці на Вінниччині; дитинство – на Донеччині (м. Сталіно, нині Донецьк). Донецький педінститут; служба на Уралі; аспірантура в Інституті літератури – виключений за участь в акціях протесту.</li>
<li>1972 р. – арешт, мордовські табори (5 років), заслання на Магаданщині (3 роки). Другий арешт – за участь у правозахисній Гельсінській групі.</li>
<li>Помер у таборі особливого режиму на Уралі в ніч з 3 на 4 вересня 1985 р. після сухого голодування; могила № 9. 1989 р. перепохований у Києві на Байковому цвинтарі.</li>
<li>Дружина Валентина Попелюх, син Дмитро.</li>
<li>Періоди: дотюремний («Зимові дерева», Брюссель, 1970; «Веселий цвинтар»), тюремний (невольницька лірика; збірка «<b>Палімпсести</b>», видана 1986), прощальний. Перекладав Ґете, Рільке.</li></ul>

{info:`<h4>«Крізь сотні сумнівів я йду до тебе...» (1972)</h4>
<ul><li>Медитація зі збірки «Палімпсести»; філософська лірика. Ліричний герой прямує до світла, добра й правди («добро і правдо віку») – до Бога, крізь «сотні сумнівів» і «сто зневір».</li>
<li>Бере на себе відповідальність бути «<b>предтечею</b>», що прокладає «шлях правдивий». Образ «стовпа високого вогню».</li>
<li>Провідний мотив – віра особистості в себе, у подолання всіх життєвих перешкод. Стан активної позиції ліричного героя.</li>

<h4>«Господи, гніву пречистого...» (1972)</h4>

<li>Екзистенційна ідея віри особистості у свої сили.</li></ul>
<p>Поезія Стуса – зразок стоїчної поезії у світовій ліриці; узагальнені образи крізь призму індивідуальної долі.</p>`,

{info:`<h4>Сучасна українська література</h4>
<p>Після здобуття незалежності (1991) зняли ідеологічні обмеження. Наприкінці ХХ – на початку ХХІ ст. література набуває <b>транснаціонального</b> характеру; експериментаторські пошуки, відхід від трафаретності соцреалізму.</p>
<p>Як і в 1920-х, молоде покоління гуртувалося в групи: «<b>Бу-Ба-Бу</b>», «ЛуГоСад», «Пропала грамота», «Нова дегенерація», «Пси Святого Юра».</p>
<p>Нове літературне покоління: І. Андрусяк, Ю. Андрухович, О. Забужко, О. Ірванець, А. Кокотюха, В. Кордун, В. Неборак, Г. Пагутяк, Є. Пашковський, С. Процюк, І. Римарук, І. Ципердюк. Їх приваблюють неоавангардистські й постмодерністські віяння.</p>
<p>За КТП розглядаються: І. Римарук («Обнови»), Ю. Андрухович («Астролог», «Пісня мандрівного спудея»), О. Забужко («Рядок з автобіографії», «Читаючи історію»), О. Ірванець («До французького шансоньє»), С. Жадан («Музика, очерет…», «Смерть моряка»).</p>
<p>Жанрові тенденції: пригодницький роман С. Стеценка; історична проза Д. Міщенка; готична новела Ю. Винничука; есеїстика (Андрухович, Забужко, Пагутяк); детективи (В. Шкляр «Ключ», А. Кокотюха); фантастика (М. і С. Дяченки). Поезія: В. Герасим’юк, В. Голобородько, Л. Голота, О. Забужко, І. Калинець, І. Римарук.</p>`,

{info:`<h4>Юрій Андрухович (нар. 1960 р.)</h4>
<ul><li>Народився <b>13 березня 1960 р.</b> в Станіславі (нині Івано-Франківськ). Український поліграфічний інститут у Львові; вищі літературні курси в Москві. Очолював відділ поезії журналу «Перевал». «Патріарх» угруповання «Бу-Ба-Бу».</li>
<li>Мотиви – свобода творчості, насолода навколишнім світом.</li></ul>
<h4>«Пісня мандрівного спудея»</h4>
<p>Ліричний герой – сучасний Г. Сковорода; <b>спудей</b> (студент) – архаїзм. Старослов’янізми й застарілі слова: свита, черленитися, отець, воздавши, проща. Фольклорні символи: явір, небо, соловей. Провідний мотив – захоплення творчістю, яка не знає заборон. Шість окличних речень, порівняння («наче крила голубів»), персоніфікація («явір тихі сльози витирав»).</p>
<h4>«Астролог»</h4>
<p>Ліричний герой – неординарна особистість, живе на горищі, ловить «окраєць нічного неба»; не відмовляється й від «пивнички на Руській» з Юзькою. Провідний мотив – неординарна особистість у навколишньому світі. Різні види римування (перехресне, суміжне, монорима, кільцеве) – змішування форм як ознака постмодернізму. «Земля собі пілігримить».</p>
<p>У КТП також: І. Римарук «Обнови», О. Забужко «Рядок з автобіографії», О. Ірванець «До французького шансоньє», С. Жадан «Музика, очерет…» – тексти учитель надає окремо.</p>`,

{info:`<h4>Теорія літератури. Література масова й елітарна</h4>

<p><b>Масова література</b> (тривіальна) – широко тиражована розважальна або дидактична фабульна проза, адаптована під потреби пересічного читача; переважно позбавлена естетичної цінності. Жанри: комікс, трилер, любовні романи, детективи. Поширені кліше, стереотипи, штампи; напружений сюжет і зазвичай щасливий кінець. Представники: А. Кокотюха, Люко Дашвар, В. і Д. Капранови, Н. Сняданко, В. Шкляр.</p>

{info:`<h4>Теорія літератури. Постмодернізм</h4>
<p><b>Постмодернізм</b> – мистецький напрям останньої третини ХХ ст., який стирає грані між високим мистецтвом і кітчем; переоцінює традиції авангардизму й модернізму; визнає прогрес лише як ілюзію.</p>
<h4>Ознаки</h4>

  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Урок ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Урок ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("ul11_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Українська література 11`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("ul11_theme",d.dataset.theme); }
const th=store.get("ul11_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
